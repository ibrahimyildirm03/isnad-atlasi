ozet: Hıms'ta vefat eden son sahâbî; Şam tâbiîlerinin önemli hocası.
biyografi: |
  Bâhile kabilesindendir. Hz. Peygamber'den defalarca şehadet duası istediği, Resûlullah'ın ise onun için selâmet ve ganimet dilediği rivayet edilir.

  Şam'a, sonra Hıms'a yerleşti ve orada vefat eden son sahâbî kabul edildi. Ondan Şam'ın büyük tâbiîleri Mekhûl, Hâlid b. Ma'dân, Ebû İdrîs el-Havlânî ve Recâ b. Hayve rivayet etti.
