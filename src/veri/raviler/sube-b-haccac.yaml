ozet: '"Hadiste mü''minlerin emîri"; Irak''ta ricâl tenkidini başlatan Basralı muhaddis.'
biyografi: |
  82-87 yılları arasında Vâsıt'ta doğdu; Ezd kabilesinin mevlâsıdır. Gençliğinde şiirle ilgilendi; Asmaî, şiirde Şu'be'den daha bilgilisini görmediğini söylemiştir.

  110'dan önce Basra'ya yerleşti ve Hasan el-Basrî'den fıkıh öğrendi; ardından Hakem b. Uteybe'nin etkisiyle hadise yöneldi. A'meş, Eyyûb es-Sahtiyânî, Katâde, Hammâd b. Ebî Süleymân, Ebû İshâk es-Sebîî ve Mansûr b. el-Mu'temir'den hadis aldı.

  Tedlîsi büyük bir kusur sayar, "an" lafzıyla gelen rivayetleri muttasıl kabul etmez, en küçük şüphede rivayeti terk ederdi. Basra'da sistemli hadis tasnifini ve râvi tenkidini başlattı; Şâfiî onun olmasaydı Irak'ta hadisin bilinmeyeceğini söylemiştir. "Hadiste mü'minlerin emîri" unvanıyla anılan ilk muhaddislerdendir.

  Fakirlere merhametli, dünya malına değer vermeyen biriydi; yöneticilerin ihsanlarını kabul etmedi. Süfyân es-Sevrî, İbnü'l-Mübârek, Yahyâ el-Kattân, Abdurrahmân b. Mehdî, Vekî' ve Ebû Dâvûd et-Tayâlisî onun talebeleridir. 160'ta Basra'da vefat etti.
