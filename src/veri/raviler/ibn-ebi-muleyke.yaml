biyografi: |
  Ebû Bekr Abdullah b. Ubeydillâh b. Ebî Müleyke et-Teymî, Hz. Ali'nin halifeliği döneminde veya daha önce Mekke'de doğdu. Sahâbî olan dedesi Ebû Müleyke Züheyr'e nisbetle tanındı; dedesinin babası Abdullah b. Cüd'ân, Câhiliye'de mazlumları koruyan cömert bir Kureyşliydi.

  Kendi ifadesine göre otuz, İbn Hibbân'a göre seksen sahâbî ile görüştü. Hz. Âişe, Ümmü Seleme, Esmâ bint Ebî Bekir, Abâdile ve Misver b. Mahreme'den rivayet etti. Amr b. Dînâr, Atâ b. Ebî Rebâh, Humeyd et-Tavîl, Eyyûb es-Sahtiyânî, Hammâd b. Seleme, İbn Cüreyc ve Leys b. Sa'd ondan hadis aldı.

  Abdullah b. ez-Zübeyr'in halifeliği döneminde Harem-i Şerîf'te müezzinlik ve imamlık yaptı; Tâif ve Mekke'de kadılık görevinde bulundu. Hadis, fıkıh ve kıraattaki şöhretinin yanında dirayetli bir yönetici ve güçlü bir hatip olarak tanındı. Sika kabul edilir ve rivayetleri Kütüb-i Sitte'de yer alır. 117'de Mekke'de vefat etti.
