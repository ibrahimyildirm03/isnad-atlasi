biyografi: |
  Ebû Nuaym el-Fazl b. Amr (Dükeyn) el-Mülâî, 130 sonlarında doğdu; babasının lakabı Dükeyn olduğu için bu adla tanındı. Kûfe'de çarşaf ve örtü (mülâe) sattığı için "el-Mülâî", Talha b. Ubeydullah ailesinin himayesinde bulunduğu için "et-Teymî" nisbeleriyle anıldı.

  A'meş, Şu'be, Süfyân es-Sevrî, Mâlik ve Ebû Hanîfe'den ders aldı; Sevrî'nin hocalarından yaklaşık yüz âlimden yararlandığını söylemiştir. Buhârî ondan Sahîh'inde 175 hadis rivayet etmiştir; Yahyâ b. Maîn, İshak b. Râhûye, Ahmed b. Hanbel ve Abd b. Humeyd de talebelerindendir.

  Yahyâ b. Maîn ve Ahmed b. Hanbel onu bir telkin denemesine tâbi tuttular: İbn Maîn her on hadise kendisine ait olmayan bir hadis ekleyerek okudu, Ebû Nuaym eklenenleri tek tek reddedip öfkelendi. Ebû Hâtim, ezberindeki hadisleri her seferinde aynı lafızlarla rivayet etmesine hayran kalmıştır.

  Mihnede Kûfe'de sorgulanırken düğmesini koparıp boynunun bu düğmeden daha değerli olmadığını söyleyerek Kur'an'ın mahlûk olmadığını savundu; görüştüğü yaklaşık 870 muhaddisin hiçbirinin aksini söylemediğini belirtti. Çok yoksuldu ve kalabalık ailesini geçindirmek için rivayet karşılığı para almayı meşru gördü. 29 Şâban 219'da Kûfe'de vefat etti.
