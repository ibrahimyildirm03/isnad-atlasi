biyografi: |
  Şâban 94'te Aşağı Mısır'da Kalyûbiye'ye bağlı Karkaşende köyünde doğdu. Ailesinin kökeni İsfahan'a bağlanır; Fehmoğulları'nın âzatlısıdır. Mısır ve Hicaz'da Hişâm b. Urve, Saîd el-Makbürî, Yezîd b. Ebî Habîb ve Yahyâ b. Saîd el-Ensârî'den ders aldı; ilk haccını 113'te yaptı.

  Genç yaşta Mısır'ın önde gelen âlimi oldu; valiler önemli kararlarda ona danışırdı. Yıllık gelirinin 20-25.000 dinar olduğu, ancak malını yıl dolmadan dağıttığı için kendisine zekât farz olmadığı nakledilir; İbn Lehîa ve İmam Mâlik'e büyük yardımlarda bulundu.

  İmam Mâlik, Medine amelini esas almadığı fetvalarını eleştiren bir mektup yazmış; Leys'in cevabî risalesi usul düşüncesi tarihinin önemli belgelerinden sayılır. Mutlak müctehid olmakla birlikte adına bir mezhep oluşmadı. Şâfiî, "Leys esere Mâlik'ten daha çok tâbidir" demiş ve onunla görüşemediğine üzülmüştür. İbnü'l-Mübârek, İbn Vehb, Kuteybe b. Saîd ve Hüşeym talebeleri arasındadır.

  14 Şâban 175'te vefat etti; cenaze namazını Mısır valisi kıldırdı ve Karâfetüssugrâ'ya defnedildi.
