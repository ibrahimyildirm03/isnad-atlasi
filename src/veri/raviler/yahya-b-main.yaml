ozet: Cerh ve ta'dîlin imamı; Buhârî, Müslim ve Ebû Dâvûd'un hocası, Ahmed b. Hanbel'in akranı.
biyografi: |
  158/775'te Bağdat yakınındaki Enbâr'ın Nikyâ köyünde doğdu. Rey'in haracını toplamakla görevli babası varlıklı biriydi; babasından kalan yaklaşık bir milyon dirhemin tamamını hadis tahsiline harcadı.

  Bağdat çevresinden başlayarak Kûfe, Basra, Hicaz, Horasan, Yemen ve Mısır'a yolculuklar yaptı. İbnü'l-Mübârek, Vekî', İbn Uyeyne, Abdurrahmân b. Mehdî, Yahyâ el-Kattân ve Abdürrezzâk'tan hadis aldı. Mükerrerleriyle birlikte bir milyon kadar rivayet yazdığı nakledilir; Ali b. el-Medînî onun kadar çok hadis yazan birini bilmediğini söylemiştir.

  Râviler hakkında titiz ve sert hükümler verdiği için cerh-ta'dîlde "müteşeddid" münekkitler arasında sayılır. Ahmed b. Hanbel hadislerdeki hataları öğrenmek için ona başvurur ve onun nüshasını esas alırdı. Mihnede baskı altında Kur'an'ın mahlûk olduğunu kabul ettiğini söylemesi, bu konuda direnmeyenlerden rivayeti hoş görmeyen Ahmed ile aralarının açılmasına yol açtı.

  et-Târîh, Su'âlâtü İbni'l-Cüneyd ve Ma'rifetü'r-ricâl gibi eserleri büyük ölçüde talebelerinin derlemeleriyle günümüze ulaşmıştır; bunlar ricâl ilminin en eski kaynaklarındandır. Buhârî, Müslim ve Ebû Dâvûd onun talebeleridir. 233'te hac yolculuğu sırasında Medine'de vefat etti; cenaze namazını Medine valisi kıldırdı ve Bakī'e defnedildi.
