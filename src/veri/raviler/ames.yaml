  rumuz: "ع"
  sozler:
    - kim: Yahyâ el-Kattân
      soz: A'meş, allâmetü'l-İslâm'dır.
      kaynak: DİA, "A'meş"
ozet: Kûfe'nin hadis hâfızı ve kıraat imamı; Ebû Hanîfe, Sevrî, Şu'be ve İbn Uyeyne'nin hocası.
biyografi: |
  Aslen Taberistanlıdır; 61 yılında Rey yöresindeki Dünbâvend'de doğdu, Kûfe'de doğduğu da rivayet edilir. Ömrünü Kûfe'de geçirdi.

  Irak kıraatinin temsilcisi Yahyâ b. Vessâb'dan kıraat öğrendi; kıraati yedi ya da on meşhur kıraat arasında yer almasa da kıraat kitaplarında ondan sonra ilk sırada anılır. Hadiste hâfızlık mertebesine ulaştı; İbrâhim en-Nehaî, Mücâhid, Şa'bî, Saîd b. Cübeyr ve Ebû Vâil'den rivayet etti.

  Rivayetleri Kütüb-i Sitte'de yer alır ve genel olarak sika sayılır. Enes b. Mâlik ve Abdullah b. Ebî Evfâ'dan mürsel rivayetlerinde tedlîs yaptığı, Ali b. el-Medînî tarafından vehimle, Zehebî tarafından da bazı râvilerin kusurunu örtmekle itham edildiği belirtilir. Doğruluğu sebebiyle "el-mushaf" diye anıldı.

  Nüktedan ve hazırcevaptı; İbn Tolun bu yönünü ez-Zehrü'l-ena'ş adlı eserinde toplamıştır. Fakir olmasına rağmen beytülmalden aldığı beş dirhemlik aylıkla geçinir, zenginlere iltifat etmezdi. Ebû Hanîfe, Süfyân es-Sevrî, Şu'be, İbn Uyeyne, Vekî' ve Ebû Muâviye ed-Darîr onun talebeleridir. 148'de vefat etti.
