  lakap: el-A'meş
  aciklama: '"A''meş" gözleri zayıf ve sulu olan kimse demektir; bu lakapla tanınır. Doğruluğu sebebiyle "el-mushaf" diye de anılmıştır. Aslen Taberistanlıdır.'
dogum: {hicri: 61, miladi: 680, not: "Kûfe'de doğduğu da rivayet edilir"}
