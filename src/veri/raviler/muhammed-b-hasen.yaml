biyografi: |
  132'de (131 ve 135 da denir) Vâsıt'ta doğdu; ailesi Abbâsîler'in kuruluşundan sonra Kûfe'ye yerleşti. On dört yaşından itibaren dört yıl Ebû Hanîfe'nin ders halkasında bulundu; hocasının vefatından sonra mezhebin görüşlerini özellikle Ebû Yûsuf'tan öğrenmeye devam etti.

  Medine'de üç yılı aşkın kalarak İmam Mâlik'ten el-Muvatta'ı dinledi. Mekke'de Süfyân b. Uyeyne'den, Dımaşk'ta Evzâî'den, Horasan'da Abdullah b. el-Mübârek'ten ders aldı. Bağdat'a yerleşince halkası büyük ilgi gördü ve Ebû Yûsuf'un vefatından sonra ehl-i re'yin lideri oldu. İmam Şâfiî ve Esed b. el-Furât talebeleri arasındadır.

  Hârûnürreşîd onu Ebû Yûsuf'un tavsiyesiyle Rakka kadılığına atadı. Zeydî imamı Yahyâ b. Abdullah meselesinde halifenin güvenini kaybedip 187'de azledildiyse de ilişkiler yeniden düzeldi ve başkadılığa getirildi. 189'da Hârûnürreşîd'le gittiği Rey'de vefat etti.

  Mezhebin görüşlerini kitap, bab ve fasıllara ayırarak sistemli biçimde kaydeden ilk kişi kabul edilir. el-Asl, el-Câmiu's-sagīr, el-Câmiu'l-kebîr, ez-Ziyâdât ve iki Siyer'den oluşan altı eseri "zâhirü'r-rivâye" adıyla Hanefî mezhebinin temel kaynaklarıdır. Yahyâ b. Maîn onu eleştirmiş, Ali b. el-Medînî "sadûk" demiş, Dârekutnî ve Zehebî sika hâfızlar arasında saymıştır.
