biyografi: |
  Ebû Dâvûd Süleymân b. Dâvûd et-Tayâlisî 133'te doğdu; İran asıllı olup Zübeyr b. Avvâm ailesinin mevlâsıdır. İbn Avn ve Hişâm ed-Destüvâî'den hadis öğrendi; 157'de Bağdat'ta, ardından Kûfe ve Medine'de Süfyân es-Sevrî, İsrâîl, İbn Ebî Zi'b, Hammâd b. Seleme ve Hammâd b. Zeyd'den rivayet etti. Bin hocasından hadis yazdığını söylemiştir.

  Basra'da Şu'be'den yedi bin hadis dinledi ve onun önde gelen talebesi oldu; Şu'be'nin derslerinden sonra okunan hadisleri ezberden yazdırırdı. Ahmed b. Hanbel, İbn Ebî Şeybe, İbn Sa'd, Halîfe b. Hayyât ve Abd b. Humeyd ondan ders aldı.

  "İlim dağı" diye anıldı ve otuz-kırk bin hadis naklettiği belirtilir. Ezberden rivayet ettiği için bin kadar hatası olduğu ileri sürülse de bu sayı abartılı kabul edilmiştir. Arkadaşı İbn Mehdî ile hafızayı güçlendirmek için içtikleri bir şerbet yüzünden ağır şekilde rahatsızlandıkları nakledilir.

  Türünün ilk örneklerinden sayılan el-Müsned'inde 2890 hadis bulunur. Rivayetleri Buhârî dışında Kütüb-i Sitte'de yer alır. 204'te Basra'da vefat etti; cenaze namazını Basra valisi kıldırdı.
