ozet: Enes b. Mâlik'in kırk yıl yanından ayrılmayan Basralı zâhid muhaddis; Hammâd b. Seleme'nin hocası.
biyografi: |
  Ebû Muhammed Sâbit b. Eslem el-Bünânî, tercih edilen görüşe göre 41'de Basra'da, Bünâne kabilesinin mahallesinde doğdu. Küçük yaşta ders halkalarına katıldı. Enes b. Mâlik başta olmak üzere Abdullah b. Mugaffel, Ebû Berze, İbn ez-Zübeyr ve İbn Ömer'den; tâbiîlerden Ebü'l-Âliye, Mutarrif ve Ebû Osman en-Nehdî'den hadis dinledi. Enes'e kırk yıl talebelik ve arkadaşlık etti.

  Atâ b. Ebî Rebâh, Katâde, Humeyd et-Tavîl, Ma'mer, Şu'be, A'meş ve Hammâd b. Seleme ondan rivayet etti; Mizzî yüzden fazla râvisini sayar. Yahyâ b. Maîn, Ahmed b. Hanbel ve Nesâî onu sika saymış; Enes'ten rivayet edenler içinde Zührî'den sonra en güvenilir iki râviden biri kabul edilmiştir. Talebesi Hammâd b. Seleme onu sınamak için hadislerde değişiklik yapmış, Sâbit hepsini fark edip düzeltmiştir.

  Günlerini çoğunlukla oruçlu, gecelerini ibadetle geçirirdi; Bekir b. Abdullah el-Müzenî devrin en çok ibadet eden insanını görmek isteyenlere onu gösterirdi. Enes'le karşılaştığında Resûlullah'a dokunmuş olan elini öperdi. Tasavvuf hareketinin öncülerinden sayılır. Kütüb-i Sitte ve Müsned'de ondan yaklaşık 250 hadis vardır. 127'de seksen altı yaşında Basra'da vefat etti.
