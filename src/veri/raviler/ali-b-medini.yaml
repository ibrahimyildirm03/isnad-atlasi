biyografi: |
  161'de Basra'da doğdu; ailesi aslen Medineli olduğu için "el-Medînî" diye anıldı. Babası Abdullah b. Ca'fer de muhaddistir. Süfyân b. Uyeyne, Yahyâ b. Saîd el-Kattân, Hammâd b. Zeyd ve Abdürrezzâk'tan ilim aldı; İbn Uyeyne başta olmak üzere bazı hocaları da ondan rivayet etmiştir.

  İlelü'l-hadîs başta olmak üzere hadis ilimlerinde uzmanlaştı ve "hadiste mü'minlerin emîri" unvanını aldı. Kaynaklara göre yaklaşık iki yüz kitap yazdı; günümüze ulaşan el-İlel, üç ayrı ilel kitabının hulâsasıdır. Nesâî onun için "âdeta muhaddis olmak için yaratılmıştır" demiştir.

  Buhârî Sahîh'ini önce ona incelettirmiş, onayını aldıktan sonra okutmaya başlamıştır; Sahîh'te ondan 303 hadis bulunur. Buhârî, onun yanında olduğu kadar kendini kimsenin yanında küçük görmediğini söylemiştir.

  Mihnede sekiz ay ayaklarından zincirlenerek hapsedildi ve canını kurtarmak için halku'l-Kur'ân görüşünü kabul etmek zorunda kaldı. Bu durum itibarını sarstı ve Ahmed b. Hanbel ondan rivayet etmeyi bıraktı. Buhârî, Ebû Dâvûd ve Ebû Hâtim talebeleri arasındadır. 234'te Sâmerrâ'da vefat etti.
