ozet: En çok hadis rivayet eden ikinci sahâbî; Nâfi' ve Mâlik üzerinden "altın zincir"in başı.
biyografi: |
  Nübüvvetin üçüncü yılında Mekke'de doğdu, babası Hz. Ömer ile birlikte küçük yaşta müslüman oldu ve Medine'ye hicret etti. Yaşı küçük olduğu için Bedir ve Uhud'a alınmadı; Hendek'ten itibaren seferlere katıldı.

  Hz. Peygamber'in sünnetine titizlikle uymasıyla tanınır; hadisleri lafzına sadık kalarak rivayet etti. Altmış yıl boyunca fetva verdi. Buhârî'nin en sahih isnad saydığı "Mâlik → Nâfi' → İbn Ömer" zinciri onun üzerinden yürür. İç savaşlarda tarafsız kaldı; 73 yılında Mekke'de vefat etti.
