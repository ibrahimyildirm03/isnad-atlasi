ozet: Akabe nakiblerinden; Hz. Ömer'in Şam'a muallim olarak gönderdiği, Filistin kadısı.
biyografi: |
  Birinci ve İkinci Akabe biatlarına katıldı; İkinci Akabe'de seçilen on iki nakibden biriydi. Bedir başta olmak üzere bütün gazvelerde bulundu.

  Hz. Ömer onu Muâz b. Cebel ve Ebü'd-Derdâ ile birlikte Şam'a Kur'an ve fıkıh öğretmeye gönderdi; Hıms'ta, sonra Filistin'de kalıp Kudüs'te kadılık yaptı. Ondan Ebû Ümâme, Enes, Câbir, Ebû Müslim el-Havlânî, Cübeyr b. Nüfeyr, Ebû İdrîs el-Havlânî ve Atâ b. Yesâr rivayet etti.
