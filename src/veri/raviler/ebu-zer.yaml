ozet: '"Ebû Zer\''den daha doğru sözlü kimse yoktur" övgüsüne mazhar olan zâhid sahâbî.'
biyografi: |
  Gıfâr kabilesindendir; ilk müslümanlardandır. Hz. Peygamber onun hakkında gökkubbenin altında ondan daha doğru sözlü kimse bulunmadığını söylemiştir.

  İhtiyaç fazlası malın Allah yolunda harcanması gerektiğini savundu. Hz. Osman döneminde Şam'da Muâviye'nin harcamalarını eleştirmesi yönetimle ihtilafa dönüştü. Medine'den Rebeze'ye gönderildi ve 32 yılında orada vefat etti. Ondan Enes, İbn Abbâs, İbn Ömer, Zir b. Hubeyş, Saîd b. el-Müseyyeb ve Atâ b. Yesâr rivayet etti.
