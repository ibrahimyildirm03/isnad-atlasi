ozet: Sitedeki sahâbe hadis sayılarının kaynağı olan büyük Müsned'in müellifi Endülüslü muhaddis.
biyografi: |
  201'de veya daha önce Kurtuba'da doğdu; dedeleri ve babası fakihti. Yirmi dört yaşında doğuya ilim yolculuğuna çıktı. İfrîkıye'de Sahnûn'dan, Mısır'da Yahyâ b. Bükeyr'den, Medine'de Ebû Mus'ab ez-Zührî'den hadis okudu; Bağdat'ta Ahmed b. Hanbel'den hadis ve fıkıh öğrendi.

  Yaklaşık 244'te Endülüs'e döndükten sonra on dört yıl süren ikinci bir yolculuğa çıktı; ilim merkezlerini yaya olarak dolaştı. Ebû Bekir b. Ebî Şeybe'den el-Musannef'i, Halîfe b. Hayyât'tan et-Târîh'i rivayet etti. 284 hocası tespit edilmiştir; gezdiği yerlerden hadis topladığı için arkadaşları ona "süpürge" lakabını taktı.

  Getirdiği hadis kitapları ve hadise göre fetva vermesi, re'y taraftarı Mâlikîlerin tepkisine yol açtı ve bid'atçilikle suçlanıp emîre şikâyet edildi. Emîr I. Muhammed eserini inceleyip bir nüshasını kendi kütüphanesi için yazdırdı ve serbestçe ders vermesine izin verdi. Böylece Kurtuba, yalnızca Mâlikî görüşlerinin okutulduğu bir yerden hadis merkezine dönüştü.

  1300'den fazla sahâbînin rivayetini içeren el-Müsnedü'l-kebîr'i, hadisleri sahâbî adına göre, her sahâbînin rivayetlerini de fıkıh konularına göre sıralar. Cuma dışında sürekli oruç tuttuğu ve yaklaşık yetmiş gazveye katıldığı rivayet edilir. 28 Cemâziyelâhir 276'da Kurtuba'da vefat etti.
