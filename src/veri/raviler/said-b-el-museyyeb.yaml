  aciklama: Babası Müseyyeb ve dedesi Hazn sahâbîdir. Babasının adı "Müseyyib" diye de okunur; kendisinin bu okuyuşu hoş görmediği nakledilir.
rical:
  tehzibul_kemal: XI, 66
  tehzibut_tehzib: 2/43 (Şâmile neşri)
