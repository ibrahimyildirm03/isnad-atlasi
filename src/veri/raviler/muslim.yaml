ozet: Buhârî'nin Sahîh'iyle birlikte "Sahîhayn" diye anılan el-Câmiu's-sahîh'in müellifi.
biyografi: |
  206'da Nîşâbur'da doğdu; Benî Kuşeyr'in mevlâsı olduğu için Kuşeyrî diye anılır. Eğitimci babasından ve çevredeki âlimlerden okudu, on iki yaşında hadis öğrenmeye başladı. Nîşâbur'da Yahyâ b. Yahyâ ve İshâk b. Râhûye'den istifade etti; iki yıl sonra hac için Hicaz'a gidip Medine ve Mekke'de hadis dinledi.

  230'dan önce yeniden yolculuğa çıkarak Basra, Belh, Kûfe, Rey ve Mısır'a uğradı; Bağdat'a birkaç kez gidip Ahmed b. Hanbel gibi âlimlerden hadis aldı. Kumaş ticaretiyle geçindi ve cömertliği sebebiyle "Nîşâbur'un cömerdi" diye anıldı.

  Buhârî Nîşâbur'a geldiğinde onun ilmine hayran kalıp yanından ayrılmadı ve halku'l-Kur'ân tartışmasında onu savundu. Hocası Zühlî'nin Buhârî'ye cephe alması üzerine Zühlî'den yazdığı hadisleri geri gönderip ondan ayrıldı. Bununla birlikte el-Câmiu's-sahîh'inde ne Buhârî'den ne de Zühlî'den rivayet etti.

  el-Câmiu's-sahîh tekrarlarıyla yaklaşık 12.000, tekrarsız yaklaşık 4000 hadis içerir. En belirgin özelliği, bir hadisin güvenilir rivayetlerini senedleriyle tek yerde bir araya getirmesidir. Eserini Rey'de Ebû Zür'a er-Râzî'ye okuyup onun tenkitlerini dikkate aldı. Buhârî'nin eseriyle birlikte "Sahîhayn" diye anılır.

  Kitâbü't-Temyîz, et-Tabakāt, el-Künâ ve'l-esmâ ve el-Münferidât ve'l-vuhdân diğer eserlerindendir. Cerh ve ta'dîl âlimlerinden sayılır; bir fıkıh mezhebine bağlanmadı. 25 Receb 261'de Nîşâbur'da vefat etti ve Nasrâbâd kabristanına defnedildi.
