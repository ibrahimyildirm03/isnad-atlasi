biyografi: |
  607'de Medine'de doğdu; Hazrec'in Selimeoğulları kolundandır. Babasıyla birlikte İkinci Akabe biatına katıldı ve yetmişlik heyetin en küçüğüydü. Babası Abdullah b. Amr, Uhud'da ilk şehid düşen sahâbîdir.

  Kız kardeşlerine bakmakla yükümlü olduğu için Uhud'a kadar gazvelere katılamadı; sonrasında Hz. Peygamber ile on dokuz gazvede bulundu. Hudeybiye'de Bey'atü'r-rıdvân'a katıldı. Hz. Peygamber'in vefatından sonra Şam'ın fethinde bulundu ve tek bir hadisi doğrudan işitmek için Şam'a bir aylık yolculuk yaptı; bu yolculuk hadis için yapılan rıhlelerin ilk örneklerinden sayılır.

  Mescid-i Nebevî'de bir ilim halkası kurdu; hac rivayetlerini içeren bir sahîfesi vardı. Ömrünün sonunda gözlerini kaybetti. Bakī b. Mahled'in Müsned'indeki 1540 rivayetiyle müksirûndandır. Saîd b. el-Müseyyeb, Hasan el-Basrî, Şa'bî, Atâ, İbnü'l-Münkedir ve Muhammed el-Bâkır onun talebeleri arasındadır. 78/697'de Medine'de vefat etti; Medine'de vefat eden son sahâbîlerdendir.
