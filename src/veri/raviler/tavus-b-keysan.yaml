ozet: Hem Yemen'in hem Mekke'nin fakihleri arasında sayılan, İbn Abbâs'ın seçkin talebesi.
biyografi: |
  Ebû Abdirrahmân Tâvûs b. Keysân el-Yemânî 33'te Yemen'de doğdu ve Cened şehrinde yaşadı; ailesinin Sâsânîlerin Yemen'e gönderdiği askerlerin soyundan geldiği belirtilir. Elli kadar sahâbîden ilim öğrendi; en çok birlikte olduğu İbn Abbas'ın seçkin talebelerinden sayılır ve kıraati de ondan aldı.

  Oğlu Abdullah, Vehb b. Münebbih, Zührî, Mücâhid, Amr b. Dînâr ve Mekhûl ondan rivayet etti. Sika ve hâfız kabul edilir; rivayetleri Kütüb-i Sitte, Müsned ve Dârimî'nin Sünen'inde yer alır. Mekke tefsir ekolünün önde gelenlerindendir; ancak âyetlerin fıkhî yönüne ağırlık verdiği için daha çok fakih olarak öne çıkar. İnsanlar sıkı davrandığında ruhsat verir, gevşek davrandıklarında titizlik gösterirdi.

  Emevî idarecilerinden uzak durdu, kapılarına gitmedi ve hediyelerini kabul etmedi. Ömer b. Abdülazîz'e, hayırlı işler istiyorsa hayırlı kimseleri iş başına getirmesini yazmış; halife bunu öğüt olarak yeterli bulmuştur. San'a ve Cened'de kadılık yaptı. Kırk defa hacca gittiği kaydedilir.

  Son yıllarını Mekke'de geçirdi; hacda Mina'da hastalandı ve 7 Zilhicce 106'da vefat etti. Cenaze namazını Halife Hişâm Kâbe'de kıldırdı.
