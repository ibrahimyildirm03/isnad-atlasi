isim: Ebû İshâk es-Sebîî
tam_isim: Ebû İshâk Amr b. Abdillâh b. Zî Yuhmid es-Sebîî el-Hemdânî el-Kûfî
arapca: أبو إسحاق السبيعي عمرو بن عبد الله
tabaka: tabiin
