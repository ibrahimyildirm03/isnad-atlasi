  kunye: Ebû İshâk
  ism: Amr
  nesep: Amr b. Abdillâh b. Zî Yuhmid (Ubeyd)
  nesep_arapca: عمرو بن عبد الله بن ذي يحمد السبيعي الهمداني الكوفي
  nisbeler: [es-Sebîî, el-Hemdânî, el-Kûfî]
  aciklama: '"es-Sebîî" ve "el-Hemdânî" nisbeleri Yemen''in Hemdân kabilesinden Sebî'' b. Sa''b''a, "el-Kûfî" Kûfe''ye yerleşmesine dayanır.'
dogum: {hicri: 34, miladi: 654, not: "29 ve 32 de denmiştir"}
