isim: Nâfi' (Mevlâ İbn Ömer)
tam_isim: Ebû Abdillâh Nâfi' b. Hürmüz el-Kureşî el-Adevî el-Medenî
arapca: نافع مولى ابن عمر
tabaka: tabiin
