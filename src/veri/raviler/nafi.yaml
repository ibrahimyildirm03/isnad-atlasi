  kunye: Ebû Abdillâh
  ism: Nâfi'
  nesep: Nâfi' b. Hürmüz (babasının adı Sercis ve Kâvus olarak da geçer)
  nesep_arapca: نافع بن هرمز، أبو عبد الله المدني، مولى عبد الله بن عمر
  nisbeler: [el-Kureşî, el-Adevî, el-Medenî]
  lakap: Mevlâ İbn Ömer
  aciklama: Aslının Fars ya da Berberî olduğu söylenmiştir. Küçük yaşta esir alınıp Abdullah b. Ömer'in yanında otuz yılı aşkın kaldı ve onun âzatlısı (mevlâ) olarak tanındı; nisbeleri bu velâ bağından gelir.
