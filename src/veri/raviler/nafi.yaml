bolge: medine
rical:
  tehzibul_kemal: "XXIX, 298-305"
  tehzibut_tehzib: "X, 412-415"
  takrib: "Sika, sebt, fakih, meşhur (3. tabaka)"
  rumuz: "ع"
  sozler:
    - {kim: Buhârî, soz: "En sahih isnad: Mâlik, Nâfi'den, o da İbn Ömer'den.", kaynak: "DİA, \"Nâfi'\""}
    - {kim: Halîlî, soz: "Medine'de tâbiîn imamlarındandır; rivayet ettiklerinde bir hatası bilinmez.", kaynak: "Tehzîbü't-Tehzîb, X, 412"}
ozet: İbn Ömer'in âzatlısı; "Mâlik → Nâfi' → İbn Ömer" altın zincirinin orta halkası.
biyografi: |
  Ebû Abdillâh Nâfi' b. Hürmüz, tahminen 30 civarında doğdu; Farslı veya Berberî asıllı olduğu rivayet edilir. Doğudaki fetihlerden birinde küçük yaşta esir alındı ve Abdullah b. Ömer'in payına düştü. Otuz yıldan fazla onun yanında kalıp hizmet etti ve âzat edildi; bu yüzden "Mevlâ İbn Ömer" diye tanınır.

  İbn Ömer başta olmak üzere Hz. Âişe, Ebû Saîd el-Hudrî, Ebû Hüreyre ve Ümmü Seleme'den; Kāsım b. Muhammed ve İbn Ömer'in oğullarından rivayet etti. Zührî, Eyyûb es-Sahtiyânî, Yahyâ b. Saîd el-Ensârî, Leys b. Sa'd, Evzâî, İbn İshak ve özellikle Mâlik ondan hadis aldı.

  Ömer b. Abdülazîz onu sünneti öğretmek için Mısır'a, zekât âmili olarak Yemen'e gönderdi. Rivayette titizdi: talebelerinin yazdıklarını tashih eder, ancak dil hatalarını düzeltmeyip duyduğu gibi nakletmeyi tercih ederdi.

  Buhârî'ye göre en sahih senedlerden biri Mâlik–Nâfi'–İbn Ömer zinciridir; Şâfiî'nin başa eklendiği bu zincire "silsiletü'z-zeheb" denmiştir. Güvenilirliği üzerinde âlimlerin icmâı bulunduğu kaydedilir. 117'de vefat etti.
