biyografi: |
  Ebû Ubeyde Humeyd b. Ebî Humeyd Tîrûye el-Basrî 68'de doğdu; Hammâd b. Seleme'nin dayısıdır. Sicistan valisi Talha b. Abdullah el-Huzâî'nin âzatlısı olduğu için "el-Huzâî" nisbesiyle anılır. Kısa boylu olduğu halde elleri uzun olduğu için ya da aynı mahalledeki Humeyd es-Sagîr'den ayırt edilmek için "et-Tavîl" lakabını aldı.

  Enes b. Mâlik, Hasan-ı Basrî, Recâ b. Hayve, Sâbit el-Bünânî ve Nâfi'den hadis dinledi. Hüşeym, Süfyân es-Sevrî, Şu'be, yeğeni Hammâd b. Seleme, Mâlik ve Süfyân b. Uyeyne ondan rivayet etti; rivayetleri Kütüb-i Sitte'de yer alır.

  Enes'ten yaptığı bazı rivayetlerde tedlîs yaptığı için tenkit edilmiştir; ancak düşürdüğü râvi güvenilir hocası Sâbit el-Bünânî olduğundan bunun güvenilirliğini etkilemediği belirtilir. Enes'ten rivayetlerini içeren bir cüz Süleymaniye Kütüphanesi'nde bulunur.

  Basra'da insanlar arasındaki anlaşmazlıkları giderdiği için "muslihu ehli'l-Basra" diye tanındı. Cemâziyelevvel 143'te namaz kılarken vefat etti.
