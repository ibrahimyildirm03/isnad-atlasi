biyografi: |
  Ebû Attâb Mansûr b. el-Mu'temir es-Sülemî, Kûfe'de doğdu ve hayatının büyük kısmını orada geçirdi. Temel öğreniminden sonra 80 civarında hadise başladı; kıraat ve fıkıh da öğrendi. Ebû Vâil Şakīk b. Seleme, Saîd b. Cübeyr, İbrâhim en-Nehaî, Şa'bî, Hasan-ı Basrî ve Mücâhid'den rivayet etti.

  Eyyûb es-Sahtiyânî, Ebû Hanîfe, Ma'mer, İbrâhim b. Edhem, Süfyân es-Sevrî, Şu'be ve Süfyân b. Uyeyne ondan hadis öğrendi. Irak emîri Yûsuf b. Ömer onu istemediği halde Kûfe kadılığına atadı; çeşitli yollara başvurarak iki ay içinde görevden ayrılmayı başardı.

  Hadisleri karıştırmaz, tedlîs yapmaz ve güvenilmeyen kimselerin rivayetlerine itibar etmezdi; adâlet ve zabt yönünden hiç tenkit edilmemiştir. Yaklaşık iki bin hadis naklettiği belirtilir ve Kûfe'nin en meşhur muhaddislerinden sayılır. Hadisleri yazmak yerine ezberlemeyi tercih etti; hafızası zayıflayınca yazmadığına pişman oldu.

  Az yeme, az konuşma ve az uyuma ilkelerine titizlikle uyan bir zâhiddi; çok ağladığı için ömrünün sonunda gözlerine perde indi. 132'de Kûfe'de vefat etti.
