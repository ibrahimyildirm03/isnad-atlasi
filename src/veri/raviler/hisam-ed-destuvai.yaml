ozet: Katâde ve Yahyâ b. Ebî Kesîr'in en sağlam râvilerinden, güçlü hafızasıyla tanınan Basralı hâfız.
biyografi: |
  Ebû Bekr Hişâm b. Ebî Abdillâh Senber el-Basrî, Ahvaz'ın Destüvâ kasabasından giyim eşyası getirip sattığı için "ed-Destüvâî" diye anıldı. Katâde, Hammâd b. Ebî Süleyman, Yahyâ b. Ebî Kesîr ve Eyyûb es-Sahtiyânî'den hadis aldı. Katâde'nin hadislerini en iyi bilen kişi sayıldı; Yahyâ b. Ebî Kesîr'in rivayetlerini Evzâî'den daha iyi koruduğu kabul edildi.

  Tayâlisî, Yezîd b. Hârûn, Abdurrahman b. Mehdî, İbnü'l-Mübârek, Yahyâ el-Kattân ve İbn Uleyye ondan rivayet etti; akranı Şu'be ve Vekî' de ondan hadis aldı. Şu'be, Katâde'nin hadislerini kendisinden daha iyi bildiğini söylemiş; Ahmed b. Hanbel ezberini ondan daha iyi koruyan biri bulunacağını düşünmemiştir. "Emîrü'l-mü'minîn fi'l-hadîs" unvanıyla anılır.

  Bazı kaynaklar Kaderiyye'ye mensup olduğunu belirtse de bu görüşü yaymadığı kaydedilir. Rivayetleri Muvatta' dışındaki temel hadis kitaplarında yer alır. Hadisi yalnız Allah rızası için rivayet ettiğini söyler, Allah korkusuyla çok ağladığı için gözlerini kaybettiği rivayet edilir. 153'te vefat etti.
