ozet: "Resûlullah'tan duyduklarını yazan (es-Sahîfetü's-sâdıka) sahâbî."
biyografi: |
  Hicretten yaklaşık yedi yıl önce Mekke'de doğdu. Babası Amr b. el-Âs'tan önce müslüman oldu ve onunla birlikte Medine'ye göç etti. Süryânîce biliyor ve Tevrat'ı okuyordu.

  Hz. Peygamber'in izniyle işittiği hadisleri yazdı ve bu derlemeye es-Sahîfetü's-sâdıka adını verdi; bu sahîfe ilk yazılı hadis metinlerindendir ve torunu Şuayb b. Muhammed yoluyla nakledilmiştir. Ebû Hüreyre, kendisinden çok hadis bilen tek sahâbînin Abdullah b. Amr olduğunu, çünkü onun yazdığını kendisinin ise yazmadığını söylemiştir. Aşırı ibadeti sebebiyle aile hayatını ihmal ettiği için Hz. Peygamber tarafından uyarıldı.

  Sıffîn'de babasının ısrarıyla Muâviye'nin ordusunda bulundu, fakat silah kullanmadı ve bundan ömrü boyunca pişmanlık duydu. Muâviye onu Kûfe'ye, babasının vefatından sonra Mısır'a vali tayin etti. Yaklaşık 700 hadis rivayet etti; Şuayb b. Muhammed, Saîd b. el-Müseyyeb, Urve b. ez-Zübeyr ve Hasan el-Basrî ondan rivayet edenler arasındadır. Ömrünün sonunda gözlerini kaybetti; vefat yılı 63 ile 69 arasında farklı verilir.
