biyografi: |
  88/707'de Ba'lebek'te doğdu; küçük yaşta babasını kaybedip annesinin yanında büyüdü. İlk derslerini Ba'lebek'te aldı, Dımaşk'ta Nümeyr b. Evs ve Mekhûl'den okudu. Divanda görevliyken Yemâme'ye gitti ve Yahyâ b. Ebî Kesîr'in yanında bir süre kaldı. Irak, Mekke, Medine ve Beytülmakdis'te Katâde ve Atâ b. Ebî Rebâh gibi âlimlerden ders aldı.

  Hac yolculuklarında Mâlik ve Süfyân es-Sevrî ile ilmî müzakerelerde bulundu; Şam'ın fıkıh otoritesi kabul edildi. Kadılık tekliflerini reddetti ve Abbâsî kumandanı Abdullah b. Ali'nin karşısında zulmü açıkça kınadı. İleri yaşta sınır nöbeti (ribât) için Beyrut'a yerleşti ve 28 Safer 157'de orada vefat etti.

  Mezhebi Suriye, Irak, Hicaz, Mısır, Mağrib ve Endülüs'e yayıldı; Endülüs'te Sa'saa b. Sellâm, Suriye'de Abdullah b. Semâa ve Saîd b. Abdülazîz bu yayılmada etkili oldu. Zamanla Şam'da Şâfiî, Endülüs'te Mâlikî mezhebi karşısında çekildi. Günümüze ulaşan tek eseri, Şâfiî'nin el-Üm'ünde yer alan Siyerü'l-Evzâî'dir; hadis derlemeleri Beyrut'taki bir depremde yanmıştır.
