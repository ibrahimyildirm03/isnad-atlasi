biyografi: |
  Medine'nin Evs kabilesindendir; ilk İslâmî bilgileri Mus'ab b. Umeyr'den aldı. Yaşı küçük olduğu için Bedir'e alınmadı; Uhud'dan itibaren seferlere katıldı ve Huneyn'de yararlık gösterdi.

  Hz. Ali'nin yanında Cemel, Sıffîn ve Nehrevan'da bulundu. Kûfe'ye yerleşerek hadis ve fıkıh okuttu; ondan Adî b. Sâbit, Ebû İshâk es-Sebîî ve başkaları rivayet etti. 305 hadisinin 22'si Sahîhayn'da ortaktır.
