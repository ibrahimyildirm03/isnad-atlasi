biyografi: |
  Katâde b. Diâme 60 veya 61'de doğdu; doğuştan âmâdır. Şeybânoğulları'ndan Sedûs kabilesine mensup bedevî bir ailedendir ve ailesi Basra'ya göç etmiştir. Hasan-ı Basrî'nin yanında on iki yıl kalarak kıraat, tefsir ve hadis öğrendi; Enes b. Mâlik, Ebü'l-Âliye, İbn Sîrîn, Saîd b. el-Müseyyeb, İkrime, Atâ ve Şa'bî'den hadis dinledi.

  Şu'be, Ma'mer, Hemmâm b. Yahyâ, İbn Ebî Arûbe, Eyyûb es-Sahtiyânî, Evzâî ve Ebû Hanîfe ondan rivayet etti. Hafızası darbımesel olmuştur: duyduğu her şeyi ezberlediğini söylemiş, Saîd b. el-Müseyyeb'in yanında sekiz gün kalınca Saîd ona artık gidebileceğini söylemiştir. Ali b. el-Medînî onu, büyük şehirlerin isnad zincirlerinin kesiştiği altı kişiden biri sayar.

  Tefsirde uzmanlaştı; Arap dili, Câhiliye şiiri, Arap tarihi ve nesep ilminde de önde gelenlerdendir. Taberî'nin tefsirinde ondan yaklaşık beş bin kavil bulunur. Mürsel ve tedlîsli rivayetleri olsa da büyük hadis imamları rivayetlerini eserlerine almıştır. Kader konusundaki görüşü tartışılmıştır.

  Çalkantılı bir dönemde hiçbir tarafı desteklemeyip ilimle meşgul oldu. 117'de Vâsıt'taki veba salgınında vefat etti.
