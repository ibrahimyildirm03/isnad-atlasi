biyografi: |
  Ebû Muhammed Abdullah b. Vehb el-Fihrî, 125'te Mısır'da doğdu; Benî Fihr'in mevlâlarındandır. On yedi yaşında ilme başladı ve yaklaşık dört yüz hocadan ders aldı. Bunların başında Mâlik ve Leys b. Sa'd gelir; Sevrî, İbn Uyeyne, İbn Cüreyc ve İbn Lehîa da hocaları arasındadır. Nâfi' b. Abdurrahman'dan kıraat öğrendi.

  Mâlik ile ilk defa 144'teki haccında tanıştı ve ölümüne kadar irtibatını sürdürdü; yirmi dört (veya otuz altı) kez hacca gidip her seferinde onunla görüştüğü rivayet edilir. Hadisleri önce Mâlik ve Leys'e arz eder, bu ikisi sayesinde sapmadığını söylerdi.

  İbn Mehdî, Asbağ b. el-Ferec, Rebî' b. Süleyman, Yahyâ b. Yahyâ el-Leysî ve Sahnûn ondan okudu. Hicaz ve Mısır hadislerini içeren el-Câmi'i kısmen günümüze ulaşmıştır. Ebû Zür'a, incelediği otuz bin hadisinde mevzû veya münker bir hadise rastlamadığını belirtmiş; "dîvânü'l-ilm" diye anılmıştır.

  Hayatını ribâtlarda, öğretimde ve hacda geçirdi ve teklif edilen kadılığı reddetti. 25 Şâban 197'de Mısır'da vefat etti.
