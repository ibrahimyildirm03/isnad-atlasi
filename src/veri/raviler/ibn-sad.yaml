biyografi: |
  Ebû Abdillâh Muhammed b. Sa'd, 160'ta Basra'da doğdu; babası veya dedesi Hz. Abbas ailesinin âzatlısı olduğu için "Mevlâ Benî Hâşim" diye anılır. Basra'da Hüşeym, Vekî', Ebû Âsım en-Nebîl ve İbn Uleyye'den dinî ilimler ile Arap dili öğrendi. Genç yaşta Kûfe, Medine ve Mekke'ye giderek Hz. Peygamber'in gazvelerinin geçtiği yerleri inceledi; sonra Rakka ve Dımaşk'tan Bağdat'a geçip orada yerleşti.

  200 civarında Bağdat'ta Vâkıdî'nin kâtibi oldu ve hocasının 207'deki vefatına kadar yanından ayrılmadı; bu yüzden "Kâtibü'l-Vâkıdî" diye anıldı. Medâinî, İbnü'l-Kelbî ve Mus'ab ez-Zübeyrî'den de faydalandı; hadisi Süfyân b. Uyeyne, Vekî' ve Ebû Nuaym'dan aldı. Belâzürî, İbn Ebi'd-Dünyâ ve Hâris b. Ebî Üsâme ondan rivayet etti.

  218'de Me'mûn'un emriyle sorgulanan yedi âlim arasındaydı; istenen cevabı verip serbest bırakıldı. Ahmed b. Hanbel bu tavrını makul bulmuş, aralarındaki ilmî ilişki sürmüştür. Ebû Hâtim doğru sözlü olduğunu söylemiş; Hatîb, Zehebî ve İbn Hacer onu güvenilir kabul etmiştir.

  En meşhur eseri et-Tabakātü'l-kübrâ, siyer-megāzî ve tabakāt bölümlerinden oluşur. Sahâbîleri beş tabakaya, tâbiîni yerleşim yerleri ve yaşlarına göre sınıflandırır; son cildi kadın sahâbîlere ayrılmıştır. 4 Cemâziyelâhir 230'da Bağdat'ta vefat etti ve Bâbüşşam Kabristanı'na defnedildi.
