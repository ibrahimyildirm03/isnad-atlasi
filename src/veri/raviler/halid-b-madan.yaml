biyografi: |
  Ebû Abdillâh Hâlid b. Ma'dân el-Kelâî, Şam ve Humus bölgesine yerleştiği için "eş-Şâmî" ve "el-Hımsî" nisbeleriyle anılır. Bir kısmından mürsel olarak olmak üzere Muâz b. Cebel, Hz. Âişe, Ebû Hüreyre, Muâviye ve Abdullah b. Ömer'den rivayet etti. Sevr b. Yezîd, Muhammed b. İbrâhim et-Teymî, Hassân b. Atıyye ve Safvân b. Amr ondan hadis aldı.

  Mesleme b. Abdülmelik komutasındaki İstanbul kuşatması dahil Bizans'a karşı birçok savaşa katıldı. Halife Velîd b. Abdülmelik bir konuda onun görüşüne başvurmuş ve kadılara bu görüşe göre karar vermelerini bildirmiştir. Evzâî ve Süfyân es-Sevrî onu sika diye övmüş, fıkıhta otorite kabul edilmiştir; rivayetleri Kütüb-i Sitte'de yer alır.

  Zamanının çoğunu oruçlu geçiren zâhid bir âlimdi; şöhretten hoşlanmaz, etrafında kalabalık toplanınca oradan uzaklaşırdı. İnsanın ikisi maddî ikisi mânevî dört gözü olduğunu, Allah bir kulun hayrını dilediğinde kalp gözünü açtığını söylerdi. 103'te Şam yakınlarındaki Entartus'ta vefat etti.
