biyografi: |
  13 Şevval 194'te Buhara'da doğdu. Hadis öğrenmiş olan babası İsmâil o küçükken vefat etti. On yaşına doğru hadis öğrenmeye başladı; on bir yaşında hocasının bir rivayet hatasını düzeltti, on altı yaşında İbnü'l-Mübârek ve Vekî'in kitaplarını ezberledi. Aynı yaşta annesi ve kardeşiyle hacca gitti ve Mekke'de kalarak tahsiline devam etti.

  Bağdat, Basra, Belh, Dımaşk, Hicaz, Hıms, Kûfe, Medine, Merv, Mısır ve Nîşâbur'a yolculuk etti; hadis yazdığı hoca sayısını kendisi 1080 olarak verir. Ahmed b. Hanbel, Ali b. el-Medînî, İshâk b. Râhûye, Humeydî, Kuteybe, Ebû Nuaym, Mekkî b. İbrâhîm, Ebû Âsım en-Nebîl ve Bündâr hocaları arasındadır.

  el-Câmiu's-sahîh'i yaklaşık 600.000 hadis arasından seçerek on altı yılda hazırladığı kaydedilir. Şartlarını kendisi yazmamış, bunlar eserin incelenmesinden çıkarılmıştır; senedde râvilerin birbiriyle karşılaşmış olmasını aradığı kabul edilir. Bab başlıkları fıkhî görüşlerini yansıttığı için "Buhârî'nin fıkhı bab başlıklarındadır" denmiştir. Kur'an'dan sonra en güvenilir kitap kabul edilir.

  Nîşâbur'da Muhammed b. Yahyâ ez-Zühlî, halku'l-Kur'ân tartışmasını kullanarak onun itibarını zedelemeye çalıştı; Buhârî şehri terk etti. Buhara emîriyle ilmin devlete hizmeti konusunda anlaşmazlığa düşünce iftiralar sonucu memleketinden sürüldü. Semerkant'a giderken Hartenk'te hastalandı ve 256 Ramazan Bayramı gecesi vefat etti.

  et-Târîhu'l-kebîr râvilerin biyografilerine, ed-Duafâ zayıf râvilere, el-Edebü'l-müfred ahlâk hadislerine, Halku ef'âli'l-ibâd ise Kur'an okuyuşunun mahlûk oluşu meselesine dairdir. Müslim, Tirmizî ve İbn Huzeyme onun talebesidir.
