ozet: '"Hadiste mü''minlerin emîri" diye anılan Reyli münekkit; el-Cerh ve''t-ta''dîl''in temel kaynağı.'
biyografi: |
  195'te Rey'de doğdu; şehrin Derbü Hanzala mahallesinde oturduğu için "el-Hanzalî" diye anılır. 209'da Rey'de hadis öğrenimine başladı; Ebû Nuaym, Affân b. Müslim, Âdem b. Ebî İyâs ve Ahmed b. Hanbel'den faydalandı. Kûfe, Basra, Mekke, Medine, Bağdat, Mısır, Kudüs, Dımaşk ve Antakya gibi pek çok şehri yaya olarak dolaştı.

  Yedi yıl süren ilk yolculuğunda büyük sıkıntılar çekti; 214'te Basra'da parası tükenince elbiselerini satmak zorunda kaldı. İkinci yolculuğunu 242-245 arasında yaptı. Oğlu İbn Ebî Hâtim, arkadaşı Ebû Zür'a, Ebû Dâvûd ve Nesâî ondan rivayet etti; İbn Hacer, Buhârî'nin de ondan rivayet ettiğini kaydeder.

  "Emîrü'l-mü'minîn fi'l-hadîs" unvanıyla anıldı. Râvileri yakından tanır, rivayetlerdeki gizli kusurları hemen fark ederdi. Titiz ve sert bir münekkit olduğu için güvenilir saydığı râvilere güvenle yaklaşılmış, zayıf saydıklarında başka münekkitlere de bakılması tavsiye edilmiştir. Hocası Yûnus b. Abdila'lâ onu ve Ebû Zür'a'yı Horasan'ın iki büyük imamı saymıştır.

  Râvi değerlendirmeleri, oğlunun el-Cerh ve't-ta'dîl'inde toplanmıştır. İtikadda nakle bağlı kaldı ve kelâma karşı çıktı. Şâban 277'de Rey'de vefat etti.
