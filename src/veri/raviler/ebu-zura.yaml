rical:
  tehzibut_tehzib: "VII, 30-34"
ozet: İlelü'l-hadîsin büyük otoritesi Reyli hâfız; Müslim'in Sahîh'ini tetkik eden münekkit.
biyografi: |
  Ubeydullah b. Abdilkerîm b. Yezîd, kabul edilen görüşe göre 194'te Rey'de doğdu. "Ebû Zür'a" künyesini, Dımaşklı muhaddis Ebû Zür'a ed-Dımaşkī'ye hayran kalan hemşehrileri vermiştir. Babası ve amcaları da muhaddistir. İlk ezberlediği hadis kitabı el-Muvatta' oldu; on üç yaşında Kûfe'ye gidip sekiz ay kaldı.

  227-232 arasındaki uzun yolculuğunda hac yaptı, iki yıl Mısır'da kalarak Rebî' b. Süleyman'dan Şâfiî'nin bütün eserlerini okudu; Şam, Cezîre, Bağdat ve Basra'yı dolaştı. Bağdat'ta en çok Ahmed b. Hanbel'den yararlandı; Ahmed de sağlamlığından şüphe ettiği hadisleri onunla müzakere eder, bunu nafile namaza tercih ederdi. 580 hocası tespit edilmiştir.

  Otuz iki yaşında okutmaya başladı. Müslim, Tirmizî, Nesâî, Ebû Hâtim, İbrâhim el-Harbî, Abdullah b. Ahmed ve Taberî talebeleri arasındadır; en önemlisi İbn Ebî Hâtim'dir. Müslim, Sahîh'ini tamamlayınca ona sunmuş ve onun uygun görmediği rivayetleri almamıştır. Ebû Hâtim, illetleri anlamada Ahmed, İbn Maîn ve İbnü'l-Medînî'den sonra onu saymıştır.

  Yüz binlerce rivayeti ezbere bildiği nakledilir; tenkitlerinde arkadaşı Ebû Hâtim'in sertliğine karşı insaflı bir dil kullandı. Günümüze ulaşan tek eseri, Berzaî'nin sorularına verdiği cevaplardan oluşan Kitâbü'd-Duafâ'dır. Zilhicce 264'ün son günü Rey'de, yanındaki âlimlerin okuduğu telkin hadisinin senedini tamamlarken vefat etti.
