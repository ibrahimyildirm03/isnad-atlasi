rical:
  rumuz: "ت"
  sozler:
    - kim: Buhârî (Tirmizî'ye)
      soz: Benim senden faydalandığım, senin benden faydalandığından daha çoktur.
      kaynak: DİA, "Tirmizî"
ozet: '"Hasen" hadis kavramına terim anlamını kazandıran, el-Câmi''in müellifi Buhârî talebesi.'
biyografi: |
  Muhtemelen 209'da Tirmiz'de doğdu. 235 civarında Tirmiz'de hadis öğrenimine başladı; Horasan, Irak ve Hicaz'ı dolaştı. Bağdat'a gitmediği, Mısır ve Şam'da da tahsil yapmadığı anlaşılmaktadır.

  Uzun süre Buhârî'nin talebesi oldu, ondan çok hadis rivayet etti ve fıkhü'l-hadîs öğrendi. Buhârî onun ilmini ve zekâsını takdir etti, hatta ondan bir iki hadis rivayet etti; Tirmizî ise el-Câmi'inde Buhârî'den doğrudan hadis almadı. İshâk b. Râhûye, Ebû Dâvûd, Müslim ve Dârimî'den de rivayet etti.

  Doğuştan âmâ olduğu iddiası rivayetlerle çürütülür; Hâkim el-Kebîr'in naklettiğine göre takvâsı sebebiyle gözlerini kaybedinceye kadar ağlamıştır.

  el-Câmi'inde sahih hadis bulunmayan konularda zayıf hadisleri senedleriyle tenkit ederek kullanır; fıkhî hadislerden sonra sahâbe, tâbiîn ve mezhep imamlarının görüşlerini aktarır ve tercihini belirtir. "Hasen" kavramına terim anlamını veren odur. eş-Şemâilü'n-nebeviyye Hz. Peygamber'in şemaili konusundaki ilk müstakil eserdir; el-İlelü'l-kebîr ise el-Câmi'den önce yazılmış bir ilel çalışmasıdır. 13 Receb 279'da Tirmiz yakınındaki Boğ'da vefat etti.
