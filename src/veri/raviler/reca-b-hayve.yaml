ozet: Ömer b. Abdülazîz'in veziri; Şamlıların "efendisi" sayılan fakih.
biyografi: |
  Recâ b. Hayve el-Kindî, Şam tâbiîlerinin büyüklerindendir; Zehebî onu "imam, kudve, âdil vezir ve fakih" diye niteler. İbn Hibbân'a göre künyesi Ebü'l-Mikdâm'dır; Filistin'de, zaman zaman Ürdün'de oturdu ve Şamlıların âbid, zâhid ve fakihlerindendi.

  Muâz b. Cebel, Ebü'd-Derdâ ve Ubâde b. es-Sâmit'ten (mürsel olarak), ayrıca Abdullah b. Amr, Muâviye, Ebû Saîd el-Hudrî, Câbir, Ebû Ümâme ve Ümmü'd-Derdâ'dan rivayet etti. Mekhûl, Zührî, Katâde, Abdülmelik b. Umeyr, İbn Avn, Humeyd et-Tavîl ve Sevr b. Yezîd ondan hadis aldı. Bişr b. Mervân ile Kûfe'ye geldiğinde Ebû İshak es-Sebîî ve Katâde ondan dinlemiştir.

  İbn Sa'd onu "sika, âlim, fâzıl, çok ilim sahibi" diye anar; Nesâî de sika sayar. Halife Hişâm'a Filistin'in efendisinin kim olduğu sorulduğunda halk onu göstermiştir. Mekhûl onun Şamlıların gözünde efendileri olduğunu söylemiş, Matar el-Verrâk ondan daha faziletli bir Şamlı görmediğini belirtmiştir. Muhammed b. Sîrîn ve Kāsım b. Muhammed gibi hadisi lafzıyla rivayet edenlerdendi.

  Emevî halifelerinin yakınında bulundu; Abdülmelik b. Mervân namazda okurken takıldığında ona neden düzeltmediğini sormuştur. Halife Yezîd b. Abdülmelik ona ayda otuz dinar bağlamıştı. Zehebî'nin kaydına göre Süleyman b. Abdülmelik'in vefatında halifeliğin Ömer b. Abdülazîz'e geçmesini sağladığı için Hişâm'ın ona karşı içinde bir kırgınlık vardı. 112'de vefat etti.
