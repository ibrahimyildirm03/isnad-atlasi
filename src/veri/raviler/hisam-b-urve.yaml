ozet: Urve b. ez-Zübeyr'in oğlu; babasının rivayetlerini Mâlik, Leys, Sevrî ve Uyeyne'ye aktaran Medineli muhaddis.
biyografi: |
  Hişâm b. Urve b. ez-Zübeyr b. el-Avvâm, Muharrem 61'de Medine'de doğdu. Abdullah b. Ömer, Sehl b. Sa'd, Câbir b. Abdullah ve Enes b. Mâlik'i gördü; on yaşlarındayken İbn Ömer'in yanına götürülmüş, İbn Ömer başını okşayıp ona dua etmiştir. Hadisi başta babası Urve olmak üzere amcası Abdullah b. ez-Zübeyr, İbnü'l-Münkedir, Zührî ve hanımı Fâtıma bint el-Münzir'den aldı.

  Eyyûb es-Sahtiyânî, Ma'mer, İbn Cüreyc, Şu'be, Süfyân es-Sevrî, Leys b. Sa'd, Mâlik, İbnü'l-Mübârek, Süfyân b. Uyeyne ve Yahyâ el-Kattân ondan rivayet etti. Halife Mansûr ona büyük değer verdi; onun yanına üç defa Kûfe'ye gitmesi Kûfeli talebelerin de ondan faydalanmasını sağladı. Borcunu ödemek için yardım istediğinde Mansûr borcunu kapatıp üstüne ilave para vermiştir.

  İbn Sa'd, Yahyâ b. Maîn ve Ebû Hâtim onu sika saymıştır. Ya'kūb b. Şeybe, kitaplarını yanında götürmediği için Irak'taki rivayetlerinde gevşeklik gösterdiğini ileri sürmüş; bu yüzden Medinelilerin ondan rivayetleri daha makbul sayılmıştır. İleri yaşta rivayetleri karıştırdığı iddiasını Zehebî ve İbn Hacer reddetmiştir.

  146'da Mansûr'un yanına gittiği Bağdat'ta vefat etti; cenaze namazını Mansûr kıldırdı ve Hayzürân Kabristanı'na defnedildi.
