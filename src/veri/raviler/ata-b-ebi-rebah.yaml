ozet: İbn Abbâs'tan sonra Mekke'nin fetva mercii; hac menâsikinde zamanının en yetkili fakihi.
biyografi: |
  Doğum tarihi kesin bilinmemekle birlikte 27 civarında Yemen'in Cened şehrinde Nübye asıllı bir ailede doğdu. Çok küçük yaşta Mekke'ye gitti ve Benî Fihr veya Cumah ailesinin mevlâsı oldu. Bir gözü daha önce kör olmuştu, diğeri ömrünün sonunda görmez oldu; İbn ez-Zübeyr'in mücadelesi sırasındaki bir çarpışmada bir elini kaybetti.

  Kendi ifadesine göre yaklaşık iki yüz sahâbîden hadis rivayet etti; İbn Abbas, İbn Ömer, Hz. Âişe, Câbir, Muâviye, İbn ez-Zübeyr ve Ebü'd-Derdâ bunlar arasındadır. İbn Abbas'tan sonra Mescid-i Harâm'da ders halkasına oturdu ve Mekke'nin fetva mercii oldu. Zamanının hac konusunda en yetkili fakihi sayılır; yetmiş kez hac yaptığı rivayet edilir.

  Mücâhid, İbn Cüreyc, Ebû Hanîfe, Evzâî, Zührî, Amr b. Dînâr ve İbn Ebî Leylâ ondan ilim aldı. İbn Abbas'a (veya İbn Ömer'e), Atâ aralarındayken Mekkelilerin neden kendi etrafında toplandığını sorduğu söz atfedilir. Yahyâ b. Maîn, Ebû Zür'a ve İbn Hibbân onu sika saymış; Şâfiî, tâbiîn arasında onun kadar hadise bağlı birinin bulunmadığını söylemiştir. Mürselleri ise zayıf sayılmıştır.

  Tefsir rivayetleri Abdürrezzâk, Sevrî ve Taberî'nin tefsirlerine girmiştir. 114'te Mekke'de vefat etti.
