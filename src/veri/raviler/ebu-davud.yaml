ozet: Yazdığı beş yüz bin hadisten 4800'ünü seçtiği es-Sünen'in müellifi; Ahmed b. Hanbel'in talebesi.
biyografi: |
  202 ya da 203 yılında Sicistan'da doğdu. On sekiz yaşında Bağdat ve Basra'ya gitti; Basra'da uzun süre kaldı ve Müslim b. İbrâhîm el-Ezdî başta olmak üzere birçok muhaddisten hadis okudu. Ardından Mekke, Kûfe, Halep, Dımaşk, Horasan ve Mısır'ı dolaştı; İbn Hacer'e göre yaklaşık 300 hocası vardır.

  Bağdat'ta uzun süre Ahmed b. Hanbel'in meclislerine devam etti, fıkıh ve usule dair ona sorduklarını Mesâil adlı eserinde topladı. Ahmed b. Hanbel'in es-Sünen'i incelediği ve beğendiği rivayet edilir. Yahyâ b. Maîn, Ali b. el-Medînî, İshâk b. Râhûye, Kuteybe ve Ka'nebî de hocaları arasındadır.

  Zenc isyanıyla harap olan Basra'yı canlandırmak isteyen Emîr Ebû Ahmed el-Muvaffak'ın daveti üzerine Basra'ya yerleşti; emîrin çocuklarına özel ders verme teklifini ise reddetti.

  es-Sünen, beş yüz bin hadis arasından seçilmiş yaklaşık 4800 ahkâm hadisini içerir ve zayıf olanlara işaret eder. Mekke ehline yazdığı risalede eserinin metodunu anlatıp benzerleriyle karşılaştırmıştır. el-Merâsîl, Âcurrî'nin sorularına verdiği cevaplar, Kitâbü'z-Zühd ve Kitâbü'l-Kader diğer eserleridir. Hâkim en-Nîsâbûrî onu asrının hadis imamı saymıştır. 16 Şevval 275'te Basra'da vefat etti.
