ozet: Hadiste "emîrü'l-mü'minîn" diye anılan Kûfeli muhaddis; Sevrî mezhebinin imamı.
biyografi: |
  97/715'te doğdu, küçük yaşta Kûfe'ye yerleşti. Temîm'in Sevr koluna mensuptur. Babası Saîd b. Mesrûk'un yanında hadise başladı; Kûfe'de Hammâd b. Ebî Süleymân, A'meş ve İbn Ebî Leylâ'dan fıkıh ve hadis, Âsım b. Behdele ile Hamza b. Habîb'den kıraat öğrendi. Mekke, Medine, Basra ve Şam'ı dolaşarak İbn Cüreyc, Amr b. Dînâr ve Ca'fer es-Sâdık'tan istifade etti.

  Babasının vefatından sonra ders vermeye başladı ve çok sayıda talebe yetiştirdi. Halife Mansûr'un kadılık teklifini reddederek Kûfe'den ayrıldı ve ömrünün sonuna kadar gizlenerek yaşadı. Mehdî'nin yakalama emri üzerine Mekke'den Basra'ya kaçtı ve 161/778'de orada vefat etti. Ticaretle uğraşarak maddî bağımsızlığını korudu, yöneticilerden uzak durdu.

  Hadisteki üstünlüğü sebebiyle "hadiste mü'minlerin emîri" diye anıldı. Sahâbe, tâbiîn ve etbâu't-tâbiîn fakihlerinin görüşlerini derleyen el-Câmiu'l-kebîr'i erken dönem fıkıh derlemelerinin önemlilerindendir. Adını taşıyan Sevrî mezhebi yaklaşık beş asır yaşadı; Zehebî, kendi döneminde dört mezhep dışında yaşayan fıkıh mezhebi kalmadığını belirtir.
