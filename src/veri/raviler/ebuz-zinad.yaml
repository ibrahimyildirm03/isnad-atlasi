biyografi: |
  Ebû Abdirrahmân Abdullah b. Zekvân, yaklaşık 65'te doğdu; hoşlanmadığı "Ebü'z-Zinâd" lakabıyla tanındı. Babası Hz. Osman ailesinden birinin âzatlısıydı; oğulları Abdurrahman ve Ebü'l-Kāsım da hadis ve fıkıhta tanınmıştır.

  Enes b. Mâlik, Ebû Ümâme b. Sehl, Şa'bî, Saîd b. el-Müseyyeb, Hârice b. Zeyd ve özellikle A'rec'den hadis aldı. İbn Ebî Müleyke, Mûsâ b. Ukbe, Hişâm b. Urve, Süfyân es-Sevrî, Mâlik ve Süfyân b. Uyeyne ondan rivayet etti. Buhârî'ye göre Ebû Hüreyre'nin en güvenilir senedi Ebü'z-Zinâd–A'rec–Ebû Hüreyre zinciridir.

  Hişâm b. Abdülmelik döneminde Medine'de malî işler divanında çalıştı; Ömer b. Abdülazîz onu Kûfe beytülmâlini yönetmekle görevlendirdi. Hadis, fıkıh, hesap ve şiirde bilgisine başvurulurdu; Mescid-i Nebevî'deki halkasında yüzlerce talebesi vardı. Süfyân es-Sevrî onu "emîrü'l-mü'minîn fi'l-hadîs" diye anmış, Ali b. el-Medînî Medine'nin dört büyük âliminden saymıştır.

  Talebelerinin bir kısmı Rebîatü'r-re'y'in halkasına geçince aralarının açıldığı tahmin edilir; Ebû Hanîfe ve Ahmed b. Hanbel onu fıkıhta Rebîa'nın üstünde görmüştür. Mâlik, Muvatta'da ondan elli dört rivayete yer vermiştir. 17 Ramazan 130'da Medine'de vefat etti.
