tabaka: sahabe
isim_bilgisi:
  kunye: Ümmü Seleme
  ism: Hind
  nesep: Hind bint Ebî Ümeyye Süheyl (Huzeyfe) b. el-Mugîre b. Abdillâh b. Ömer b. Mahzûm
  nesep_arapca: هند بنت أبي أمية حذيفة بن المغيرة المخزومية
  nisbeler: [el-Kureşiyye, el-Mahzûmiyye]
  aciklama: İsminden çok künyesiyle tanınır; adının Remle olduğu rivayeti doğru görülmemiştir. Babası Ebû Ümeyye cömertliği sebebiyle "Zâdü'r-rekb" (yolcuların azığı) diye anılırdı. Annesi Âtike bint Âmir el-Kinâniyye'dir.
