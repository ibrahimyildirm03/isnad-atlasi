  rumuz: "ع"
ozet: Hz. Peygamber'in hanımı; Âişe'den sonra en çok hadis rivayet eden kadın sahâbî.
biyografi: |
  Kureyş'in Mahzûmoğulları kolundandır. İlk eşi Ebû Seleme ile Habeşistan'a, sonra Medine'ye hicret etti; ailesi bir süre hicretine engel olup onu oğlundan ayırdı. Ebû Seleme'nin 4/625'te vefatından sonra Hz. Peygamber ile evlendi.

  Hudeybiye'de Hz. Peygamber'e verdiği isabetli tavsiyesiyle bilinir. 378 hadis rivayet etti; ondan sahâbeden İbn Abbâs, Âişe ve Ebû Saîd el-Hudrî, tâbiînden Saîd b. el-Müseyyeb, Esved b. Yezîd, Mesrûk, Şa'bî ve Süleymân b. Yesâr rivayet etti. Ezvâc-ı tâhirâtın en son vefat edenidir.
