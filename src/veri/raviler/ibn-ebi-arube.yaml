biyografi: |
  Ebü'n-Nadr Saîd b. Ebî Arûbe, 76 civarında doğdu; Adî b. Yeşkür oğullarının mevlâsıdır ve Basra'da yaşadı. Hasan-ı Basrî, İbn Sîrîn ve Katâde'den fıkıh, tefsir ve hadis öğrendi; Katâde'nin en yakın talebelerinden olup onun tefsirini yazdığını söylemiştir.

  Şu'be, Süfyân es-Sevrî, Gunder, Yahyâ el-Kattân ve Yezîd b. Hârûn ondan rivayet etti. Ahmed b. Hanbel'e göre Basra'da rivayetleri fıkıh konularına göre tasnif eden ilk kişidir; es-Sünen adlı eseri sonraki hadis kitaplarının kaynaklarındandır.

  Yahyâ el-Kattân, Yahyâ b. Maîn, Ebû Zür'a ve Nesâî onu sika saymıştır. Ancak 145'ten itibaren hafızası karıştığı için bu dönemdeki rivayetleri delil kabul edilmez; Sahîhayn'daki rivayetleri öncesine aittir. Tedlîs yapmakla da eleştirilmiş, hocası Katâde gibi gizli bir Kaderî olduğu ileri sürülmüştür. 156'da (150 de denir) vefat etti.
