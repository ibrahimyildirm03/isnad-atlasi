biyografi: |
  80'de doğdu; Rum asıllı olup Ümeyye b. Hâlid'in mevlâsı olduğu söylenir. Gençliğinde şiir ve nesep ilmiyle uğraşırken bir tavsiye üzerine Atâ b. Ebî Rebâh'ın halkasına katıldı ve on sekiz-on dokuz yıl onun yanında kaldı. Ardından yedi veya dokuz yıl Amr b. Dînâr'ın talebesi oldu. İbn Ebî Müleyke, Nâfi' ve Hişâm b. Urve'den de hadis dinledi.

  Süfyân es-Sevrî, Süfyân b. Uyeyne, Yahyâ el-Kattân, Vekî' ve Hammâd b. Seleme ondan rivayet etti. Bağdat'ta Halife Mansûr'un huzurunda bulundu, Yemen ve Basra'da ders verdi, Kûfe'de tefsirini yazdırdı. Atâ, kendisinden sonra halkasına kimin geçeceği sorulduğunda onu işaret etmiştir.

  İslâm tarihinde telif anlamında ilk kitap yazanlardan, Mekke'de hadisleri bablara göre tasnif eden ilk âlim olarak anılır. Tefsiri günümüze ulaşmamış, ancak Taberî ve İbn Kesîr gibi müfessirlerin nakilleriyle derlenmiştir. Zehebî onu "Mekkeliler'in fakihi" diye anar; yaklaşık bin merfû hadisi Kütüb-i Sitte'de yer alır.

  Sika kabul edilmekle birlikte tedlîsi eleştirilmiş; Dârekutnî "tedlîsin en kötüsü" demiştir. Müt'a nikâhına cevaz vermesi de tartışılmıştır. 1 Zilhicce 150'de vefat etti.
