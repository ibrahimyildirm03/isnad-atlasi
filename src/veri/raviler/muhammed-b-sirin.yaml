ozet: Rivayetteki titizliğiyle tanınan Basralı muhaddis ve fakih; sonraki asırlarda rüya tabiriyle meşhur oldu.
biyografi: |
  Muhammed b. Sîrîn 34'te Basra'da doğdu. Babası Sîrîn, Aynüttemr'in fethinde esir alınmış ve Enes b. Mâlik tarafından mükâtebe yoluyla âzat edilmişti; annesi Safiyye Hz. Ebû Bekir'in âzatlısıydı. Kardeşleri Yahyâ, Ma'bed, Enes ve Hafsa da güvenilir râvilerdir.

  Zeyd b. Sâbit, Hasan b. Ali, İmrân b. Husayn ve Ebû Hüreyre dahil otuz sahâbîden ilim aldığı kaydedilir; tâbiîlerden Abîde es-Selmânî ve Kādî Şüreyh'ten faydalandı. Şa'bî, Katâde, Eyyûb es-Sahtiyânî, İbn Avn, İbn Ebî Arûbe ve Evzâî ondan istifade etti.

  "İmam" ve "hâfız" unvanlarıyla anılır; hadis rivayetinde titizliği ve güvenilirliği üzerinde ittifak edilmiştir, rivayetleri Kütüb-i Sitte'de yer alır. Asıl kimliği hadisçilik ve fıkıhtır. Sonraki asırlarda ilk rüya tabircilerinden biri olarak meşhur olduysa da ona nisbet edilen tabirnâmelerin kendisine ait olması mümkün görülmez.

  Geçimini ticaretle sağladı; satın aldığı yağa fare düşünce tamamını döktüğü ve borcunu ödeyemeyip hapsedildiği rivayet edilir. Yumuşak huylu, mütevazı ve takvâ sahibiydi. 9 Şevval 110'da vefat etti; borcunu oğlu Abdullah ödedi.
