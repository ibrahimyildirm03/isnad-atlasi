biyografi: |
  Künyesi Ebû Mûsâ olan Muhammed b. el-Müsennâ, 167'de Basra'da doğdu; bir ara felç geçirdiği için "ez-Zemin" lakabıyla anıldı. Basra'da ve Bağdat'ta Mu'temir b. Süleyman, Gunder, Velîd b. Müslim, Süfyân b. Uyeyne, Yahyâ el-Kattân ve Abdurrahman b. Mehdî'den hadis rivayet etti.

  Kütüb-i Sitte imamlarının hepsi, Ebû Zür'a, Ebû Hâtim, Bakī b. Mahled, İbn Ebi'd-Dünyâ, Ebû Ya'lâ el-Mevsılî ve İbn Huzeyme ondan rivayet etti. Rivayetleri Buhârî'de 114, Müslim'de 837 yerde geçer. Yahyâ b. Maîn onu sika, Ebû Hâtim sadûk, Hatîb el-Bağdâdî sika ve hâfız saymış; Nesâî ve İbn Hibbân'ın bazı eleştirileri güvenilirliğini zedeleyecek ölçüde görülmemiştir. Çok sayıda kitap yazdığı kaydedilir. Bündâr ile aynı yıl doğup aynı yıl, 252'de vefat etti.
