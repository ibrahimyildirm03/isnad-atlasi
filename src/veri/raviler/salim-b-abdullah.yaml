ozet: İbn Ömer'in oğlu, Medine'nin zâhid fakihi; yedi fakih arasında sayılıp sayılmadığı ihtilaflı.
biyografi: |
  Sâlim b. Abdullah b. Ömer, Hz. Osman'ın halifeliği yıllarında doğdu. Babası Abdullah b. Ömer, annesi Fars kökenli asilzade bir câriyedir; bazı rivayetlere göre annesi Kisrâ Yezdicerd'in kızıdır. Başta babası olmak üzere Ebû Eyyûb el-Ensârî, Hz. Âişe, Râfi' b. Hadîc, Ebû Hüreyre ve Saîd b. el-Müseyyeb'den rivayet etti.

  Oğlu Ebû Bekir, Zührî, Nâfi', Sâlih b. Keysân, Humeyd et-Tavîl, Rebîatü'r-re'y ve Amr b. Dînâr ondan hadis aldı. Güvenilirliği üzerinde ittifak vardır; Ahmed b. Hanbel ve İshak b. Râhûye'ye göre en sahih sened Zührî–Sâlim–İbn Ömer silsilesidir. Medine'nin en önemli fakihlerindendir; İbnü'l-Mübârek onu fukahâ-yi seb'anın yedincisi sayar, birçok âlim ise bu yere Ebû Bekir b. Abdirrahman'ı koyar.

  Yaşadığı dönemde zühdün nadir temsilcilerinden sayıldı ve babasına çok benzediği söylendi. Siyasetten uzak durdu; halifelere biat etti ama ihsanlarını geri çevirdi. Ömer b. Abdülazîz bunun istisnasıdır: Medine valiliğinde onun danışma kurulunda bulundu, halifeliğinde de yazışmayı sürdürdü. Kelâm tartışmalarına karşı temkinliydi. Zilhicce 106'da Medine'de vefat etti; cenaze namazını Halife Hişâm kıldırdı.
