biyografi: |
  113'te Kûfe'de yoksul ve kalabalık bir ailede doğdu. Evlendikten sonra geçim sıkıntısı yüzünden derslerden uzak kalınca Ebû Hanîfe onun nafakasını üstlenerek tahsilini sürdürmesini sağladı.

  Önce hadis öğrendi; A'meş, Hişâm b. Urve ve Ebû İshâk eş-Şeybânî'den rivayet etti. Ardından dokuz yıl İbn Ebî Leylâ'dan fıkıh okudu, sonra Ebû Hanîfe'nin halkasına geçerek yaklaşık on yedi yıl ara vermeden derslerine devam etti. Medine'de Mâlik'ten de hadis aldı.

  Mehdî döneminde Bağdat'a yerleşip kadı oldu. Hârûnürreşîd zamanında İslâm tarihinde ilk defa "kādi'l-kudât" unvanını aldı; Irak, Horasan, Şam ve Mısır'da onun onayı olmadan kadı tayin edilmediği kaydedilir.

  Hârûnürreşîd'in isteği üzerine yazdığı Kitâbü'l-Harâc, devletin malî politikasını ele alan ve malî hukuk alanında günümüze ulaşan ilk önemli eserdir; vergi, ekonomi ve sosyal hayata dair zengin bilgiler içerir. Bazı meselelerde hocasından ve diğer talebelerden ayrıldı; Hanefî mezhebindeki görüş çeşitliliğinde payı büyüktür. Muhammed b. el-Hasen, Ahmed b. Hanbel ve Yahyâ b. Maîn onun talebeleridir. 182'de Bağdat'ta vefat etti.
