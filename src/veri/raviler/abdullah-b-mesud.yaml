rical:
  sozler:
    - kim: Hz. Peygamber
      soz: Kur'an'ı indiği gibi taze okumak isteyen İbn Ümmi Abd'in kıraatiyle okusun.
      kaynak: Ahmed b. Hanbel, el-Müsned (DİA, "Abdullah b. Mes'ûd")
ozet: "Kûfe fıkıh ekolünün kurucusu sayılan sahâbî."
biyografi: |
  İslâm'ın ilk günlerinde müslüman oldu; Mekke'de Kâbe'nin yanında Kur'an'ı açıktan okuyan ilk sahâbîlerdendir. Habeşistan'a ve Medine'ye hicret etti. Hz. Peygamber'in özel hizmetinde bulundu ve ahlâk ile yaşayışı bakımından ona en çok benzeyen sahâbîlerden sayıldı. Bedir'de Ebû Cehil'i öldürdü.

  Hz. Ömer onu Kûfe'ye muallim, kadı ve beytülmal görevlisi olarak gönderdi; Hz. Osman da görevinde bıraktı. Kûfe'deki ders halkasıyla Kûfe tefsir ve fıkıh ekolünün temelini attı. Nassın bulunmadığı yerde re'y ve kıyasa başvurma anlayışı, Irak fıkıh ekolünün ve sonra Hanefî mezhebinin temel ilkelerine kaynaklık etti.

  Kendi adıyla anılan bir mushaf nüshası hazırladı. Hadis rivayetinde son derece titizdi; yaklaşık 848 rivayetinden 85'i Buhârî'de, 99'u Müslim'de yer alır. Alkame, Esved b. Yezîd, Mesrûk, Ebû Vâil ve Kays b. Ebî Hâzim onun talebeleridir; bu halka İbrâhim en-Nehaî ve Hammâd b. Ebî Süleymân üzerinden Ebû Hanîfe'ye ulaşır.

  Altmış yaşını geçtikten sonra 32/652-53'te Medine'de vefat etti ve Bakī'e defnedildi.
