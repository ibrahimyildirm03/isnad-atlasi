biyografi: |
  Hicret sırasında Hz. Peygamber'i yakalamak için yola çıktığı, onu dinleyince müslüman olduğu ve sarığını mızrağına bağlayarak bayraklı bir şekilde Medine'ye girilmesini sağladığı rivayet edilir. Hz. Peygamber ile on altı gazveye katıldı.

  Basra'ya, sonra fetihlerle Horasan'a geçti ve Yezîd b. Muâviye döneminde Merv'de vefat etti. Ondan oğulları Abdullah ve Süleymân, Ebû Nadre el-Abdî ve Şa'bî rivayet etti.
