ozet: Eyyûb ve Humeyd'in Basralı râvisi, Basra kadısı; Ahmed b. Hanbel ve İbn Maîn'in hocası.
biyografi: |
  110'da Basra'da doğdu; ailesi aslen Horasanlıdır. Annesi Uleyye bint Hassân'a nisbetle "İbn Uleyye" diye tanındı, ancak bu lakaptan hoşlanmadığı nakledilir. İlk bilgilerini Abdülvâris b. Saîd'den aldı; Eyyûb es-Sahtiyânî, Humeyd et-Tavîl, İbn Avn, İbn Ebî Arûbe, İbn Cüreyc ve Şu'be'den istifade etti.

  Abdurrahman b. Mehdî, Ali b. el-Medînî, Yahyâ b. Maîn, İshak b. Râhûye ve Ahmed b. Hanbel talebeleri arasındadır. Şu'be ona "seyyidü'l-muhaddisîn" demiş, Ahmed b. Hanbel güvenilirliğini zirvede görmüştür. Ebû Dâvûd, hata yapmayan muhaddis bulunamayacağını söylerken onu bu genellemenin dışında tutmuştur. Hadisleri yazılı metin olmadan, ezberden rivayet ederdi.

  Hârûnürreşîd'in son yıllarında Basra kadısı oldu; İbnü'l-Mübârek'in uyarısı üzerine halifeden affını istedi. Dîvânü's-sadaka ve Dîvân-ı Mezâlim'de de görev yaptı. Halku'l-Kur'ân görüşünü benimsediği iddiası üzerine Emîn'in sorgusunda bunun yanlış anlamadan kaynaklandığını söyleyip tövbe etti. 13 Zilkade 193'te Bağdat'ta vefat etti.
