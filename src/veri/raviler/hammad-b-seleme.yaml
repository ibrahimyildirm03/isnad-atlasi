ozet: Sâbit el-Bünânî ve Humeyd rivayetlerinde en güvenilir sayılan Basralı muhaddis, nahiv ve fıkıh âlimi.
eserleri:
  - Kitâbü's-Sünen
biyografi: |
  90 dolaylarında doğdu; Humeyd et-Tavîl'in kız kardeşinin oğludur. Baş örtüsü ticaretiyle geçindiği için "Bezzâz" lakabıyla da anıldı.

  Sâbit el-Bünânî, Katâde, Humeyd et-Tavîl ve İbn Ebî Müleyke'den hadis öğrendi; Sâbit ile Humeyd'den gelen rivayetlerde en güvenilir kişi kabul edildi. İbnü'l-Mübârek, Yahyâ el-Kattân, Vekî' ve Abdurrahman b. Mehdî ondan rivayet etti. Nahiv ve fıkha da önem verdi; Sîbeveyhi ve Yûnus b. Habîb ondan yararlanmış, bazı kaynaklar onu "Basra müftüsü" diye nitelemiştir.

  Yahyâ b. Maîn, Ahmed b. Hanbel, İclî ve Nesâî onu sika saydı; ancak yaşlılıkta hafızası zayıfladığı için Buhârî ondan yalnız istişhâd yoluyla bir rivayet aldı. Müslim'in onun Sâbit'ten rivayetlerine dayandığı aktarılır. Zehebî, ezberden rivayet ettiği için zaman zaman yanıldığını ama bunun onu suçlamayı gerektirmediğini belirtir.

  İbadete ve sünnete bağlılığıyla tanındı; devlet adamlarının davetlerine icabet etmedi, ders verdiklerinden hediye kabul etmedi. Fıkıh bablarına göre düzenlenmiş Kitâbü's-Sünen adlı bir eseri olduğu kaydedilir. 19 Zilhicce 167'de Basra'da bir mescitte namaz kılarken vefat etti.
