ozet: Mekke'nin büyük muhaddisi; Şâfiî ve Ahmed b. Hanbel'in hocası.
biyografi: |
  Şâban 107'de Kûfe'de doğdu; Hilâl b. Âmir oğullarına nisbetle "el-Hilâlî" diye anılır. Babası dokuz çocuğunu ilme yönlendirmiş, kardeşlerinden dördü de hadis rivayet etmiştir. Irak valisi Hâlid el-Kasrî'nin azlinden sonra aile Mekke'ye gidip yerleşti ve Süfyân küçük yaşta hadis meclislerine katılmaya başladı.

  Çoğu tâbiîn neslinden seksenden fazla hocası vardır; Amr b. Dînâr, Zührî, Eyyûb es-Sahtiyânî, Hişâm b. Urve ve Ma'mer bunlar arasındadır. Zührî onun zekâsını erken fark edip özel ilgi gösterdi; Mâlik ile birlikte Zührî rivayetlerinde en güvenilir isim sayılır. 7000'den fazla hadis rivayet ettiği belirtilir ve Süfyân es-Sevrî ile birlikte "Süfyânân" diye anılır.

  Humeydî, İbnü'l-Mübârek, İbn Mehdî, İmam Şâfiî, Abdürrezzâk, Ahmed b. Hanbel, Ali b. el-Medînî ve Yahyâ b. Maîn talebeleri arasındadır. Mekke'de uzun yıllar ders vererek Hicaz'ın hadis merkezi oldu; tefsirleri de derlenip yayımlanmıştır. Zâhid, fakir bir hayat sürdü ve yetmiş (veya seksen) kez hac yaptığı kaydedilir.

  Vefatından bir yıl önce hafızasının karıştığı yönündeki rivayeti Zehebî doğru bulmamıştır. 1 Receb 198'de Mekke'de vefat etti ve Hacûn'a defnedildi.
