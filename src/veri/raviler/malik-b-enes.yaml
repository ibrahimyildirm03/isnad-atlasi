biyografi: |
  Genellikle 93/712'de doğduğu kaydedilir; 90 ile 98 arasında farklı tarihler de verilmiştir. Medine'de yetişti ve küçük yaşta Abdurrahmân b. Hürmüz el-A'rec'in derslerine başladı. Rebîatü'r-re'y, İbn Şihâb ez-Zührî, Nâfi' ve Yahyâ b. Saîd el-Ensârî'den ilim aldı.

  Hac dışında Medine'den ayrılmadı; Halife Mehdî'nin Bağdat'a davetini kabul etmedi. Mansûr döneminde, zorla yaptırılan boşamanın geçersiz olduğunu bildiren hadisi rivayet ettiği gerekçesiyle 146/763'te kırbaçlandı ve omzu sakatlandı. Halifelerin onun hadis derlemesini bütün ülkede zorunlu kılma önerisini, her bölgenin kendi bildiği sünnete göre amel etmesi gerektiği düşüncesiyle reddetti.

  Hadis ile fıkhı bir arada içeren el-Muvatta', Medine'nin sünnetini ve amelini yansıtan ilk büyük derlemelerdendir ve Kütüb-i Tis'a arasında sayılır. Medine ehlinin amelini delil kabul etmesi mezhebinin ayırt edici özelliğidir.

  Hadis otoriteleri onu "hadiste mü'minlerin emîri" diye andı; İbn Rüşd onu re'y ve kıyasta da önder saydı. İbn Vehb, İbnü'l-Kāsım, Eşheb, Yahyâ b. Yahyâ el-Leysî, Şâfiî ve İmam Muhammed talebeleri arasındadır. 14 Rebîülevvel 179'da Medine'de vefat etti.
