ozet: es-Sünen'in müellifi Semerkantlı hâfız; Müslim, Ebû Dâvûd ve Tirmizî'nin hocası.
biyografi: |
  181'de Semerkant'ta doğdu; Temîm kabilesinin Dârim koluna mensuptur. Hadis öğrenmek için Hicaz, Mısır, Şam, Irak, Kûfe ve Horasan'ı dolaştı. Nadr b. Şümeyl, Yezîd b. Hârûn, Hâlid b. Mahled, Muhammed b. Selâm el-Bîkendî ve Affân b. Müslim hocaları arasındadır. Bağdat'ta da hadis rivayet etti.

  Sultanın ısrarı üzerine Semerkant kadılığını kabul etti, fakat tek bir hüküm verdikten sonra görevden ayrıldı. Ahmed b. Hanbel onun zühdünü ve kanaatkârlığını övmüş, kendisine servet teklif edildiği hâlde kabul etmediğini anlatmıştır. Ahmed ve Ebû Hâtim onu cerh ve ta'dîlde otorite saydı; Ahmed, onun görüşü üzerine Yahyâ el-Himmânî'den rivayeti terk etmiştir.

  es-Sünen'inde bab başlıklarında fıkhî görüşlerini belirtmesi ve hadisleri farklı konularda tekrarlaması Buhârî'nin Sahîh'ini andırır; bazı âlimler onu İbn Mâce'nin yerine Kütüb-i Sitte'nin altıncısı saymış, eser Kütüb-i Tis'a arasında yer almıştır.

  Buhârî, Müslim, Ebû Dâvûd, Tirmizî ve Nesâî onun talebeleri arasındadır. 255'te Merv'de vefat etti.
