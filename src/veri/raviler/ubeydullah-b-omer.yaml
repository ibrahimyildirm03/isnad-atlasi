rical:
  rumuz: "ع"
  sozler:
    - {kim: Ahmed b. Hanbel, soz: "Nâfi' rivayetlerinde Mâlik, Eyyûb ve Ubeydullah'ın en sağlamı, en hâfızı ve en çok rivayet edeni Ubeydullah'tır.", kaynak: "İbn Abdülhâdî, Tabakātü ulemâi'l-hadîs, I, 249"}
    - {kim: Yahyâ b. Maîn, soz: "Ubeydullah, Kāsım'dan, o da Âişe'den: inciyle süslenmiş altın.", kaynak: "İbn Abdülhâdî, Tabakātü ulemâi'l-hadîs, I, 249"}
ozet: Nâfi' rivayetlerinde Ahmed b. Hanbel'in Mâlik'ten bile sağlam saydığı Medineli hâfız; Hz. Ömer'in soyundan.
biyografi: |
  Ebû Osmân Ubeydullah b. Ömer b. Hafs b. Âsım, Hz. Ömer'in torununun torunudur. Zehebî'ye göre 70'ten sonra doğdu; sahâbî Ümmü Hâlid'e yetişip ondan dinlediği için küçük tâbiînden sayılır.

  Hz. Ömer'in soyundan gelen Medineli bir hâfızdır. Sahâbî Ümmü Hâlid bint Hâlid'den tek bir hadis rivayet etti; Kāsım b. Muhammed, Sâlim b. Abdullah, Atâ, Nâfi', el-Makbürî ve Zührî'den hadis aldı.

  Sâlih, âbid ve çok ilim sahibi biri olarak tanındı; Muhammed b. Abdullah en-Nefsü'z-Zekiyye'nin isyanına katılmadı. Nesâî onu sika ve sebt saydı. Ahmed b. Hanbel, Nâfi' rivayetlerinde Mâlik, Eyyûb ve Ubeydullah'ın en sağlamının o olduğunu söylemiş, Ahmed b. Sâlih de bu konuda onu Mâlik'e tercih etmiştir.

  Şu'be, iki Süfyân, Yahyâ el-Kattân ve Abdürrezzâk ondan rivayet etti.

  Dayısı Hubeyb b. Abdirrahman, Amr b. Şuayb, Sâbit el-Bünânî, Ebü'z-Zinâd ve Amr b. Dînâr da hocaları arasındadır. İbn Cüreyc, Ma'mer, Hammâd b. Seleme ve İbnü'l-Mübârek de ondan rivayet etti. Yahyâ b. Maîn, onun Kāsım–Âişe yoluyla rivayetini "incilerle işlenmiş altın" diye nitelemiş ve bunu Zührî–Urve–Âişe yolundan daha çok sevdiğini söylemiştir. Muhammed b. el-Hasen el-Hacvî de onu Medine'nin büyük fakihleri arasında anar. 147'de vefat ettiği kaydedilir.
