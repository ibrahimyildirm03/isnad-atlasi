vefat_yeri: Basra
dogum_yeri: Medine
bolge: basra
imam: {mezheb: Hasan el-Basrî, yasayan: false}
ozet: Basra'nın zühd, vaaz ve fıkıh önderi; "Basralıların imamı" diye anılan tâbiî.
biyografi: |
  21/642'de Medine'de doğdu. Babası Yesâr, Irak'ın fethinde esir alınıp Medine'ye getirilmişti; annesi Hayre, Ümmü Seleme'nin hizmetindeydi ve Hasan onun evinde yetişti. On iki yaşında Kur'an'ı ezberledi.

  Yetmişi Bedir gazisi olmak üzere yüz yirmi kadar sahâbî ile görüştüğü rivayet edilir. Vâdilkurâ'da ilme yöneldi ve Hz. Ali'nin halifeliğinden sonra Basra'ya yerleşti. Muâviye döneminde Rebî' b. Ziyâd'ın seferinde kâtiplik yaptı ve Kâbil seferine katıldı.

  Ömrünü Basra'da vaaz ve ibadetle geçirdi; bir süre ücretsiz kadılık yaptıktan sonra istifa etti. Haccâc'ın Saîd b. Cübeyr'i öldürmesini büyük felaket saydı, fakat isyanın fitneye yol açacağı endişesiyle ona karşı ayaklanmayı doğru bulmadı. Abdülmelik'e yazdığı kader risalesinde insanın irade ve sorumluluğunu ortadan kaldıran katı cebir anlayışını eleştirdi.

  Allah korkusunu esas alan Basra zühd okulunun önderidir; ölçülü bir zühd anlayışını savundu ve dünyadan tamamen kopmadı. Sûfîler onu öncü kabul eder ve tarikat silsilelerinde ona yer verir.

  Enes b. Mâlik, Ebû Hüreyre, İmrân b. Husayn ve başka sahâbîlerden rivayet etti. Bazı rivayetlerinde aradaki râviyi düşürdüğü (irsal) için eleştirildiyse de Yahyâ b. Saîd ve Ebû Zür'a bunların çoğunun zayıf sayılmayacağını belirtmiştir. Katâde, Eyyûb es-Sahtiyânî, Humeyd et-Tavîl ve Mansûr b. el-Mu'temir onun talebelerindendir. 110/728'de Basra'da vefat etti.
