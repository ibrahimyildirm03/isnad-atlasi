ozet: '"Süvarilerimizin en hayırlısı" övgüsünü alan Ensârî sahâbî.'
biyografi: |
  Hazrec'in Selimeoğulları kolundandır. Gābe gazvesindeki başarısı üzerine Hz. Peygamber onun için "Süvarilerimizin en hayırlısı Ebû Katâde'dir" buyurdu. Hz. Ali onu bir süre Mekke valiliğine tayin etti.

  Ondan Enes b. Mâlik, Câbir b. Abdullah, Saîd b. el-Müseyyeb, Atâ b. Yesâr ve oğulları Abdullah ile Sâbit rivayet etti.
