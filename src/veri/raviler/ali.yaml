ozet: "Dördüncü halife; hilâfet merkezini Kûfe'ye taşıyan sahâbî."
biyografi: |
  600 civarında Mekke'de doğdu ve Hz. Peygamber'in himayesinde büyüdü; ilk müslümanlardandır. Hicret gecesi Hz. Peygamber'in yatağında kalarak müşriklerin dikkatini dağıttı. Hz. Fâtıma ile evlendi; Hasan ve Hüseyin onun oğullarıdır.

  Bedir, Uhud, Hendek ve Hayber başta olmak üzere gazvelerin çoğunda bulundu ve sancaktarlık yaptı. Hz. Peygamber onu Yemen'e kadı olarak gönderdi. Hz. Osman'ın şehadetinden sonra 35/656'da halife oldu. Halifeliği Cemel, Sıffîn ve Nehrevan savaşlarıyla geçti; hilâfet merkezini Kûfe'ye taşıdı. Bu da Kûfe'nin ilim merkezi olarak gelişmesine katkıda bulundu.

  Kur'an, hadis ve özellikle fıkıh ve kazâda otorite kabul edildi; 586 hadis rivayet etti. Oğulları Hasan, Hüseyin ve Muhammed b. el-Hanefiyye ile İbn Abbâs ve Ebü'l-Esved ed-Düelî onun talebeleri arasındadır. Tasavvuf geleneğinde de müstesna bir yeri vardır.

  40/661'de Kûfe'de sabah namazına giderken Hâricî Abdurrahmân b. Mülcem'in zehirli kılıç darbesiyle yaralandı ve iki gün sonra vefat etti.
