  aciklama: Hz. Peygamber zamanında müslüman olduğu hâlde onu göremediği için muhadram tâbiîlerdendir. Babasının adı Avf veya Husayn'dır.
dogum: {not: "muhtemelen hicretten 5 yıl önce"}
