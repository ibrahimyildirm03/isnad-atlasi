isim: Kays b. Ebî Hâzim
tam_isim: Ebû Abdillâh Kays b. Ebî Hâzim Avf b. Abdilhâris el-Becelî el-Ahmesî el-Kûfî
arapca: قيس بن أبي حازم
tabaka: tabiin
