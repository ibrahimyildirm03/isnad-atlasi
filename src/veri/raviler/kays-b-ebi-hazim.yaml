  tehzibut_tehzib: "VIII, 386-389"
  rumuz: "ع"
ozet: Aşere-i mübeşşerenin hepsinden rivayet ettiği söylenen muhadram tâbiî; isnadı en sağlam Kûfelilerden.
biyografi: |
  Hz. Peygamber hayattayken müslüman oldu, Medine'ye geldiğinde onun vefat ettiğini öğrendi ve Ebû Bekir'e biat etti. Sahâbeden çok sayıda hadis rivayet etti; hadis otoriteleri onu isnad bakımından tâbiînin en sağlamlarından saydı.

  İbn Mes'ûd, Ebû Mûsâ el-Eş'arî, Huzeyfe ve Ebû Hüreyre'den rivayet etti. Yaşlılığında hafızası zayıfladıysa da erken dönemde tespit edilen rivayetleri güvenilir kabul edildi. A'meş ondan rivayet edenlerdendir.
