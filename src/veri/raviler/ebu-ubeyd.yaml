biyografi: |
  Tahminen 154'te Herat'ta doğdu; Bizans asıllı babası Ezd kabilesinden birinin âzatlısıydı. Herat'ta ilk eğitimini aldıktan sonra 179'da Kûfe ve Basra'ya giderek Kisâî, Ferrâ, Ebû Ubeyde ve Asmaî gibi dil ve nesep âlimlerinden, İbnü'l-Mübârek, Süfyân b. Uyeyne ve Yahyâ el-Kattân'dan hadis öğrendi.

  Herat ve Merv'de valilerin çocuklarına hocalık yaptı; Bağdat'ta bu görevi sürdürürken İmam Şâfiî'den fıkıh okudu ve onunla ilmî tartışmalar yaptı. Sâbit b. Nasr Tarsus valisi olunca onu Tarsus kadılığına getirdi; on sekiz yıl süren bu görevden telif çalışmalarına engel olduğu için ayrıldı. 213'te Yahyâ b. Maîn ile Mısır'a gitti, Bağdat'ta garîbü'l-hadîs okuttu.

  Hadis, fıkıh, dil, edebiyat ve tarihte dönemin önde gelenlerindendir. Konulara göre düzenlenmiş ilk garîbü'l-luga kitabı el-Garîbü'l-musannef en önemli eseridir; Garîbü'l-hadîs ve İslâm malî hukukunun temel kaynaklarından Kitâbü'l-Emvâl de meşhurdur. Kitâbü'l-Îmân, Sünnî doktrini açıklayan ilk çalışmalardan sayılır.

  219'da hacca gitti ve gördüğü bir rüya üzerine Mekke'de kalmaya karar verdi. Muharrem 224'te Mekke'de vefat etti.
