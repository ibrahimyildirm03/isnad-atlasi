biyografi: |
  200 veya 202'de Kûfe'de doğdu; ailesi İsfahanlı olduğu için "el-İsfahânî" diye de anılır. Basra ve Bağdat'ta Ebû Sevr, Süleyman b. Harb, Ka'nebî ve Müsedded b. Müserhed'den ders aldı; ardından Nîşâbur'da İshak b. Râhûye'nin derslerine devam edip tahsilini tamamladı. Şâfiî'nin vefatında dört yaşında olduğundan onun talebesi olması mümkün görülmez.

  Ebû Sevr'in etkisiyle babasının mezhebi olan Hanefîliği bırakıp Şâfiî mezhebini seçti ve Şâfiî hakkında kitap yazan ilk müellif oldu. İbn Râhûye'nin etkisiyle müstakil ictihada yöneldi; Şâfiî'nin re'y ve istihsana yönelttiği eleştirileri de ileri taşıyarak Kitap ve Sünnet'in zâhirine dayanan Zâhiriyye mezhebini ortaya koydu. Kıyası büyük ölçüde reddetti ve icmâyı sahâbe icmâıyla sınırladı.

  Bağdat'taki derslerinde yaklaşık dört yüz talebesi bulunduğu kaydedilir; mantık ve cedelde mahirdi ve hocası İbn Râhûye ile serbestçe tartışabilen tek talebe olduğu söylenir. Kur'an'ın mahlûk olduğu görüşünü benimsediği bildirildiği için Ahmed b. Hanbel onun ziyaretini kabul etmemiştir.

  İbnü'n-Nedîm yaklaşık 150 eserinin adını verir, ancak hiçbiri günümüze ulaşmamıştır. Mezhebi oğlu Muhammed tarafından sürdürüldü, Endülüs'te İbn Hazm'ın eserleriyle önem kazandı. Ramazan 270'te Bağdat'ta vefat etti ve Şûnîziyye Mezarlığı'na defnedildi.
