isim: İbn Şihâb ez-Zührî
tam_isim: Ebû Bekr Muhammed b. Müslim b. Ubeydillâh İbn Şihâb ez-Zührî el-Kureşî
arapca: محمد بن مسلم بن شهاب الزهري
