ozet: Belh'in Bağlân köyünden hadis hâfızı; Leys b. Sa'd, Mâlik ve Süfyân b. Uyeyne'nin talebesi, Ahmed b. Hanbel'in hocalarından. Buhârî ondan 380, Müslim 668 hadis nakletmiştir.
biyografi: |
  Ebû Recâ' Kuteybe b. Saîd 149 veya 150'de doğdu; Sakīf'in mevlâsıdır ve Belh yakınlarındaki Bağlân köyünden olduğu için "el-Bağlânî" nisbesiyle anılır. Kuteybe'nin lakabı, asıl adının Yahyâ veya Ali olduğu da söylenmiştir. Gençliğinde re'y taraftarıyken bir rüyanın yorumu üzerine hadise yöneldi.

  172'de başladığı yolculukta Bağdat, Şam, Mısır, Mekke ve Medine'yi dolaştı; Leys b. Sa'd, İbn Lehîa, Ebû Avâne, Mâlik, Hammâd b. Zeyd ve Süfyân b. Uyeyne'den hadis öğrendi. 216'da Bağdat'a geldiğinde Yahyâ b. Maîn, Ahmed b. Hanbel, Humeydî, Ali b. el-Medînî ve İbn Ebî Şeybe ondan hadis dinledi.

  Rivayetleri Kütüb-i Sitte'nin hepsinde yer alır; Buhârî ondan 380, Müslim 668 hadis nakletmiştir. Hadis münekkitleri onu güvenilir kabul etmiştir. Şiir yazdığı ve oldukça zengin olduğu belirtilir. Şâban 240'ta Bağlân'da vefat etti.
