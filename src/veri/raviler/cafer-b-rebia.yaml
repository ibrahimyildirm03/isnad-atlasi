biyografi: |
  Ebû Şürahbîl Ca'fer b. Rebîa el-Kindî, sahâbî Şürahbîl b. Hasene'nin torunudur ve Benî Zühre'nin halîfidir. Mısır'da doğdu veya oraya yerleşti. Babası Rebîa Hz. Peygamber'i görmüş, kendisi de sahâbî Abdullah b. el-Hâris b. Cez'i görmüştür.

  Ebû Seleme b. Abdirrahman, Ebü'l-Hayr Mersed el-Yezenî, Irâk b. Mâlik ve A'rec'den rivayet etti; Buhârî, A'rec ve Bekir b. Sevâde'den dinlediğini kaydeder. Leys b. Sa'd, Bekir b. Mudar, İbn Lehîa ve Yahyâ b. Eyyûb ondan hadis aldı. Rivayetleri Kütüb-i Sitte'nin hepsinde yer alır.

  İbn Sa'd ve Nesâî onu sika saymış; Ahmed b. Hanbel "hadis ehlinden, güvenilir bir şeyh" diye nitelemiştir. Vefatı için 132, 134 ve 136 tarihleri verilir; Zehebî 136'yı daha sahih bulur.
