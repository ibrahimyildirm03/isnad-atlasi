biyografi: |
  104'te Vâsıt'ta doğdu; ailesi aslen Buharalı veya Belhlidir. Babası Haccâc'ın aşçılarındandı ve yoksulluk yüzünden oğlunun okumasına izin vermedi. Hüşeym babasından habersiz Ebû Şeybe el-Kādî'nin derslerine devam etti; hocasının bir ziyareti üzerine babası da razı oldu.

  Mekke, Basra ve Kûfe'ye yolculuk ederek Zührî, Amr b. Dînâr, Eyyûb es-Sahtiyânî, Humeyd et-Tavîl ve A'meş'ten hadis öğrendi. 145'te Mansûr'a karşı İbrâhim b. Abdullah'ın ayaklanmasına katıldı; bu savaşta oğlu ve kardeşi öldürüldü. Daha sonra Bağdat'a göçüp ölümüne kadar orada yaşadı.

  Ahmed b. Hanbel ilk hadis derslerini ondan aldı ve dört beş yıl devam etti. Süfyân es-Sevrî, Şu'be, Mâlik, İbnü'l-Mübârek, Yahyâ el-Kattân, İbn Mehdî, Ali b. el-Medînî ve Yahyâ b. Maîn de ondan rivayet etti. Yaklaşık 20.000 hadis ezberlediği belirtilir.

  Sika ve hâfız kabul edilmekle birlikte çok tedlîs ve irsâl yapmakla eleştirildi. Hadislerini bablara göre ilk tasnif edenler arasında anılır. 25 Şâban 183'te Bağdat'ta vefat etti ve Hayzürân Kabristanı'na defnedildi.
