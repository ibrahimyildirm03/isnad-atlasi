biyografi: |
  603 civarında Medine'de doğdu; on sekiz yaşında müslüman oldu ve İkinci Akabe biatına katıldı. Hicretten sonra Hz. Peygamber onu Abdullah b. Mes'ûd ile kardeş ilan etti. Huneyn ve Tâif dışındaki seferlerin hemen hepsinde bulundu.

  9/630'da Hz. Peygamber onu Yemen'e elçi, zekât memuru, kadı ve muallim olarak gönderdi; bir meselede Kitap ve sünnette hüküm bulamazsa re'yiyle içtihad edeceğini söylediği meşhur rivayet bu görevle ilgilidir. Kendini peygamber ilan eden Esved el-Ansî'nin bertaraf edilmesine yardım etti.

  Hz. Ebû Bekir döneminde Yermük, Ecnâdeyn ve Dımaşk başta olmak üzere Şam fetihlerine katıldı; Hz. Ömer onu Şam'a muallim olarak da gönderdi. Kur'an'ın tamamını ezberlemişti ve helal ile haramı en iyi bilen sahâbî olarak övüldü. 157 hadis rivayet etti; İbn Abbâs, İbn Ömer ve Enes b. Mâlik ondan rivayet edenler arasındadır.

  Ebû Ubeyde b. el-Cerrâh'ın vebadan vefatı üzerine ordunun komutasını üstlendi ve kısa süre sonra 18/639'da Amvâs vebasında vefat etti. Ürdün'de adını taşıyan bir köyde türbesi bulunur.
