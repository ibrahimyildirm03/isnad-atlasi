biyografi: |
  Ebû Abdillâh Cerîr b. Abdilhamîd ed-Dabbî er-Râzî, kaydedildiğine göre 110'da İsfahan'a bağlı Âbe kasabasında doğdu; 107'de Kûfe'de doğduğu da rivayet edilir. Öğrenim çağında Bağdat ve Mekke'ye gitti, uzun süre Kûfe'de kaldıktan sonra Rey'e yerleşip hadis rivayetine başladı.

  Mansûr b. el-Mu'temir, Âsım el-Ahvel, Hişâm b. Urve, Yahyâ b. Saîd el-Ensârî ve A'meş'ten hadis dinledi; kıraati Hamza b. Habîb ile A'meş'ten öğrendi. İbnü'l-Mübârek, Yahyâ b. Maîn, Ali b. el-Medînî, İshak b. Râhûye, Ahmed b. Hanbel ve Ebû Bekir b. Ebî Şeybe ondan rivayet etti; birçok talebe uzak ülkelerden gelerek ondan hadis öğrendi.

  Duyduğu hadisleri hemen yazar, kitabı yanında yokken rivayet etmezdi. Bid'at ehlinden hadis almayı câiz görmediği için Câbir el-Cu'fî ve İbn Cüreyc gibi isimlerin rivayetlerine itibar etmedi. Güvenilirliği üzerinde âlimler ittifak etmiş; ömrünün sonunda hafızasının zayıfladığı iddiasının, İbn Hacer'e göre Cerîr b. Hâzim ile karıştırılmaktan kaynaklandığı belirtilmiştir. Zühd ve takvâsıyla tanınan Cerîr 188'de Rey'de vefat etti.
