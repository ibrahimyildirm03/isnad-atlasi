ozet: Sevrî'nin Kûfe'deki halefi; Ahmed b. Hanbel, İbn Maîn, İbnü'l-Medînî ve İbn Ebî Şeybe'nin hocası.
biyografi: |
  128 ya da 129 yılında doğdu; Benî Ruâs'a mensup Arap bir ailedendir. Babası Cerrâh, Kûfe'de beytülmal görevlisiydi; annesinden büyük bir miras kaldı.

  Çok erken yaşta hadisle ilgilendi; 145/762'de A'meş'ten hadis öğrendi. Hişâm b. Urve, Süfyân es-Sevrî, Şu'be, İbn Cüreyc, Evzâî, Mâlik ve Hammâd b. Seleme hocaları arasındadır. Çok güçlü bir hafızası vardı; otuz üç yaşında rivayete başladı ve Süfyân es-Sevrî'nin ardından Kûfe'de onun yerini aldı.

  Hârûnürreşîd'in kadılık teklifini kabul etmedi; bu teklifi kabul eden yakın dostu Hafs b. Gıyâs ile ilişkisini kesti. Emîn'in verdiği görevi de reddetti. Ebû Hanîfe'ye sert muhalefetiyle bilinen Sevrî'nin en gözde talebesi olduğu hâlde Ebû Hanîfe'den rivayet etti ve onun görüşleriyle fetva verdi.

  184/800'de Mekke'de Hz. Peygamber'in naaşıyla ilgili anlattığı bir rivayet halkın tepkisine yol açtı; vali idam kararı verdiyse de Süfyân b. Uyeyne'nin araya girmesiyle Mekke'den çıkarılmakla yetinildi. 539 rivayet içeren Kitâbü'z-Zühd'ü ve Cüz' fi'l-hadîs'i bilinen eserleridir. Ahmed b. Hanbel, Yahyâ b. Maîn, Ali b. el-Medînî, İbn Ebî Şeybe ve Humeydî onun talebeleridir. Hacdan dönerken 197'de Feyd'de vefat etti.
