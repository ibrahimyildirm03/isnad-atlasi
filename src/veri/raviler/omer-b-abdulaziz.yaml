biyografi: |
  61'de Medine'de doğdu. Babası Mısır valisi Abdülazîz b. Mervân, annesi Hz. Ömer'in torunu Ümmü Âsım'dır. Babası onu Medine'de Sâlih b. Keysân'a emanet etti; Enes b. Mâlik ve Abdullah b. Ömer gibi sahâbîlerden hadis dinledi, Ubeydullah b. Abdullah, Saîd b. el-Müseyyeb ve Urve'nin derslerine katıldı.

  87'de Hicaz valisi oldu ve yaklaşık yedi yıl bu görevde kaldı; Mescid-i Nebevî'yi genişletti. Haccâc'ı sert biçimde eleştirdiği için 93'te azledildi. Halife Süleyman onu veliaht tayin etti ve 99'da ısrarlar üzerine halifeliği kabul etti.

  Zalim valileri görevden alıp yerlerine dindar ve dürüst kişiler atadı, haksız yere el konulan malları iade ettirdi, hutbelerde Hz. Ali'ye lânet etme geleneğini kaldırdı ve müslüman olan mevâlîden cizye alınmasına son verdi. Halifelik için maaş almadı, Hunâsıra'da sade bir hayat sürdü.

  Sahih hadislerin tedvinini resmen başlattı; Zührî'ye hadis derletip mecmuaları bölgelere gönderdi ve Medine valisinden özellikle Kāsım b. Muhammed'in rivayetlerini toplamasını istedi. Kendisi de çok hadis rivayet eden güvenilir bir muhaddis ve fakihti. Adaletiyle Hz. Ömer'e, zühdüyle Hasan-ı Basrî'ye, ilmiyle Zührî'ye benzetilir. Receb 101'de Humus'a bağlı Deyrsem'ân'da vefat etti.
