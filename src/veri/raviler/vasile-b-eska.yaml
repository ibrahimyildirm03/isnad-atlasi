biyografi: |
  Tebük seferi hazırlıkları sırasında (9/630) Medine'ye gelerek müslüman oldu; ailesi bu kararına farklı tepkiler gösterdi. Ashâb-ı Suffe arasında yer aldı ve Hz. Peygamber'e üç yıl hizmet etti.

  Hz. Peygamber'in vefatından sonra Şam fetihlerine katıldı; Basra'da, Dımaşk yakınındaki Belât köyünde ve son olarak Kudüs'te yaşadı. Siyasî çalkantılardan uzak durdu; Hz. Ali ve Ehl-i beyt aleyhtarlığını benimsemedi.

  Rivayetleri Kütüb-i Sitte'de yer alır; Ahmed b. Hanbel'in Müsned'inde on sekiz kadar hadisi bulunur. Ebû İdrîs el-Havlânî, Mekhûl ve kızı Füseyle ondan rivayet etti. 83 ya da 85 yılında doksan sekiz ya da yüz beş yaşında vefat etti; Şam'da vefat eden son sahâbîlerdendir.
