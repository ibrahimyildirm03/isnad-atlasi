biyografi: |
  126'da San'a'da doğdu. On sekiz yaşında İbn Cüreyc'ten hadis aldı; Hicaz, Şam ve Irak'ta Ma'mer b. Râşid, Süfyân es-Sevrî, İbn Uyeyne ve Mâlik'ten ders gördü. Ma'mer'in yanında yaklaşık sekiz yıl kaldı ve bu sürede on bin kadar hadis yazdı.

  Ahmed b. Hanbel onun yanında bir yıl kadar kalarak pek çok hadis aldı; Yahyâ b. Maîn, İshâk b. Râhûye ve Ali b. el-Medînî de talebeleri arasındadır. Böylece San'a, 2. asrın sonunda hadis talebelerinin akın ettiği bir merkez hâline geldi.

  Ömrünün sonunda gözlerini kaybetti; bundan sonra kitabında bulunmayan bazı rivayetler ona nisbet edilmeye başlandı. Ahmed b. Hanbel, Nesâî ve İbnü's-Salâh bu döneme ait rivayetlerde ihtiyatlı olunması gerektiğini belirtti. Hz. Ali'ye sevgisi ve Ehl-i beytin faziletine dair rivayetleri yüzünden Şiîlikle itham edildi; ancak Ebû Bekir ve Ömer'i Ali'den üstün tuttuğu kaydedilir, Ahmed b. Hanbel de bu iddiayı doğrulayacak bir şey duymadığını söylemiştir.

  Fıkıh bablarına göre düzenlenmiş ve 21.033 rivayet ihtiva eden el-Musannef'i Ma'mer'in Kitâbü'l-Câmi'i ile sona erer. et-Tefsîr'i Ma'mer yoluyla Katâde'nin tefsirini de içerir. 211'de San'a'da vefat etti.
