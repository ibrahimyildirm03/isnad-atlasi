biyografi: |
  Tâbiînin ikinci tabakasındandır; çok hadis bilen, güvenilir bir muhaddis ve tanınmış bir fakihtir. Saîd b. el-Âs'ın Medine valiliği döneminde (49-54) Medine kadılığı yaptı.

  Ebû Hüreyre, Ümmü Seleme, Urve ve sütteyzesi Hz. Âişe'den ilim aldı; İbn Abbâs ile ilmî tartışmalarıyla tanınır. Zührî, Yahyâ b. Ebî Kesîr ve Yahyâ b. Saîd el-Ensârî ondan rivayet etti. Medine'nin yedi fakihi sayılırken yedinci isim olarak Sâlim ve Ebû Bekr b. Abdirrahmân ile birlikte o da anılır.
