ozet: Hz. Ömer'in Basra'ya muallim olarak gönderdiği fakih sahâbî; Basra kadısı.
biyografi: |
  Hayber'in fethi yılında (7/628) Ebû Hüreyre ile aynı yıl müslüman oldu. Hz. Ömer onu halka dinî bilgileri öğretmek üzere Basra'ya gönderdi; Basralılar onu sahâbenin fakihlerinden sayardı. Kısa bir süre Basra kadılığı yaptı.

  Hz. Ali dönemindeki iç savaşlara katılmadı. Ondan Hasan el-Basrî, Muhammed b. Sîrîn, Mutarrif b. Abdullah, Ebû Recâ el-Utâridî, Abdullah b. Büreyde ve Şa'bî rivayet etti.
