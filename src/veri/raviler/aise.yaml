biyografi: |
  Hz. Ebû Bekir'in kızıdır; kabul edilen görüşe göre bi'setin dördüncü yılında (614) Mekke'de doğdu. Hicretin ikinci yılında Medine'de Hz. Peygamber ile evlendi ve "ümmü'l-mü'minîn" diye anıldı.

  İfk hadisesinde iftiraya uğradı; beraati Nûr sûresindeki âyetlerle bildirildi. Hz. Peygamber onun odasında vefat etti ve orada defnedildi. Hz. Ömer'in Hz. Peygamber'in yanına defnedilmesine, kendisi için düşündüğü yeri bırakarak izin verdi. Cemel Vak'ası'nda Hz. Ali'nin karşısında yer aldı, daha sonra siyasetten çekilerek Medine'de ilimle meşgul oldu.

  Kur'an'ı tefsir etti, sahâbenin bazı rivayetlerini düzelttiği istidrakleriyle hadis tenkidi anlayışına öncülük etti. Fıkıh ve ferâizdeki derin bilgisiyle müctehid sayıldı ve sahâbenin en çok fetva verenlerinden biri oldu. 2210 hadis rivayet etti; Medine'nin ilim merkezi hâline gelmesinde ve kadınların eğitiminde önemli rol oynadı.

  Yeğenleri Urve b. ez-Zübeyr ile Kāsım b. Muhammed başta olmak üzere Mesrûk, Saîd b. el-Müseyyeb ve Amre bint Abdirrahmân onun talebeleridir. 17 Ramazan 58'de Medine'de vefat etti.
