ozet: Horasan'da Ehl-i sünnetin imamı ve mutlak müctehid; Buhârî'ye Sahîh'i yazmayı teşvik eden hoca.
biyografi: |
  161'de (163 ve 166 da denir) Merv'de doğdu ve ilk tahsilini orada yaptı. Temîm'in Hanzala koluna mensup babasının Mekke yolunda doğması sebebiyle ailesi "Râhûye" (yolda doğan) lakabıyla anıldı.

  Yirmi üç yaşında ilim yolculuğuna çıktı; Irak, Şam, Hicaz ve Yemen'de İbnü'l-Mübârek, Vekî', Süfyân b. Uyeyne, Abdurrahmân b. Mehdî, Abdürrezzâk, Yahyâ el-Kattân ve Şâfiî'den hadis aldı. Yüz bin hadis bildiği ve yetmiş bin hadisi talebelerine ezberden yazdırdığı rivayet edilir.

  Tahsilini tamamladıktan sonra Nîşâbur'a yerleşti ve ömrünün sonuna kadar orada ders verdi. Fıkıhta önce re'y ehlinin yolunu izledi; Şâfiî ile yaptığı tartışmalardan sonra onun usulünü benimsedi. Ahmed b. Hanbel'e yakınlığı sebebiyle Hanbelî sayıldıysa da herhangi bir mezhebe bağlanmayan mutlak bir müctehid olduğu anlaşılır.

  Buhârî, onun teşvikiyle el-Câmiu's-sahîh'ine yalnız sahih hadisleri almaya karar vermiştir. Altı cilt olduğu kaydedilen el-Müsned'inin bir cildi günümüze ulaşmıştır. Ahmed b. Hanbel, Buhârî, Müslim, Ebû Dâvûd, Tirmizî ve Nesâî onun talebeleridir. 14 Şâban 238'de Nîşâbur'da vefat etti.
