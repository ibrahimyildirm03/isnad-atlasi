  rumuz: "ع"
  sozler:
    - {kim: Şu'be, soz: "Hadisi Zührî'nin hadisinden daha güzeldir.", kaynak: "İbn Abdülhâdî, Tabakātü ulemâi'l-hadîs, I, 206"}
    - {kim: Ahmed b. Hanbel, soz: "Zührî ona muhalefet ederse söz Yahyâ'nın sözüdür.", kaynak: "İbn Abdülhâdî, Tabakātü ulemâi'l-hadîs, I, 206"}
