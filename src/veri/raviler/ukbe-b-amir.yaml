ozet: "Mısır valiliği yapan, Mısır hadis rivayetinin önde gelen sahâbîsi."
biyografi: |
  Cüheyne kabilesindendir. Müslüman olmadan önce çölde çobanlık yapıyordu; Hz. Peygamber'in hicretini duyunca Medine'ye gelip hicret biatı yaptı. Ashâb-ı Suffe arasına katılarak kıraat, fıkıh, ferâiz, şiir ve kitâbette öne çıktı.

  Hz. Peygamber'in kâtiplerindendi. Hz. Osman mushafından farklı tertipte, kendi eliyle yazdığı bir mushaf nüshası vardı. Hz. Ömer'in onun Tevbe sûresini okuyuşunu ağlayarak dinlediği nakledilir.

  Muâviye onu 44/664'te Mısır valiliğine getirdi; üç yıl sonra Rodos seferiyle görevlendirildi, yolda azledildiğini öğrenince Mısır'a yerleşti. Rivayetleri Kütüb-i Sitte'nin hepsinde yer alır. Hadis rivayetinde Mısırlılar nezdindeki yeri, İbn Mes'ûd'un Kûfeliler nezdindeki yerine benzetilmiştir; Ebü'l-Hayr Mersed b. Abdillâh onun başlıca talebesidir.

  58/678'de Mısır'da vefat etti ve Mukattam kabristanına defnedildi.
