biyografi: |
  Ebû Abdillâh Muhammed b. el-Münkedir et-Teymî, yaklaşık 60'ta Medine'de doğdu. Babası Münkedir, Hz. Âişe'nin dayısıdır; kardeşleri Ebû Bekir ve Ömer de Hicaz'ın tanınmış fakihlerindendir.

  Abdullah b. Abbas, Abdullah b. Ömer, Abdullah b. ez-Zübeyr, Esmâ bint Ebî Bekir, Câbir b. Abdullah ve Enes b. Mâlik'ten; tâbiîlerden Urve ve Saîd b. el-Müseyyeb'den rivayet etti. Zührî, Eyyûb es-Sahtiyânî, Ebû Hanîfe, Süfyân es-Sevrî ve Mâlik ondan hadis aldı.

  Güvenilirliği üzerinde ittifak edilen kıraat âlimlerindendir; iki yüzden fazla müsned hadis rivayet etmiş, bunların bir kısmı Kütüb-i Sitte'de yer almıştır. Dünyaya değer vermeyen, cömert ve fakirleri koruyan bir zâhiddi; Mâlik onu insanların en çok ibadet eden ve en zâhidlerinden saymıştır. Her yıl hacca giderdi. 131'de (130 da denir) vefat etti.
