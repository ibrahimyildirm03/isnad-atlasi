ozet: Meymûne'nin âzatlısı Medineli fakih; Süleymân b. Yesâr'ın kardeşi, Zeyd b. Eslem'in hocası.
biyografi: |
  Hayatı hakkında yeterli bilgi bulunmayan Atâ b. Yesâr 19'da doğdu. Babası ve fukahâ-yi seb'adan kardeşi Süleyman b. Yesâr gibi o da Hz. Peygamber'in hanımı Meymûne bint el-Hâris'in mevlâsıydı.

  Hz. Âişe, Meymûne, İbn Mes'ûd, Ebû Hüreyre, Ebû Eyyûb el-Ensârî, Zeyd b. Sâbit, Üsâme b. Zeyd, Ebû Saîd el-Hudrî, İbn Ömer, İbn Abbas, Muâz b. Cebel, Ebû Zer, Ebü'd-Derdâ ve Ubâde b. es-Sâmit'ten rivayet etti. Amr b. Dînâr, Zeyd b. Eslem ve Ebû Seleme b. Abdirrahman ondan hadis aldı.

  Tâbiîn devri Medine fıkıh âlimlerindendir ve çok hadis rivayet etmiştir; rivayetleri Kütüb-i Sitte'de yer alır. İbn Maîn, Ebû Zür'a, Nesâî ve İbn Hibbân güvenilirliği konusunda ittifak etmiştir. 103'te İskenderiye'de seksen dört yaşında vefat etti.

  Ebû Muhammed künyesiyle anılan Atâ'nın İbn Mes'ûd'un yanına girdiği söylenir. Ali b. el-Medînî, Ebû Saîd el-Hudrî'nin talebelerini sayarken söze Atâ ile başlamıştır. İbn Bükeyr'e göre Medine'de üstünlüğü kestirilemeyen üç kardeş vardı: Süleyman, Atâ ve Abdullah b. Yesâr. Vaaz ve kıssa anlatmasıyla da bilinir; Zehebî onu "kâs" diye niteler ve tâbiîlerin büyükleri ile âlimlerinden sayar.
