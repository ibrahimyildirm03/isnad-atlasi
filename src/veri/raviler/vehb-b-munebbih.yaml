biyografi: |
  Vehb b. Münebbih 34'te San'a yakınlarındaki Zimâr'da doğdu. Babası Heratlı olup Hz. Peygamber zamanında müslüman olmuş, annesi Himyerî asıllıdır. Hemmâm b. Münebbih kardeşidir. İbn Abbas, İbn Ömer, Câbir, Enes ve Ebû Saîd el-Hudrî'den; tâbiîlerden Tâvûs ve kardeşi Hemmâm'dan rivayet etti. Oğulları, yeğenleri, Amr b. Dînâr ve Rebîatü'r-re'y ondan hadis aldı.

  Kardeşi Hemmâm hadisçi olarak tanınırken Vehb daha çok geçmiş tarih, peygamberler tarihi ve İsrâilî haberlerle ilgilendi; Yunanca, Süryânîce ve Himyerîce bildiği nakledilir. İsrâiliyatın en önemli kaynaklarından sayılır. İclî, Ebû Zür'a, Nesâî ve İbn Hibbân onu sika kabul etmiş; ancak Kütüb-i Sitte'deki rivayetlerinin hiçbiri kadim tarih veya kıssalarla ilgili değildir ve Ehl-i kitap kaynaklı nakilleri hadisçilerce makbul sayılmamıştır.

  Ömer b. Abdülazîz döneminde San'a kadılığı yaptı. Bir dönem kaderi inkâr eden görüşü benimseyip bir kitap yazdıysa da sonradan bu görüşten döndü. Kısasü'l-enbiyâ türünün ilk örneklerinden Kitâbü'l-Mübtede' ile Megāzî'sinin bir parçası günümüze ulaşmıştır.

  Son yıllarında Yemen valisi Yûsuf b. Ömer tarafından hapsedilip işkenceye uğradı. Muharrem 114'te San'a'da vefat etti.
