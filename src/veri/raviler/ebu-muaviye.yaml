ozet: A'meş'in yirmi yıl yanından ayrılmayan Kûfe muhaddisi; A'meş rivayetlerinin en sağlam râvisi.
biyografi: |
  Ebû Muâviye Muhammed b. Hâzim es-Sa'dî, Temîm'in Sa'd b. Zeyd Menât kolunun mevlâsıdır. Ahmed b. Hanbel ve başkalarına göre 113'te Kûfe'de doğdu. Ebû Dâvûd'un naklettiğine göre dört yaşında gözlerini kaybetti ve ailesi onun için yas tuttu; sekiz yaşında kör olduğu da söylenir. Zehebî onu "imam, hâfız, hüccet, a'lâmdan biri" diye niteler.

  Kaynaklarda "hâfız, sebt, Kûfe'nin muhaddisi" diye anılır. Hişâm b. Urve, A'meş, Leys b. Ebî Süleym, Ebû İshâk eş-Şeybânî ve İsmâîl b. Ebî Hâlid'den rivayet etti.

  Ebû Nuaym'ın naklettiğine göre yirmi yıl A'meş'in yanından ayrılmadı ve onun rivayetlerinin en sağlam râvisi oldu. Şu'be bile A'meş'in hadislerini rivayet ederken onun bulunduğu mecliste ona danışırdı. Ali b. el-Medînî ondan A'meş kanalıyla bin beş yüz hadis yazdığını söyler. Ahmed b. Hanbel ise A'meş dışındaki rivayetlerinde karışıklık bulunduğunu belirtir.

  Hârûnürreşîd ona saygı gösterirdi. Ahmed b. Hanbel, Yahyâ b. Maîn, Ebû Hayseme ve Hennâd onun talebeleri arasındadır.

  Hocası A'meş ve İbn Cüreyc de ondan rivayet etmiştir. A'meş hadisleri kendisine o kadar çok soruldu ki A'meş'in hadisinin ağzında acı bir ilaç gibi olduğunu söylerdi. Yahyâ b. Maîn, A'meş rivayetlerinde Süfyân ve Şu'be'den sonra en sağlam kişinin o olduğunu belirtmiştir. Vekî' ona A'meş'ten 1700 hadis saydığını söyleyince Ebû Muâviye bir hastalıkta dört yüzünü unuttuğunu, 1600'ünü ezberinde tuttuğunu söylemiştir.

  İclî ve Ya'kūb b. Şeybe onu sika saymakla birlikte ircâ görüşünü benimsediğini belirtir; Ebû Dâvûd onu Kûfe Mürcie'sinin reisi diye anar. Ya'kūb b. Şeybe bazen tedlîs yaptığını da kaydeder. Ali b. el-Medînî ve başkalarına göre 195'te vefat etti.
