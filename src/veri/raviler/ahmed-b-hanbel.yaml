biyografi: |
  164/780'de Bağdat'ta doğdu; babasını erken yaşta kaybetti ve annesinin himayesinde büyüdü. 179/795'te Hüşeym b. Beşîr'in yanında hadis öğrenimine başladı; ardından Kûfe, Basra, Hicaz, Şam ve Yemen'e uzun yolculuklar yaptı. Abdürrezzâk'tan hadis yazmak için San'a'ya kadar gitti. Hüşeym, Vekî', Yahyâ el-Kattân, Abdurrahmân b. Mehdî, Süfyân b. Uyeyne ve Şâfiî hocaları arasındadır. Kırk yaşından sonra hadis okutmaya başladı.

  Me'mûn, Mu'tasım ve Vâsık dönemlerinde yürütülen mihnede Kur'an'ın mahlûk olduğunu kabul etmeyi reddetti; kırbaçlandı, uzun süre hapsedildi, Vâsık döneminde ev hapsinde tutuldu. Bu direnişi onu Ehl-i sünnetin sembol ismi hâline getirdi.

  Zâhid ve mütevazı bir hayat sürdü; geçimini dokumacılık ve istinsah gibi işlerle sağladı, hediye ve yardımları çoğunlukla geri çevirdi. Yaklaşık 30.000 hadis ihtiva eden el-Müsned'i Kütüb-i Tis'a arasında sayılır.

  Fıkıhta öncelikle nassı, sahâbe kavlini ve zayıf hadisi esas aldı, kıyası son çare olarak kullandı. Fıkhî görüşlerini kendisi yazmadı; oğulları Abdullah ve Sâlih ile talebeleri derledi, mezhep özellikle Hallâl ile sistemleşti. Buhârî, Müslim ve Ebû Dâvûd talebeleri arasındadır. 241/855'te Bağdat'ta vefat etti.
