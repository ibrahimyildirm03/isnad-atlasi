biyografi: |
  224 ya da 225 yılında Taberistan'ın Âmül şehrinde doğdu. Kur'an'ı ezberleyerek öğrenime başladı; on iki yaşında ilk ilim yolculuğunu Rey'e yaptı. Basra, Kûfe, Vâsıt, Dımaşk, Beyrut ve Fustat'ta hadis, kıraat ve fıkıh okudu. İbn Humeyd er-Râzî, Ebû Küreyb Muhammed b. el-Alâ, Müzenî, Rebî' b. Süleymân el-Murâdî ve Yûnus b. Abdila'lâ hocaları arasındadır.

  256/870'te Bağdat'a döndü ve ömrünün elli yılı aşkın bölümünü orada geçirdi. Kadılık tekliflerini ve vezirlerin hediyelerini reddetti, geçimini babasından kalan arazinin geliriyle sağladı. Önce Şâfiî fıkhına bağlıydı; sonra müctehid olarak kendi görüşlerini geliştirdi ve Cerîriyye mektebini kurdu.

  Ahmed b. Hanbel'i fakih saymaması ve makām-ı mahmûd âyetini Hanbelîlerin beklediği şekilde yorumlamaması onlarla, Zâhirîlerle tartışmaları da o çevreyle arasının açılmasına yol açtı. Şiîlikle suçlanınca ilk üç halifenin faziletlerine dair eserler yazdı. Rivayet tefsirinin temel kaynağı Câmiu'l-beyân ile Târîhu'l-ümem ve'l-mülûk'u, hem tefsir hem tarih alanının başlıca eserleridir. 27 Şevval 310'da vefat etti.
