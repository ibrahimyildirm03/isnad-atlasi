biyografi: |
  167'de Basra'da doğdu. "Değerli şeyleri saklayan, çok hadis ezberleyen kimse" anlamındaki "Bündâr" lakabıyla tanındı. Kur'an'ı ezberledi ve Basralı muhaddislerin rivayet ettiği hadislerin tamamını öğrendi; annesi razı olmadığı için uzun süre ilim yolculuğuna çıkamadı.

  Mu'temir b. Süleyman, Abdurrahman b. Mehdî, Vekî', Ebû Dâvûd et-Tayâlisî ve Yezîd b. Hârûn'dan hadis okudu; Yahyâ el-Kattân'ın meclislerine yirmi yıl devam etti. On sekiz yaşında rivayete başladı; hocalarına saygısızlık olmasın diye şehir dışındaki hurmalığında ders verip talebelerine hurma ikram etti.

  Kütüb-i Sitte müelliflerinin hepsi, İbn Huzeyme, Ebû Hâtim, Ebû Zür'a ve Bakī b. Mahled ondan rivayet etti; altmış yedi yıl rivayette bulunduğu için beş ayrı tabakadan muhaddis ondan yararlandı. Buhârî ondan 205, Müslim 460 hadis almıştır. İbn Huzeyme onu zamanının muhaddislerinin imamı diye övmüştür. 252'de seksen beş yaşında vefat etti.
