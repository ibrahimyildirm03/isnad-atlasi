ozet: '"Horasan''ın şeyhi" Belhli hâfız; Buhârî''nin sülâsiyyâtının çoğunu ondan rivayet ettiği hoca.'
biyografi: |
  Ebü's-Seken Mekkî b. İbrâhîm b. Beşîr b. Ferkad et-Temîmî el-Hanzalî, Temîm'in Berâcim koluna mensuptur. Kendi ifadesine göre 126'da Belh'te doğdu; babası on bir yaşındayken onu yanına aldı. Zehebî onu "imam, hâfız, sâdık, Horasan'ın müsnidi" diye anar.

  Belh'te doğdu; kendi ifadesine göre on yedi yaşında hadis tahsiline başladı. Yezîd b. Ebî Ubeyd, Ca'fer es-Sâdık, Behz b. Hakîm, Ebû Hanîfe, Hişâm b. Hassân ve İbn Cüreyc'ten rivayet etti. Altmış defa hac yaptığını, on yıl Mekke'de mücâvir kaldığını ve on yedi tâbiîden hadis yazdığını söylediği nakledilir.

  Kaynaklarda "imam, hâfız, Horasan'ın şeyhi" diye anılır. İbn Sa'd onu sika ve sebt, Dârekutnî sika ve me'mûn saydı; Nesâî "lâ be'se bih" dedi.

  Buhârî, Ahmed b. Hanbel, Yahyâ b. Maîn ve Zühlî ondan hadis aldı. Tâbiîlere yetişmiş olması sebebiyle Buhârî'nin Sahîh'indeki üç râvili (sülâsî) isnadların çoğu onun üzerinden gelir. Belh'te vefat etti.

  İbn Sa'd'ın kaydına göre hac niyetiyle Bağdat'a geldi, gidişte ve dönüşte hadis rivayet etti; halk ondan yazdı. Belh'ten çölü elli defa hac için geçtiğini ve Mekke'deki ev kiraları için bin iki yüz dinardan fazla ödediğini söylediği nakledilir. Kendisine ihtiyaç duyulacağını bilse tâbiîlerden başkasından yazmayacağını söylemiştir. Mizzî'nin kaydına göre Ebû Hanîfe ve Mâlik'ten de rivayet etmiştir. Yüz yaşına yaklaşmış olarak 15 Şâban 215'te Belh'te vefat etti.
