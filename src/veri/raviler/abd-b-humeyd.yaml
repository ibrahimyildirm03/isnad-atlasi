  aciklama: Asıl adı Abdülhamîd'dir; kısaltılmış "Abd" şekliyle meşhur oldu. Mizzî'ye göre Buhârî'de geçen "Abdülhamîd (Abdülhumeyd)" odur. Nisbesi Mâverâünnehir'deki Kis (Keş) şehrinedir.
