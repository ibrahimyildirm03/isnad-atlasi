ozet: Mâverâünnehirli muhaddis, el-Müsned ve et-Tefsîr müellifi; Müslim ve Tirmizî'nin hocası.
biyografi: |
  Ebû Muhammed Abd b. Humeyd b. Nasr el-Keşşî, 170'ten sonra Mâverâünnehir'deki Keş (Kis) şehrinde doğdu ve ömrünü burada geçirdi. Gençliğinde dönemin büyük ilim merkezlerini dolaşarak Yezîd b. Hârûn, Yahyâ b. Âdem, Abdürrezzâk, Ebû Dâvûd et-Tayâlisî ve Ebû Bekir b. Ebî Şeybe'den hadis öğrendi.

  Müslim, Tirmizî ve oğlu Muhammed başta olmak üzere Mâverâünnehir'deki birçok âlim ondan rivayet etti. Mizzî, Buhârî'nin bir senedinde geçen "Abdülhamîd"in aslında Abd b. Humeyd olduğunu ileri sürmüştür. Güvenilir bir muhaddis kabul edilir.

  Büyük eseri el-Müsnedü'l-kebîr'in kendi yaptığı muhtasarı el-Müntehab min Müsnedi Abd b. Humeyd adıyla günümüze ulaşmıştır. et-Tefsîr'i kayıp olup İbn Hacer'in el-İsâbe'deki nakillerinden bilinmektedir. 249'da Keş'te vefat etti.

  Zehebî asıl adının Abdülhamîd olduğunu, kısaltılarak "Abd" denildiğini belirtir; hocaları arasında Muhammed b. Bişr, İbn Ebî Füdeyk, Ca'fer b. Avn ve Ebû Âsım'ı da sayar. İbn Hibbân onu "derleyip tasnif edenlerden" diye anar. Dımaşk'ta öldüğü iddiasını Zehebî, onun ne yolculuklarında ne yaşlılığında Dımaşk'ı görmediğini belirterek açık bir hata sayar.
