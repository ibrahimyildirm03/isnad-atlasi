ozet: Hz. Peygamber'in sırdaşı; Medâin valisi, Nihâvend komutanı.
biyografi: |
  Münafıkların kimliği gibi bazı bilgileri yalnız ona emanet eden Hz. Peygamber'in sırdaşı olarak bilinir. Hz. Ömer döneminde Medâin valisi oldu ve Nihâvend'in fethinde orduya komuta etti.

  Kıraat ayrılıklarına dikkat çekerek Hz. Osman'ı uyardı ve Mushafın çoğaltılmasına vesile oldu. Ondan Ebû Vâil, Zir b. Hubeyş, Zeyd b. Vehb, Abdurrahman b. Ebî Leylâ ve Ebû İdrîs el-Havlânî rivayet etti. Irak (Medâin–Kûfe) ilim çevresine bağlıdır.
