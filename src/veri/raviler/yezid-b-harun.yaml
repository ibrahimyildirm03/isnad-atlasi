ozet: Bağdat'taki meclisinde yetmiş bin kişinin bulunduğu söylenen Vâsıtlı hâfız; Ahmed b. Hanbel ve İbnü'l-Medînî'nin hocası.
biyografi: |
  Vâsıt'ta doğdu; ailesi aslen Buharalıdır. Şu'be, Mâlik, Hammâd b. Zeyd, Süfyân es-Sevrî, Humeyd et-Tavîl ve Yahyâ b. Saîd el-Ensârî'den hadis aldı. Kitaptan değil ezberden rivayet ederdi; yirmi dört bin hadisi isnadıyla ezbere bildiğini söylediği nakledilir. Bağdat'ta hadis okuttuğunda meclisinde yetmiş bin kişinin toplandığı rivayet edilir.

  Ali b. el-Medînî ve Ebû Bekr b. Ebî Şeybe onu gördükleri en titiz hâfız saydı; Ahmed b. Hanbel zekâsını ve anlayışını övdü. Gece boyunca namaz kılmasıyla, emr-i bi'l-ma'rûf ve nehy-i ani'l-münkerdeki cesaretiyle tanındı. Halku'l-Kur'ân görüşüne ve Cehmiyye'ye karşı çıktı; Me'mûn'un onun sağlığında bu görüşü açıkça dayatmaktan çekindiği rivayet edilir.

  Ömrünün sonunda gözlerini kaybetti ve hafızası zayıfladı; bu dönemde kitaplarını bir câriyeye okutur oldu, Yahyâ b. Maîn bu dönemdeki rivayetlerini eleştirdi. Rivayetleri Kütüb-i Tis'a'nın hepsinde yer alır. Ahmed b. Hanbel, Ali b. el-Medînî, Züheyr b. Harb, Ebû Bekr b. Ebî Şeybe, Abd b. Humeyd ve İshâk b. Râhûye onun talebesidir.
