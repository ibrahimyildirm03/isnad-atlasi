biyografi: |
  Ebû Bekr Eyyûb b. Ebî Temîme Keysân, 68'de Basra'da doğdu. Babası Aneze kabilesinin mevâlîsindendir; sahtiyan (deri) ticaretiyle uğraştığı için "es-Sahtiyânî" diye anıldı. Küçük yaşta ilme yöneldi; dört yıl dersine katıldığı Hasan-ı Basrî onu "Basra gençlerinin efendisi" diye övdü.

  Atâ b. Ebî Rebâh, Hişâm b. Urve, İbn Sîrîn, İkrime, Katâde, Mücâhid, Nâfi', Saîd b. Cübeyr ve Sâlim b. Abdullah'tan rivayet etti. Hammâd b. Seleme, Hammâd b. Zeyd, Mâlik, Ma'mer, iki Süfyân ve Şu'be ondan hadis aldı. Mâlik, Iraklı âlimlerden yalnızca ondan nakilde bulunmuştur. Süfyân b. Uyeyne, görüştüğü seksen altı tâbiî arasında onun gibisine rastlamadığını söylemiştir; Kütüb-i Sitte müelliflerinin hepsi ondan rivayet eder.

  Hadiste delilini bilmediği konularda hata korkusuyla ictihad etmezdi. Âbid ve zâhid bir âlimdi; zühdün gizli yaşanmasını makbul görür, riyadan korktuğu için giyiminde aşırı sadelikten kaçınırdı. Kırk kez hac yaptığı rivayet edilir. Siyasetten uzak durdu; arkadaşı III. Yezîd halife olunca onunla ilişkisini kesti.

  İbn Mehdî ona "Basra ehlinin hücceti" demiştir. Ramazan 131'de bir cuma günü Basra'da vebadan vefat etti.
