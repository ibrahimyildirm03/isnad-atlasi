biyografi: |
  İlk müslümanlardandır ve cennetle müjdelenen on sahâbîden biridir. Allah yolunda ilk ok atan kişi olarak bilinir; bu yüzden "fârisü'l-İslâm" diye anıldı.

  Kādisiye'de (15/636) Sâsânîler'i yendi ve Hz. Ömer'in emriyle Kûfe'yi kurup valiliğini yaptı. Hz. Osman'ın şehadeti, Cemel ve Sıffîn'de tarafsız kaldı. Son yıllarında gözlerini kaybetti; Akīk'teki çiftliğinde vefat etti. Ondan çocukları Âmir, Mus'ab ve Muhammed ile Âişe, İbn Ömer, İbn Abbâs, Saîd b. el-Müseyyeb, Kays b. Ebî Hâzim ve Mücâhid rivayet etti.
