ozet: el-Musannef'in müellifi Kûfeli hâfız; Buhârî, Müslim, Ebû Dâvûd ve İbn Mâce'nin hocası.
biyografi: |
  159'da Kûfe'de doğdu; Benî Abs'ın mevlâsıdır. Babası, dedesi ve kardeşleri Osman ile Kāsım da muhaddisti; ailenin en meşhur ismi odur.

  Erken yaşta hadise başladı; on dört yaşında Kadı Şerîk b. Abdullah'tan ders aldı. Kûfe, Basra, Rey, Bağdat ve Hicaz'da Süfyân b. Uyeyne, Vekî', İbnü'l-Mübârek, Yahyâ el-Kattân ve Hüşeym'den hadis okudu. Ebû Zür'a ve Sâlih Cezere hafızasının çok güçlü olduğunu belirtmiştir.

  Halife Mütevekkil, Mu'tezile ve Cehmiyye görüşlerini reddeden hadislerin halka anlatılmasını isteyince Bağdat'taki Rusâfe Mescidi'nde otuz bini aşan bir kalabalığa ders verdi. Kûfe'de de uzun süre bir sütunun dibinde hadis okuttu.

  Hadisleri sahâbe sözleri ve tâbiîn fetvalarıyla birlikte senedleriyle ve konularına göre tertip eden el-Musannef'i, erken dönem fıkhının en hacimli kaynaklarındandır; sonunda Ebû Hanîfe'nin bazı görüşlerine reddiye bölümü yer alır. Kitâbü'l-Îmân, Kitâbü'l-Edeb, Kitâbü't-Târîh ve bir tefsir de yazmıştır. Buhârî, Müslim, Ebû Dâvûd ve İbn Mâce onun talebeleridir; Müslim ondan en çok rivayet ettiği hocalarındandır. 235'te vefat etti.
