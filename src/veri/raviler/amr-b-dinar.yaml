ozet: Atâ'dan sonra Mekke'nin fetva mercii; iki Süfyân'ın ve İmam Mâlik'in hocası.
biyografi: |
  Ebû Muhammed Amr b. Dînâr el-Mekkî, aslen İranlı olup 45 veya 46'da doğdu. Cumah kabilesinin himayesine girdiği için mevâlîdendir; biri dışında bütün dişleri döküldüğü için "el-Esrem" lakabıyla anıldı.

  Abâdile başta olmak üzere Câbir b. Abdullah, Ebû Hüreyre ve Berâ b. Âzib'den hadis dinledi. Saîd b. el-Müseyyeb, Saîd b. Cübeyr, Tâvûs, Mücâhid, İkrime ve Atâ b. Ebî Rebâh'tan da rivayet etti. Ca'fer es-Sâdık, Mâlik, Şu'be, Katâde, İbn Cüreyc, Eyyûb, iki Süfyân ve iki Hammâd ondan hadis aldı.

  Atâ b. Ebî Rebâh'tan sonra Mekke'nin fetva mercii oldu. Hadis otoriteleri güvenilirliği üzerinde birleşmiştir; Ali b. el-Medînî onu hadiste eser veren ilk altı kişiden biri sayar. Süfyân b. Uyeyne, ondan duyduğu bir hadisi başkasından duyacağı yirmi hadise tercih ettiğini söylemiştir.

  Hadisin eksiltilmemek şartıyla mânen nakledilebileceğini kabul etti; görüşlerinin ise sonradan değiştirebileceği endişesiyle yazılmasını istemezdi. 126'da (125 de denir) seksen yaşlarında vefat etti.
