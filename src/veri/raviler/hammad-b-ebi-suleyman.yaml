ozet: İbrâhim en-Nehaî'nin halefi; Ebû Hanîfe'nin 18 yıl derslerine devam ettiği fıkıh hocası.
biyografi: |
  Ebû İsmâîl Hammâd b. Ebî Süleymân el-Kûfî'nin babası İsfahanlıydı; Ebû Mûsâ el-Eş'arî'nin İsfahan'ı fethinde esir düşüp müslüman oldu ve onunla velâ bağı kurdu. Babası onu Kûfe Mescidi'nde İbrâhim en-Nehaî'nin yanına verdi ve Hammâd onun en önde gelen talebesi oldu. Enes b. Mâlik, Saîd b. el-Müseyyeb, Hasan-ı Basrî, Saîd b. Cübeyr, Ebû Vâil ve İkrime'den de hadis aldı.

  Nehaî'nin 96'daki vefatından sonra Kûfe Mescidi'ndeki halkaya ve fetva makamına geçti, yirmi dört yıl fıkıh okuttu. Ebû Hanîfe on sekiz yıl onun derslerine devam etti; A'meş, Süfyân es-Sevrî, Şu'be ve Hammâd b. Seleme de talebeleri arasındadır. Böylece İbn Mes'ûd'dan gelen Kûfe birikimini Ebû Hanîfe'nin nesline aktaran köprü oldu.

  Nehaî'nin re'y ve ictihad anlayışını izledi, illet ve şâriin maksadını araştırmaya önem verdi; yirmi altı meselede hocasından ayrıldığı tespit edilmiştir. 112 civarında Ebû Hanîfe'yi yerine bırakarak Basra'ya gitti; isnad usulünü Basra'ya ilk getiren kişi olduğu kaydedilir.

  İbn Maîn, İclî ve Nesâî onu sika saymış; bazıları son döneminde hafızasının zayıfladığını ve Mürcie'den olduğunu ileri sürmüştür. Zengin ve cömertti, Ramazan'da kalabalık misafirlere iftar verirdi. 120'de vefat etti.
