  nisbeler: [el-Esedî, el-Kûfî]
  aciklama: Kaynaklarda çoğunlukla künyesiyle "Ebû Vâil" diye anılır. Câhiliye devrini idrak ettiği hâlde Hz. Peygamber'i müslüman olarak göremediği için muhadramdır.
dogum: {miladi: 600, not: "tahminî; 100 yaşında öldüğü rivayetine göre"}
