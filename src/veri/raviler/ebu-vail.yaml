ozet: İbn Mes'ûd'un önde gelen muhadram talebesi; A'meş, Mansûr ve Hammâd b. Ebî Süleymân'ın hocası.
biyografi: |
  Hz. Ebû Bekir döneminde İslâm'a bağlandı, Hz. Ali'nin yanında Sıffîn ve Nehrevan'da bulundu. Zâhidâne bir hayat sürdü; "sika" ve "kesîrü'l-hadîs" olarak nitelendi, rivayetleri Kütüb-i Sitte'de yer alır.

  Ömer, Osman, Ali, İbn Mes'ûd, Ebû Mûsâ, Âişe ve Ebû Hüreyre'den rivayet etti. Mesrûk, A'meş, Hammâd b. Ebî Süleymân ve Âsım b. Behdele ondan rivayet etti.
