ozet: İbn Abbâs'ın Kûfe'ye yerleşen büyük talebesi; Haccâc'ın öldürdüğü müfessir ve fakih.
biyografi: |
  Mekke'de İbn Abbâs'ın halkasında hadis, tefsir ve fıkıh okudu; İbn Ömer, Ebû Saîd el-Hudrî ve Enes'ten de rivayet etti. Kûfe'ye yerleşerek ders halkası kurdu ve fetva verdi.

  İbnü'l-Eş'as'ın Haccâc'a karşı isyanına katıldı, Deyrülcemâcim'den sonra on iki yıl kadar gizlendi; yakalanıp Vâsıt'ta Haccâc tarafından öldürüldü. A'meş, Ebû İshâk es-Sebîî, Amr b. Dînâr ve Eyyûb es-Sahtiyânî ondan rivayet etti.
