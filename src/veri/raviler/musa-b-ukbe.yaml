biyografi: |
  Ebû Muhammed Mûsâ b. Ukbe el-Esedî, 55 veya 60 civarında doğduğu tahmin edilir; ailesi Zübeyr b. el-Avvâm'ın mevlâsıdır. Abdullah b. Ömer, Enes b. Mâlik ve Sehl b. Sa'd ile görüştü; Ümmü Hâlid, A'rec, Ebû Seleme, Ebü'z-Zinâd, Zührî, Nâfi' ve Urve'den rivayet etti.

  Medine'de yaşadı ve iki ağabeyiyle birlikte Mescid-i Nebevî'de fıkıh ve hadis okuttu; saraya yakınlık göstermedi. İbnü'l-Mübârek, İbn Cüreyc, Mâlik, iki Süfyân ve Şu'be ondan rivayet etti. Mâlik, Ahmed b. Hanbel, Yahyâ b. Maîn ve Nesâî onu sika saymıştır.

  Zehebî onu megāzî alanında eser yazan ilk kişi olarak gösterir. Günümüze ulaşmayan el-Megāzî'si büyük ölçüde Zührî'nin rivayetlerine dayanır; ilk müslümanlar, Habeşistan muhacirleri, Akabe biatına katılanlar ve Bedir ehli gibi listeleriyle önem taşır. Mâlik, megāzî öğrenmek isteyenlere onun kitabını önermiştir; İbn Sa'd ve İbn Abdilber de ondan yararlanmıştır. 141'de Medine'de vefat etti.
