ozet: Ricâl tenkidinin kurucularından Basralı hâfız; Ahmed b. Hanbel, İbn Maîn ve İbnü'l-Medînî'nin hocası.
biyografi: |
  120 yılı başlarında Basra'da doğdu. Ataları Benî Temîm'in âzatlısı olduğu için et-Temîmî nisbesini aldı; pamuk ticaretiyle uğraştığı için "el-Kattân", gözündeki şaşılık sebebiyle "el-Ahvel" diye de anıldı.

  Başlıca hocaları Şu'be ve Süfyân es-Sevrî'dir; Şu'be'nin derslerine yirmi yıl devam ettiğini kendisi söylemiştir. Evzâî, Hammâd b. Seleme, Mâlik ve Hüşeym'den de rivayet etti.

  Yalnız güvenilir râvilerden rivayet etmesi ve koyduğu sıkı ölçüler sebebiyle cerh-ta'dîlde müteşeddid münekkitler arasında sayılır. Zayıf râvilere dair günümüze ulaşmayan bir ed-Duafâ yazdığı nakledilir. İlel ve ricâl alanındaki yöntemleri sistemleştirmesiyle, Şu'be'nin Basra'da başlattığı tenkit geleneğini bir sonraki nesle aktaran halka oldu.

  Yakın arkadaşı Abdurrahmân b. Mehdî ile birlikte Basra'nın iki büyük münekkidi olarak anılır; ikisinin ittifakla terk ettiği râviden rivayet edilmezdi. Ali b. el-Medînî, Yahyâ b. Maîn ve Ahmed b. Hanbel onun talebeleridir; böylece ricâl ilmi onun üzerinden 3. asrın büyük münekkitlerine geçti. 198'de Basra'da vefat etti.
