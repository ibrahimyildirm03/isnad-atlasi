  nisbeler: [et-Temîmî, el-Basrî]
  lakap: el-Kattân
  aciklama: Pamuk (kutn) ticaretiyle uğraştığı için "el-Kattân" diye anıldı. Medineli Yahyâ b. Saîd el-Ensârî ile karıştırılmaması için bu lakapla birlikte zikredilir.
