biyografi: |
  150/767'de Gazze'de doğdu; babası küçük yaşta vefat edince annesi onu Mekke'ye götürdü. Kur'an'ı erken yaşta ezberledi; Arap dili, şiir ve nesep ilmiyle uğraştı. Mekke'de Süfyân b. Uyeyne'den hadis aldı.

  Medine'ye giderek İmam Mâlik'in yanında el-Muvatta'ı ezberledi ve hocasının en seçkin talebelerinden oldu. Mâlik'in vefatından sonra Yemen'de bir göreve getirildi; Hârûnürreşîd döneminde Irak'a götürüldü ve Bağdat'ta Muhammed b. el-Hasen eş-Şeybânî ile münazaralar yaparak Irak fıkhını yakından tanıdı.

  Mekke ile Bağdat arasında gidip geldikten sonra 199-200 yıllarında Mısır'a yerleşti. Fıkhî görüşleri bu yüzden Irak'taki "kavl-i kadîm" ve Mısır'daki "kavl-i cedîd" olarak ikiye ayrılır. Sünneti merkeze alan; icmâ, kıyas, sahâbî kavli ve istihsanı ölçüye bağlayan er-Risâle'si fıkıh usulünün ilk sistematik eseri kabul edilir.

  Rebî' b. Süleymân el-Murâdî, Müzenî, Büveytî ve Ahmed b. Hanbel talebeleri arasındadır. 29 Receb 204'te Mısır'da vefat etti ve Karâfe'deki Benî Abdülhakem kabristanına defnedildi.
