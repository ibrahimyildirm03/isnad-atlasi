eserleri: ["Kitâbü'l-Megāzî (es-Sîre); İbn Hişâm'ın es-Sîretü'n-nebeviyye'si yoluyla ulaştı"]
ozet: Siyer ve meğāzînin imamı; es-Sîre'nin müellifi, Halife Mansûr'un oğlu Mehdî'nin hocası.
biyografi: |
  Medine'de doğdu; Zührî, Nâfi' ve Âsım b. Ömer b. Katâde başta olmak üzere birçok hocadan hadis ve siyer-meğāzî okudu. İskenderiye'ye yolculuk etti; yüz kadar Medineli râviden rivayet ettiği söylenir.

  Medine'den ayrılarak el-Cezîre, Kûfe ve Hîre'de bulundu. Halife Mansûr onu oğlu Mehdî'ye hoca tayin etti ve ondan bir genel tarih yazmasını istedi. 146/763 civarında Bağdat'a yerleşti ve vefatına kadar orada ders verdi.

  Kitâbü'l-Megāzî'si sağlığında şöhret buldu; Hz. Peygamber'in hayatını insanlık tarihi içinde ele alan bu eser bugün parçalar hâlinde ve özellikle İbn Hişâm'ın muhtasarı yoluyla bilinir. Zührî meğāzîdeki hâkimiyetini övmüş, Şâfiî bu alanda derinleşmek isteyenin ona muhtaç olduğunu söylemiştir. Hadis tenkidi açısından başlıca zaafı tedlîstir; Hişâm b. Urve ve Mâlik, Yahudi asıllı müslümanlardan bilgi almasını ve şiire yer vermesini eleştirmiştir. Buna rağmen Müslim ve sünen müellifleri ondan rivayet etmiştir.
