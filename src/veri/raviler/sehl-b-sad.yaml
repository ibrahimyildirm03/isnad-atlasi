biyografi: |
  Hazrec'in Sâideoğulları kolundandır; babası Sa'd da Hz. Peygamber hayattayken vefat eden sahâbîlerdendir. Asıl adı Hazn iken Hz. Peygamber onu "Sehl" diye adlandırdı. Liân (karı-koca arasında lanetleşme) olayında on beş yaşında Hz. Peygamber'in huzurunda bulunduğunu kendisi anlatır.

  Zehebî onu "imam, fâzıl, uzun ömürlü, Resûlullah'ın ashâbının son kalanı" diye niteler. Medine'de vefat eden son sahâbîdir ve yüz yaşına ulaşanlardandır. On beş kadınla evlendiği rivayet edilir.

  Birçok hadis rivayet etti; rivayetleri Kütüb-i Sitte'nin hepsinde yer alır. Oğlu Abbâs, Ebû Hâzim Seleme b. Dînâr el-A'rec, Abdullah b. Abdirrahmân b. el-Hâris, İbn Şihâb ez-Zührî ve Yahyâ b. Meymûn ondan rivayet etti. Çoğunluk vefatını 91 yılına, Ebû Nuaym ve Buhârî 88 yılına koyar.
