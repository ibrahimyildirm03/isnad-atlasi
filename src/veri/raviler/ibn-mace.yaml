ozet: Kütüb-i Sitte'nin altıncı kitabı kabul edilen es-Sünen'in müellifi Kazvinli hâfız.
biyografi: |
  209'da Kazvin'de doğdu. Gençliğinde Kazvin'de Ali b. Muhammed et-Tanâfisî ve Amr b. Râfi' el-Becelî'den hadis öğrendi. Ardından Kûfe, Basra, Vâsıt, Bağdat, Dımaşk, Hıms, Mısır, Mekke, Medine, Rey ve Nîşâbur'u dolaştı.

  Ebû Bekr b. Ebî Şeybe, Muhammed b. Beşşâr (Bündâr), Züheyr b. Harb, Hişâm b. Ammâr ve Muhammed b. Rumh hocaları arasındadır; es-Sünen'deki rivayetlerinin önemli bir kısmı İbn Ebî Şeybe yoluyla gelir.

  Yaklaşık 4341 hadis ihtiva eden es-Sünen'inde bin kadar zayıf rivayet bulunduğu kabul edilir. Buna rağmen tertibinin güzelliği ve diğer kitaplarda bulunmayan rivayetleri (zevâid) sebebiyle sonraki asırlarda Kütüb-i Sitte'nin altıncı kitabı sayılmıştır. Eser önce Delhi'de taş baskı olarak, sonra Muhammed Fuâd Abdülbâkī ve Muhammed Mustafa el-A'zamî tarafından neşredilmiştir.

  Târîhu'l-hulefâ ilk İslâm tarihi çalışmalarındandır; es-Sülâsiyyât, iki cüzü görülmüş bir tefsir ve Kazvin râvilerine dair et-Târîh diğer eserleridir. Kardeşi Hasan b. Yezîd de muhaddistir. 21 Ramazan 273'te vefat etti.
