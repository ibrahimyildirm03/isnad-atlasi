ozet: Çok sayıda sahâbîye yetişen Kûfeli muhaddis; Kûfe'de rivayete dayanan yaklaşımın temsilcisi.
biyografi: |
  Ebû Amr Âmir b. Şerâhîl eş-Şa'bî, 19'da Kûfe'de doğdu (başka yıllar da verilir). Soyu Yemen'deki Himyerîlerin Benî Şa'bân koluna dayanır; annesi Celûlâ Savaşı'nda esir alınanlardandı. Kendi ifadesine göre beş yüz sahâbî gördü ve yetmişten fazlasından hadis öğrendi. Abdullah b. Mes'ûd ekolünün önde gelen talebesiydi; İbn Ömer'den bir yıl ders okudu, Hz. Ali'den de rivayet etti. Tâbiîlerden Alkame, Esved, Kādî Şüreyh ve Mesrûk'tan hadis aldı.

  Abdülmelik b. Mervân, A'meş, İbn Sîrîn, Katâde, Hammâd b. Ebî Süleymân ve Câbir el-Cu'fî talebeleri arasındadır. İbnü'l-Eş'as isyanına katıldı; isyan 82'de Deyrülcemâcim'de bastırılınca dokuz ay gizlendi, sonra Haccâc tarafından affedildi. Halife Abdülmelik çocuklarının eğitimini ona verdi ve onu Bizans'a elçi olarak gönderdi.

  Ömer b. Abdülazîz'in isteğiyle Kûfe kadılığını kabul etti, bir yıl sonra ayrıldı. Duyduğunu hemen ezberler, kendisi yazmayı gereksiz görse de talebelerine yazmalarını tavsiye ederdi. Megāzî, şiir, tarih ve eyyâmü'l-Arab'da önde gelen râvilerdendi; mürsellerinin sıhhati konusunda ittifak vardır.

  Fetva vermekten çekinir, bilmediğinde "bilmiyorum" derdi; kıyas ve re'yi benimsemezdi. Neşeli ve nüktedan bir kişiliği vardı. Yaygın kanaate göre 104'te Kûfe'de vefat etti.
