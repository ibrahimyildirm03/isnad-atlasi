biyografi: |
  Ebû Saîd Yahyâ b. Saîd b. Kays el-Ensârî, Neccâroğulları'ndan olup 70'ten önce Medine'de doğdu; dedesi Kays b. Amr sahâbîdir. Fukahâ-yi seb'anın talebesi olarak bilinir. Enes b. Mâlik, Sâib b. Yezîd, Saîd b. el-Müseyyeb, Zeynelâbidîn, Amre bint Abdurrahman, Ebû Seleme, Zührî ve A'rec'den hadis öğrendi.

  Hişâm b. Urve, Eyyûb es-Sahtiyânî, Mâlik, İbn İshak, Şu'be, Süfyân es-Sevrî, Evzâî, İbnü'l-Mübârek, Ebû Yûsuf, Süfyân b. Uyeyne ve Yahyâ el-Kattân ondan rivayet etti. "Ameller niyetlere göredir" hadisi, ondan yaklaşık iki yüz râvinin rivayetiyle meşhur derecesine ulaşmıştır.

  Velîd b. Abdülmelik döneminde Medine kadısı oldu; Ömer b. Abdülazîz onu zekât âmili olarak İfrîkıye'ye gönderdi. Abbâsîler zamanında Mansûr tarafından Hâşimiye'de kadılığa getirildi. Bir mirastan elde ettiği 500 dinarı Rebîatü'r-re'y ile paylaştığı nakledilir.

  Döneminde Hicaz'ın en önde gelen muhaddisi sayıldı. Eyyûb, Medine'de ondan daha fakih birinin olmadığını söylemiş; Mâlik, Irak'a gidenlerin değiştiğini ama Yahyâ'nın değişmediğini belirtmiştir. 143'te Hâşimiye'de vefat etti.
