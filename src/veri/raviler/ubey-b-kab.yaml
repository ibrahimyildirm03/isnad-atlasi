ozet: "Kur'an kıraatinde otorite kabul edilen sahâbî."
biyografi: |
  Yesrib'de doğdu. Birinci Akabe biatından sonra Mus'ab b. Umeyr vasıtasıyla müslüman oldu ve ertesi yıl İkinci Akabe biatına katıldı. Hz. Peygamber'e vahiy kâtipliği yapan ilk Medinelidir ve mektupların sonuna kâtibin adını yazma geleneğini başlattı.

  Kur'an'ı en iyi bilen sahâbîlerdendi; Hz. Peygamber'in Allah'ın emriyle ona Beyyine sûresini okuduğu rivayet edilir. Kıraat imamlığında öne çıktı ve on kıraatin çoğunun isnadında yer alır. Hz. Ömer 14/635'te onu teravih namazının imamı tayin etti. Hz. Osman döneminde mushafın çoğaltılması heyetinde bulundu; kıraati özellikle Şam bölgesinde yayıldı.

  Hz. Peygamber'den 164 hadis rivayet etti. İbn Abbâs, Ebû Hüreyre ve Ebü'l-Âliye er-Riyâhî ondan ilim alanlar arasındadır. Vefat tarihi kaynaklarda 19 ile 36 arasında değişir; en meşhur görüşe göre Medine'de vefat etti.
