biyografi: |
  Ebû Bekr Abdullah b. ez-Zübeyr el-Humeydî, Kureyş'in Kusay soyundandır ve Mekkelidir. Hadisi Fudayl b. İyâz, Derâverdî, Velîd b. Müslim, Vekî' ve özellikle Süfyân b. Uyeyne'den öğrendi. İbn Uyeyne'nin yanında on dokuz yıl kesintisiz kaldığı için onun hadislerini en iyi bilenlerden biri oldu.

  Fıkhı İmam Şâfiî'den tahsil etti; Mekke'de ve Mısır'da uzun süre onunla birlikte bulundu. Şâfiî'nin vefatından sonra Mekke'ye döndü ve on beş yıl fetva verip hadis okuttu. Buhârî, Zühlî, Ebû Zür'a er-Râzî, Fesevî ve Ebû Hâtim er-Râzî ondan rivayet etti.

  Sahâbîlerin fazilet ve müslüman oluş sırasına göre düzenlenip Hz. Ebû Bekir'in müsnediyle başlayan ve 1327 hadis içeren el-Müsned'i, Mekke'de yazılan ilk müsnedlerdendir. İshak b. Râhûye, Ahmed b. Hanbel ve Buhârî onu "imam" diye nitelemiş; rivayetleri İbn Mâce dışında Kütüb-i Sitte'de yer almıştır. Rebîülevvel 219'da Mekke'de vefat etti.
