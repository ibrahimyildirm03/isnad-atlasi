isim: Ebû Mûsâ el-Eş'arî
tam_isim: Ebû Mûsâ Abdullah b. Kays b. Süleym el-Eş'arî
arapca: أبو موسى الأشعري
tabaka: sahabe
isim_bilgisi:
  kunye: Ebû Mûsâ
  ism: Abdullah
  nesep: Abdullah b. Kays b. Süleym b. Hadâr el-Eş'arî
  nesep_arapca: عبد الله بن قيس بن سليم بن حضار الأشعري
  nisbeler: [el-Eş'arî, el-Yemânî]
  aciklama: Yemen'in Zebîd bölgesindeki Eş'ar kabilesindendir. Annesi Zabye bint Vehb de hicret eden sahâbîlerdendir. Kelâmcı Ebü'l-Hasan el-Eş'arî onun soyundandır.
vefat: {hicri: 42, miladi: 662, not: "43, 44, 53 ve 54 de denmiştir; Kûfe'de mi Mekke'de mi öldüğü ihtilaflıdır"}
vefat_yeri: Kûfe veya Mekke
bolge: kufe
diger_bolgeler: [basra]
