  tehzibul_kemal: "XV, 446-453"
  tehzibut_tehzib: "V, 362-363"
  rumuz: "ع"
ozet: Basra ve Kûfe valisi, güzel sesli kārî ve fakih; Sıffîn'den sonra Hz. Ali'nin hakemi.
biyografi: |
  Kavminden bir heyetle Medine'ye gelmek üzere yola çıktı, gemileri Habeşistan'a sürüklendi; Hayber'in fethi sırasında (7/628) Medine'ye ulaştı. Hz. Peygamber zamanında Yemen'e zekât memuru olarak gönderildi.

  Hz. Ömer onu 17/638'de Basra'ya, daha sonra Kûfe'ye vali ve kadı tayin etti; Ömer'in ona yazdığı yargılama mektubu İslâm hukuk tarihinin temel metinlerindendir. Kur'an'ı güzel okumasıyla tanındı, Basra'da Kur'an ve fıkıh halkaları kurdu. Cemel'de tarafsız kaldı; Sıffîn'den sonra tahkimde Hz. Ali'nin hakemi oldu.
