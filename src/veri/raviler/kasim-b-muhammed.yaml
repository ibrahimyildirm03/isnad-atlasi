biyografi: |
  Ebû Muhammed el-Kāsım b. Muhammed, Hz. Ebû Bekir'in torunudur ve Hz. Osman'ın halifeliği döneminde doğdu. Babasının öldürülmesinden sonra bir süre halası Hz. Âişe'nin yanında yetişti. Babaannesi Esmâ bint Umeys, Zeyneb bint Cahş, İbn Abbas, İbn Ömer, Ebû Hüreyre ve Abdullah b. Amr'dan rivayet etti.

  Yahyâ b. Saîd el-Ensârî, Zührî, Nâfi', Sâlim b. Abdullah, Şa'bî, Rebîatü'r-re'y ve Eyyûb es-Sahtiyânî ondan hadis aldı. Mescid-i Nebevî'de ders halkası vardı ve fukahâ-yi seb'a arasında sayılır. Zührî, fetvanın Kāsım ve Sâlim'de toplandığını belirtmiş; Yahyâ b. Saîd, Medine'de ondan daha faziletlisini görmediğini söylemiştir.

  İbn Maîn, Ubeydullah–Kāsım–Âişe zincirini "altın yaldızlı sened" diye nitelemiştir. Ömer b. Abdülazîz, ilmin kaybolmasından endişe ederek Medine valisine özellikle Kāsım'ın rivayetlerini derleme emri vermiştir. Bilmediği soruları cevaplamaz, görüşlerini kesin hakikat değil şahsî kanaat olarak sunardı.

  Ca'fer es-Sâdık, kızı Ümmü Ferve'den torunudur. Ömrünün son üç yılında gözleri görmedi; 107'de (106 da denir) bir hac veya umre yolculuğunda Kudeyd'de vefat etti ve Müşellel'e defnedildi.
