biyografi: |
  Ebû Abdillâh İkrime b. Abdillâh el-Berberî, tahminen 21'de doğdu; aslen Mağribli bir Berberîdir. Basra valisi Abdullah b. Abbas'a hediye edildi ve kırk yıl onun derslerine bağlı kaldı. İbn Abbas, yetiştiğini görünce onu halka fetva vermekle görevlendirdi. İbn Abbas'ın vefatından sonra oğlu Ali onu sattıysa da İkrime'nin "babanın ilmini sattın" itirazı üzerine satışı bozup âzat etti.

  Hasan b. Ali, Hz. Âişe, Ebû Hüreyre ve Câbir'den de rivayet etti. Ondan yaklaşık üç yüz kişi rivayet etmiştir; İbrâhim en-Nehaî, Şa'bî, Katâde, Zührî, Amr b. Dînâr ve A'meş bunlar arasındadır. Katâde, tefsiri en iyi bilen kişinin İkrime olduğunu söylemiştir. Horasan, Semerkant, İsfahan, Basra, Kûfe, Mısır ve Mağrib'i dolaştı.

  Eyyûb es-Sahtiyânî, Yahyâ b. Maîn, Nesâî ve Ahmed b. Hanbel onu sika saydı; Buhârî Sahîh'inde 139 rivayetine yer verdi. Buna karşılık Mâlik'in onu sika görmediği, bazılarının ağır ithamda bulunduğu nakledilir; Ebû Hâtim bu eleştirilerin bazı görüşlerinin benimsenmemesinden kaynaklandığını belirtmiştir. Hâricî fırkalara nisbet edilmesinin siyasî ilişkilerinden doğduğu, itikadî bir delile dayanmadığı ifade edilir.

  Medine yönetimi tarafından arandığı için Dâvûd b. Husayn'ın evinde gizlendi ve orada 105'te vefat etti. Şair Küseyyir ile aynı gün öldüğü için halkın en büyük fakih ile en büyük şairin öldüğünü söylediği nakledilir.
