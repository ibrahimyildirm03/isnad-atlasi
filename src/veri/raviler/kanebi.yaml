ozet: Muvatta'ın en güvenilir râvilerinden; Buhârî, Müslim ve Ebû Dâvûd'un hocası.
biyografi: |
  130'dan sonra doğdu; dedesine nisbetle "Ka'nebî" diye meşhur oldu. Aslen Medineli olup Basra'da, daha sonra Mekke'de yaşadı. Babası Mesleme, dayısı ve kardeşleri de muhaddistir.

  Otuz yıldan fazla talebelik ettiği Mâlik b. Enes başta olmak üzere İbn Ebî Zi'b, Şu'be ve Hammâd b. Seleme'den hadis aldı. Mâlik, kıraat yoluyla rivayeti semâdan üstün gördüğü için el-Muvatta'ın ilk yarısını ona okumuş, ikinci yarısını ise Ka'nebî hocasına okumuştur; bu rivayet neşredilmiştir.

  Buhârî, Müslim, Ebû Dâvûd, Ebû Hâtim, Ebû Zür'a, Abd b. Humeyd ve Dârimî ondan rivayet etti. Mâlik onu övmüş, Ebû Hâtim "sika, hüccet" demiştir. Rivayetleri İbn Mâce dışında Kütüb-i Sitte'de yer alır; Buhârî'de 123, Müslim'de yetmiş rivayeti vardır. Muharrem veya Safer 221'de Mekke'de vefat etti.

  Safedî'nin naklettiğine göre ibadeti ve faziletinden dolayı "er-Râhib" diye anılırdı ve duası makbul bir kişiydi. Muvatta'ı başkasının okumasıyla yetinmeyip kendisi okumak istemiştir. Müslim'in en yaşlı hocası olduğu kaydedilir.
