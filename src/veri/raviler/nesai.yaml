biyografi: |
  215'te Horasan'daki Nesâ'da doğdu. Küçük yaşta Kur'an'ı ezberledi, on beş yaşında hadis öğrenmeye başladı. 230/844'te Belh yakınındaki Bağlân'a giderek Kuteybe b. Saîd'in yanında on dört ay kaldı. Horasan, Hicaz, Irak, Cezîre ve Suriye'nin ilim merkezlerini dolaşıp yaklaşık 450 hocadan faydalandı; İshâk b. Râhûye, Bündâr ve Muhammed b. el-Müsennâ bunlar arasındadır.

  Mısır'a yerleşti ve talebeler hadis okumak için onun yanına geldi. 11.770 hadis ihtiva eden es-Sünenü'l-kübrâ'sı, el-Müctebâ adıyla bilinen 5758 hadislik es-Sünen'inin kaynağıdır; el-Müctebâ sünenler arasında en az zayıf hadis içeren eser kabul edilir. Râvi şartları Buhârî ve Müslim'inkinden bile ağırdır; zayıf saydığı bir râviden, isnadı ne kadar yüksek olursa olsun rivayet etmezdi.

  Zehebî onu râvi tenkidinde Buhârî ve Ebû Zür'a seviyesinde görür; ed-Duafâ ve'l-metrûkîn'de zayıf râvileri kısa ifadelerle değerlendirmiştir. Dârekutnî, kendi çağında hadis ilminde onun herkesin önünde olduğunu söylemiştir.

  Dımaşk'ta Hz. Ali karşıtlığının yaygınlığını görünce Hasâisü Alî'yi yazdı. Muâviye hakkındaki bir soruya verdiği cevap yüzünden darp edildiği, Mekke'ye götürülüp orada vefat ettiği rivayet edilir; Zehebî ise İbn Yûnus'un Remle'de vefat ettiği yolundaki bilgisini daha güvenilir bulur. Vefatı 303 yılındadır; Kütüb-i Sitte müelliflerinin en son vefat edenidir.
