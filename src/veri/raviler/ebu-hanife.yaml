biyografi: |
  80/699'da Kûfe'de doğdu; ailesinin aslı hakkında farklı rivayetler vardır. Gençliğinde kumaş ticaretiyle uğraştı, ardından kendini ilme verdi. Yaklaşık on sekiz yıl Hammâd b. Ebî Süleymân'ın derslerine devam etti ve onun vefatından sonra Kûfe'deki fıkıh halkasını devraldı. Atâ b. Ebî Rebâh, İkrime, Şa'bî ve A'meş gibi hocalardan da ilim aldı.

  Emevîler'in teklif ettiği kadılık ve hazine görevlerini kabul etmediği için hapsedilip dövüldü. Abbâsî halifesi Mansûr'un Bağdat kadılığı teklifini de reddetti; bu yüzden hapse atıldı ve Bağdat'ta vefat etti.

  Hükümlerini Kur'an, sünnet, sahâbenin icmâı, kıyas ve istihsana dayandırdı. Meseleleri talebeleriyle birlikte tartışıp sonuca bağlayan kolektif bir ders halkası yürüttü; bu usul Hanefî fıkhının sistemli gelişmesini sağladı. Ebû Yûsuf, Muhammed b. el-Hasen, Züfer b. Hüzeyl ve Abdullah b. el-Mübârek talebeleri arasındadır; mezhebi özellikle Ebû Yûsuf ile İmam Muhammed'in eserleri taşıdı.

  Ehl-i sünnet akidesinin şekillenmesine katkı veren erken kelâmcılardan sayılır; kendisine nisbet edilen akaid risalelerinin bir kısmının aidiyeti tartışmalıdır. Hakkında övgü yanında eleştiriler de vardır: Şâfiî'nin fıkıhta herkesin ona muhtaç olduğunu söylediği nakledilir; Buhârî ve İbn Hibbân gibi muhaddisler ise bazı görüşlerini eleştirmiştir.
