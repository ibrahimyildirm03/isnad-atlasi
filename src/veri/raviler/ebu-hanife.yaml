isim: Ebû Hanîfe
tam_isim: Ebû Hanîfe en-Nu'mân b. Sâbit
tabaka: etbau-t-tabiin
isim_bilgisi:
  ism: Nu'mân
  kunye: Ebû Hanîfe
  lakap: İmâm-ı A'zam
  nesep: en-Nu'mân b. Sâbit b. Zûtâ (Zûtî)
  nesep_arapca: النعمان بن ثابت بن زوطى التيمي الكوفي
  nisbeler:
    - et-Teymî (mevlâ)
    - el-Kûfî
  aciklama: Dedesi Zûtâ'nın Kâbil'den esir alınıp Teymullah b. Sa'lebe oğullarına mevlâ olduğu rivayet edilir; "et-Teymî" nisbesi bu velâdan gelir. "Ebû Hanîfe" künyesinin bir kızına değil, "hanîf" (hakka yönelen) anlamına dayandığı söylenir.
dogum: {hicri: 80, miladi: 699}
