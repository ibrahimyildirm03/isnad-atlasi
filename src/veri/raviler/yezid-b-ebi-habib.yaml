biyografi: |
  Ebû Recâ Yezîd b. Ebî Habîb el-Mısrî, anne ve babası köle olduğu için köle olarak doğdu, sonradan âzat edildi. Babası Dongolalı olup 31'deki Nûbe seferinde esir alınmıştı. Yezîd muhtemelen 50-53 arasında Fustat'ta doğdu.

  Son vefat eden sahâbîlerden Abdullah b. el-Hâris ve Ebü't-Tufeyl'den, tâbiîlerden Atâ b. Ebî Rebâh, İkrime, Sâlim ve Nâfi'den ilim aldı. İbn İshak, Leys b. Sa'd, İbn Lehîa ve Amr b. el-Hâris talebeleri arasındadır; en önemlisi Leys b. Sa'd'dır. İbn İshak Mısır'da ondan siyer ve megāzî bilgisi almıştır.

  Mısır'da fıkıh öğretimini ilk başlatan âlim olarak tanınır; hadisle fıkhı birlikte okuttu. Ömer b. Abdülazîz, Mısır'da fetva vermek üzere görevlendirdiği üç kişiden biri olarak onu seçti. Hadis âlimleri onu oybirliğiyle sika ve hüccet kabul etmiştir; rivayetleri Kütüb-i Sitte'de yer alır.

  İsyanı onaylamamakla birlikte yönetime mesafeli durdu; ilk üç halifenin meşruiyetini savunup bu görüşü Mısır'da yaydı. Duyulan bir hadisin, kayıp eşya gibi ilan edilip tanınıyorsa alınmasını tavsiye ederdi. 128'de vefat etti.
