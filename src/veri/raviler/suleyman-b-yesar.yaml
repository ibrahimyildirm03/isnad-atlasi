bolge: medine
ozet: Resûlullah'ın hanımı Meymûne'nin azatlısı; Medine'nin yerleşik uygulamalarını en iyi bilen fakihlerden.
biyografi: |
  Ebû Eyyûb Süleymân b. Yesâr el-Hilâlî 34'te doğdu; İran asıllı Yesâr'ın dört oğlundan biridir. Babası ve kardeşleri gibi Hz. Meymûne'nin âzatlısıydı; Meymûne velâ hakkını yeğeni İbn Abbas'a bağışladı. Ağabeyi Atâ b. Yesâr da Medine fakihlerindendir.

  Câbir b. Abdullah, Râfi' b. Hadîc, Ebû Saîd el-Hudrî, Zeyd b. Sâbit, Ebû Hüreyre, İbn Abbas, İbn Ömer, Meymûne, Ümmü Seleme, Hz. Âişe ve Urve'den rivayet etti. Amr b. Dînâr, Ebü'z-Zinâd, Zührî, Mekhûl, Nâfi', Yahyâ b. Saîd el-Ensârî, Rebîatü'r-re'y ve Zeyd b. Eslem ondan hadis aldı.

  Fukahâ-yi seb'adandır. Saîd b. el-Müseyyeb onu döneminin en bilgili kişisi sayıp bazı konularda ona danışılmasını istemiş; Mâlik ve bazı âlimler onu Saîd'in önünde görmüştür. Geçmiş uygulamalar ve Medine icmâı konusundaki bilgisiyle öne çıktı; talâk meselelerini en iyi bilenlerdendi.

  Ömer b. Abdülazîz'in Medine valiliğinde danışma meclisinde bulundu ve Medine çarşısının düzeniyle görevlendirildi. Hadiste güvenilir kabul edilir; rivayetleri Kütüb-i Sitte'de yer alır. Kuvvetli rivayete göre 107'de vefat etti.
