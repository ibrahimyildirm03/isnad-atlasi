biyografi: |
  Hicretten on yıl önce (612) doğdu. Hz. Peygamber Medine'ye geldiğinde on yaşındaydı; annesi Ümmü Süleym onu Resûlullah'ın hizmetine verdi. On yıl hizmet ettiği için "Hâdimü Resûlillâh" diye anıldı.

  Annesinin isteğiyle Hz. Peygamber onun ömrü, malı ve evlâdı için dua etti; uzun ömrü boyunca soyundan yüz yirmiden fazla kişinin vefatını gördüğü nakledilir. Hz. Ömer döneminde Basra'ya yerleşti. Haccâc'ın baskısına maruz kaldı ve mallarına el konuldu.

  Bakī b. Mahled'in Müsned'indeki 2286 rivayetiyle müksirûn arasında üçüncüdür. Rivayette titizdi; hadisin sonuna "ev kemâ kāle Resûlullah" (ya da Resûlullah'ın dediği gibi) ifadesini eklerdi. Basra'da vefat eden son sahâbîlerdendir; vefatı genellikle 93 yılı olarak verilir.

  Hasan el-Basrî, İbn Sîrîn, Katâde, Sâbit el-Bünânî, Humeyd et-Tavîl ve Zührî onun talebeleri arasındadır.
