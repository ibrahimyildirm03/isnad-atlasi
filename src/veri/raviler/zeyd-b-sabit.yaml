biyografi: |
  Hicretten on bir yıl önce (611) Medine'de doğdu; Hazrec'in Neccâroğulları kolundandır. Küçük yaşta babasını kaybetti. Zekâsı ve hafızasıyla dikkat çekti; Hz. Peygamber Medine'ye gelmeden önce on yedi sûre ezberlemişti.

  Yahudilerle yazışmalarda yardımcı olmak için İbrânîce ya da Süryânîce yazmayı öğrendi. Vahiy kâtiplerinden biri oldu ve Kur'an'ı ezberleyen dört Ensârîden biri sayıldı. Hz. Ebû Bekir döneminde Kur'an'ın cem'i heyetine, Hz. Osman döneminde mushafların istinsahını yürüten heyete başkanlık etti.

  Hz. Ömer döneminde Medine'de davalara baktı, Hz. Osman döneminde beytülmal işleriyle ilgilendi. Ferâiz (miras hukuku) bilgisiyle öne çıktı ve Medine fıkhının kaynaklarından oldu; Şâfiî'nin ferâiz görüşlerinde onun etkisi görülür. Ahmed b. Hanbel'in Müsned'inde doksan dokuz hadisi bulunur.

  Ebû Hüreyre ve İbn Abbâs gibi sahâbîler ile Saîd b. el-Müseyyeb, Kabîsa b. Züeyb, Ebû Abdirrahmân es-Sülemî ve oğlu Hârice ondan rivayet etti. Vefatı için 45, 51 ve 55 yılları zikredilir; en çok tercih edilen 45'tir.
