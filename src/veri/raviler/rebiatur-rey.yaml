ozet: Medine re'y ekolünün temsilcisi; İmam Mâlik'in fıkıh hocası.
biyografi: |
  Rebîa b. Ebî Abdirrahmân Ferruh, tahminen 70 civarında Medine'de doğdu; Teym kabilesinin Münkediroğulları kolunun mevlâsıdır ve babasının adından Fars asıllı olduğu anlaşılır. Annesi ona hamileyken babasının Horasan'a gazaya gittiği nakledilir.

  Enes b. Mâlik ve Sâib b. Yezîd gibi sahâbîlerden; Saîd b. el-Müseyyeb, Kāsım b. Muhammed, Sâlim b. Abdullah ve Süleyman b. Yesâr'dan rivayet etti. Mâlik, Süfyân es-Sevrî, Evzâî, Leys b. Sa'd, Şu'be ve Yahyâ b. Saîd el-Ensârî ondan hadis aldı; İbn Sa'd, Muhammed el-Bâkır ve Ca'fer es-Sâdık'ın da Mescid-i Nebevî'deki halkasına katıldığını kaydeder.

  Hadis merkezi Medine'de yaşamasına rağmen re'y ekolünün ilk büyük temsilcilerinden sayıldı ve bu yüzden "Rebîatü'r-re'y" diye anıldı. Mâlik onun talebesiydi ve fıkhî birikiminin büyük kısmını ondan aldı; Mâlik, Sâlim ile Kāsım'dan sonra Medine'nin en büyük âlimi olarak onu görmüş, vefatından sonra fıkhın tadının kalmadığını söylemiştir.

  Abbâsî halifesi Seffâh onu Enbâr'a davet edip kadılık teklif ettiyse de teklifi ve hediyeyi reddetti; Irak'ta kaldığı sürece ne hadis rivayet etti ne fetva verdi. Bilinen bir eseri yoktur, görüşleri Muvatta' gibi eserlerde yer alır. 136'da Enbâr'da veya Medine'de vefat etti.
