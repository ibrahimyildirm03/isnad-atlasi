ozet: Günümüze ulaşan en eski hadis kitaplarından el-Câmi'in müellifi; Zührî'nin Yemen'e taşıyıcısı, Abdürrezzâk'ın hocası.
biyografi: |
  95 veya 96'da Basra'da doğdu; Ezd kabilesinin âzatlısıdır. Hasan-ı Basrî'nin cenazesine katıldıktan sonra on dört yaşında Katâde'nin derslerine başladı. Zührî, Amr b. Dînâr ve Hemmâm b. Münebbih başlıca hocalarıdır; A'meş, Yahyâ b. Ebî Kesîr ve Zeyd b. Eslem'den de faydalandı.

  Medine, Dımaşk, Horasan, Kûfe ve Yemen'e yolculuk yaptı; ticaret seyahatlerini ilim yolculuğuna dönüştürdü. Yemenliler onu orada tutmak için evlendirdiler ve San'a'ya yerleşti. En yakın talebeleri Abdürrezzâk ile San'a kadısı Hişâm b. Yûsuf'tur; Abdürrezzâk'ın ondan on bin hadis yazdığı rivayet edilir. Sevrî, İbn Uyeyne, Şu'be ve İbnü'l-Mübârek de ondan rivayet etti.

  el-Câmi' adlı eseri günümüze ulaşan en eski hadis kitaplarındandır ve 1614 hadis içerir; Abdürrezzâk bu eseri kendi Musannef'inin sonuna eklemiştir. Hemmâm b. Münebbih'in Sahîfe'sini de rivayet etti. Yemen'de ilk eser telif eden ve hadisleri tedvin eden kişi olarak anılır.

  Zührî'den rivayet edenlerin en güvenilirlerinden sayıldı; Ebû Hâtim, kitapları yanında olmadan Basra'da yaptığı rivayetlerde hatalar olduğunu söylemiştir. Rivayete dayanan fıkhıyla müctehid bir fakih kabul edilir. Ramazan 153'te Yemen'de vefat etti.
