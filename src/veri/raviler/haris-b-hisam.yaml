ozet: Ebû Cehil'in kardeşi; Mekke'nin fethinde müslüman oldu, Şam fetihlerine katıldı. Vahyin nasıl geldiğini Resûlullah'a soran sahâbî olarak Buhârî'nin Sahîh'inin başında anılır; Ebû Bekr b. Abdirrahmân'ın dedesidir.
biyografi: |
  Kureyş'in önde gelen isimlerindendir; cömertliğiyle tanınırdı. Ebû Cehil'in kardeşi, Hâlid b. Velîd'in amcasının oğludur. Bedir ve Uhud'da müşriklerin safında yer aldı; Bedir'de meydandan kaçtı ve bunu savunduğu şiirleri savaştan kaçanların mazeretine örnek gösterilmiştir.

  Mekke'nin fethinde Ümmü Hânî'nin evine sığındı; Hz. Peygamber onu himayesine aldı ve aynı gün müslüman oldu. Huneyn'e katıldı; Hz. Peygamber müellefe-i kulûbdan olarak ona yüz deve verdi ve bundan sonra samimi bir müslüman oldu.

  Hz. Ebû Bekir döneminde bütün malını ayırarak Şam seferine katıldı ve Ecnâdeyn'de sancak taşıdı. 18/639'da Amvâs vebasında, bir rivayete göre de Yermük'te vefat etti. Torunu Ebû Bekr b. Abdirrahmân Medine'nin yedi fakihinden biridir.
