ozet: Basra râvilerini en iyi bilen hâfız; Mâlik'in görüşlerini Basra'da yayan, Şâfiî'ye er-Risâle'yi yazdıran muhaddis.
biyografi: |
  135 civarında Basra'da doğdu; inci ticaretiyle uğraştığı için "el-Lü'lüî" diye de anıldı. Önce Kur'an'ı ezberledi, on beş yaşında hadise başladı. Şu'be, Mâlik, Süfyân b. Uyeyne ve Süfyân es-Sevrî'den ilim aldı.

  Yazmaktan çok ezberlemeye önem verdi; yirmi bin hadis ezberlediği rivayeti mübalağalı olsa da hafızasının gücünü gösterir. Hadisi lafzıyla rivayet etmeyi tercih etti; Basra muhaddislerinin rivayet yollarını ve râvilerin durumunu en iyi bilen kişi olarak tanındı. Yahyâ el-Kattân ile birlikte devrinin iki büyük râvi münekkidi sayılır.

  Fıkıhta Medine ekolüne bağlıydı ve İmam Mâlik'in görüşlerinin Basra'da yayılmasında önemli rol oynadı; Basra'da kadılığa ondan daha lâyık kimse bulunmadığı söylenmiştir. 180/796'da Bağdat'a yerleşip ders verdi. Her gece Kur'an'ın yarısını okuyarak iki günde bir hatim indirdiği rivayet edilir.

  Mu'tezile ve Cehmiyye'nin sıfatlar konusundaki görüşlerine karşı çıktı. Ahmed b. Hanbel, onun meçhul bir râviden rivayet etse bile hüccet olduğunu söylemiştir. Ahmed b. Hanbel, Yahyâ b. Maîn, İshâk b. Râhûye ve Ali b. el-Medînî onun talebeleridir. 198'de vefat etti.
