biyografi: |
  Ebû Üsâme Zeyd b. Eslem el-Adevî, Hz. Ömer'in âzatlısı Eslem'in oğludur ve Medine tefsir ekolünün öncülerindendir. Babası, ağabeyi Hâlid, İbn Ömer, Hz. Âişe, Seleme b. el-Ekva', Enes b. Mâlik, Atâ b. Yesâr ve Muhammed b. Kâ'b el-Kurazî'den rivayet etti.

  Oğulları Üsâme, Abdullah ve Abdurrahman ile Eyyûb es-Sahtiyânî, Yahyâ b. Saîd el-Ensârî, Evzâî, Ma'mer, Mâlik ve iki Süfyân talebeleri arasındadır. Mescid-i Nebevî'deki hadis ve fıkıh halkasında en az kırk fıkıh talebesinin devamlı bulunduğu nakledilir; gereksiz tartışmalara sert biçimde karşı çıkardı. Rivayetleri Kütüb-i Sitte'de yer alır; Müsned'de ondan iki yüzden fazla hadis vardır.

  Ma'din-i Benî Süleym'de yöneticilik yaptı; Ömer b. Abdülazîz ve II. Velîd'in danışma meclislerinde bulundu. Lugat ilmiyle ilgilendi; oğlu Abdurrahman'ın rivayet ettiği tefsiri Taberî ve Begavî tarafından nakledilmiş, Mâlik de bu tefsirden yararlanmıştır. Tefsirde re'ye fazla başvurduğu eleştirisi hadisteki güvenilirliğini zedelemez.

  Heybetli, alçakgönüllü ve hoşgörülüydü; günahkârları Allah'ın rahmetiyle ümitlendirirdi. Zilhicce 136'nın ilk on gününde vefat etti.
