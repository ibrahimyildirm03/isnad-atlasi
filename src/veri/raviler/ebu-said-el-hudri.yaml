ozet: Müksirûnun yedincisi; genç sahâbîlerin en âlimi sayılan "Medine müftüsü".
biyografi: |
  Medine'de Hazrec kabilesinden doğdu. On üç yaşındayken Uhud'a katılmak istedi, yaşı küçük olduğu için geri çevrildi. Hendek'e ve sonraki on iki kadar gazveye katıldı; Bey'atü'r-rıdvân'da ilk biat edenlerdendi.

  Genç sahâbîlerin en âlimi sayıldı; kendisine "imam" ve "Medine müftüsü" denildi. Bakī b. Mahled'in Müsned'inde 1170, Sahîhayn'da 111 rivayeti vardır. Hadislerin yazılmasını hoş görmeyen rivayetin râvisi olarak bilinir. Mervân'ın bayram hutbesini namazdan öne almasına karşı çıktı. 74 yılında Medine'de vefat etti.
