  nisbeler: [el-Hanzalî, et-Temîmî, el-Mervezî]
  aciklama: Babası Türk, annesi Hârizmlidir; Temîm'in Hanzala koluna velâ bağıyla nisbet edilir.
dogum: {hicri: 118, miladi: 736}
vefat: {hicri: 181, miladi: 797, not: "Ramazan 181"}
