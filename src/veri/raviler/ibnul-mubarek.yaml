      kaynak: DİA, "Abdullah b. Mübârek"
ozet: Horasan'da hadisi ilk tedvin eden âlim; muhaddis, zâhid, mücahid ve Ebû Hanîfe'nin talebesi.
biyografi: |
  118'de Merv'de doğdu; babasının Türk, annesinin Hârizmli bir Türk olduğu rivayet edilir. Gençlik yıllarını Merv'de geçirdi; ilk hocası Rebî' b. Enes'tir. Yirmi üç yaşında ilk ilim yolculuğuna çıktı; Basra, Hicaz, Yemen, Mısır, Şam ve Irak'ta bulundu.

  Başkalarına muhtaç olmamak için ticaretle uğraştı; kazancıyla âlimleri, hadis talebelerini ve fakirleri destekledi, her yıl yüz bin dirhem dağıttığı rivayet edilir. Hârûnürreşîd döneminde Massîsa ve Tarsus çevresinde Bizans'a karşı savaştı ve birçok defa hacca gitti.

  Ebû Hanîfe'nin talebesi ve dostuydu; fıkıhta onun metodunu benimsedi ve onu öven şiirler yazdı. Ebû Hanîfe'nin vefatından sonra Mâlik'in halkasına katıldı ve iki ekolün yaklaşımını birleştiren bir usul geliştirdi. Ma'mer, Evzâî, A'meş, Süfyân es-Sevrî ve İbn Uyeyne'den de hadis aldı; Horasan'da hadisi ilk tedvin eden âlim sayılır.

  Kitâbü'z-Zühd ve'r-rekāik, cihad konusundaki ilk eser olan Kitâbü'l-Cihâd, el-Müsned ve Kitâbü'l-Birr ve's-sıla günümüze ulaşmıştır. İsmâil b. Ayyâş, Allah'ın ona vermediği hiçbir güzel haslet kalmadığını söylemiştir. Bir seferden dönerken 181'de Fırat kenarındaki Hît'te vefat etti.
