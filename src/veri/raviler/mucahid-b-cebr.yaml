biyografi: |
  Mücâhid b. Cebr 21'de Mekke'de doğdu; Kays b. es-Sâib'in kölesiydi ve Kur'an bilgilerini ilk olarak ondan aldı. Abdullah b. Mes'ûd, Hz. Ali, Sa'd b. Ebî Vakkās, Ebû Hüreyre, Hz. Âişe, İbn Ömer ve İbn ez-Zübeyr'den tefsir, hadis ve fıkıh öğrendi.

  Kur'an'ı İbn Abbas'ın önünde otuz defa hatmetti ve baştan sona üç kez onunla birlikte tefsir etti. İbn Abbas'ın vefatından sonra Mekke tefsir ekolünde onun yerini aldı ve halkın fetva mercii oldu. Kur'an'daki olayları yerinde incelemek için Bâbil'e ve Hadramut'a gitti. İbn Kesîr ve Ebû Amr b. el-Alâ ondan kıraat aldı; İkrime, Atâ, Katâde, Amr b. Dînâr ve A'meş de ondan faydalandı.

  Kur'an'ı önce Kur'an'la, sonra sünnetle tefsir etti; Câhiliye şiiri ve esbâb-ı nüzûlden yararlandı, akla geniş yer verdi, İsrâiliyat kullanması ise eleştirildi. Katâde onu çağında tefsiri en iyi bilen kişi saymış; Şâfiî ve Buhârî tefsirine güvenmiştir. İbn Sa'd ve İbn Hibbân hadiste de sika olduğunu belirtir.

  Ona nisbet edilen tefsir talebeleri tarafından derlenmiş ve neşredilmiştir. 103'te Mekke'deki tâbiîn müfessirlerinin en yaşlısı olarak seksen iki yaşında vefat etti.
