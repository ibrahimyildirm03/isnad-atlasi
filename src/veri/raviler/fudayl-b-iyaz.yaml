biyografi: |
  Ebû Alî el-Fudayl b. İyâz et-Temîmî, Temîm kabilesinin Yerbû' boyundan Arap asıllı bir ailedendir ve 107'de doğdu. Oğlu Ebû Ubeyde'ye göre Semerkant'ta doğup Ebîverd'de yetişti; Merv'in Fundîn köyünden veya Buharalı olduğu da söylenir.

  Kuşeyrî'nin naklettiğine göre gençliğinde Merv ile Ebîverd arasında yol kesen bir çetenin reisiydi. Bir gece bir evin duvarına tırmanırken içeriden okunan bir âyeti duydu, derinden etkilenip tövbe etti ve kendini ibadete verdi. Kûfe'ye giderek Ebû Hanîfe, Süfyân es-Sevrî ve A'meş'in meclislerine devam etti; Mansûr b. el-Mu'temir ve A'meş'ten hadis rivayet etti.

  Süfyân b. Uyeyne, Yahyâ el-Kattân, Abdurrahman b. Mehdî ve İmam Şâfiî ondan hadis aldı; Zehebî onu güvenilir bir râvi sayar. Halife Hârûnürreşîd ile görüşmek istemedi, ısrar üzerine kabul edince düşüncelerini açıkça söyleyip ihsanını reddetti; âlimlerin devlet adamlarından uzak durmasını savundu.

  Korku, hüzün ve ağlama onun hâlleriydi; "bekkâîn"in önde gelenlerinden sayılır. Zühdü kanaat, kanaati de zenginlik olarak tanımladı; fazla yemek, uyumak ve konuşmanın kalbi katılaştırdığını söyledi. Oğlu Ali de zühdüyle tanınmış ve babasından önce vefat etmiştir. Fudayl Muharrem 187'de Mekke'de vefat etti.
