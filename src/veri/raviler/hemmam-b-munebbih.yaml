biyografi: |
  Ebû Ukbe Hemmâm b. Münebbih es-San'ânî, tahminen 40'ta Yemen'de doğdu. Babası Münebbih, Kisrâ'nın Habeşlilere karşı Yemen'e gönderdiği İranlı askerlerle gelip yerleşmiş ve Hz. Peygamber zamanında müslüman olmuştu; bu soydan gelenler gibi Hemmâm da "el-Ebnâvî" nisbesiyle anılır. Ağabeyi Vehb b. Münebbih ve yeğenleri de hadis okuyup okutmuştur.

  Gençliğinde Medine'ye gidip Ebû Hüreyre'den hadis öğrendi; Muâviye, İbn Abbas, İbn ez-Zübeyr ve İbn Ömer'den de rivayet etti. Ağabeyi Vehb, yeğenleri ve Ma'mer b. Râşid ondan hadis aldı.

  Ebû Hüreyre'den öğrendiği hadisleri es-Sahîfetü's-sahîha adlı mecmuada topladı. Günümüze ulaşan ilk yazılı hadis metinlerinden olan bu eser Hemmâm, Ma'mer ve Abdürrezzâk yoluyla Ahmed b. Hanbel, Buhârî ve Müslim'e ulaşmıştır. Sıfatlar, ibadetler, ahlâk, peygamberler, cennet ve cehennem gibi konularda 139 hadis içerir. Muhammed Hamîdullah eseri 1953'te tanıtıp yayımlamış, sonra Türkçe dahil birçok dile çevrilmiştir.

  Kaynakların hepsi onu güvenilir bir muhaddis kabul eder; rivayetleri Müsned ve Kütüb-i Sitte'de yer alır. San'a'da vefat etti; cenaze namazını San'a valisi kıldırdı.
