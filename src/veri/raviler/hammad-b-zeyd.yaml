biyografi: |
  Kaynakların çoğuna göre 98'de Basra'da doğdu. Dedesi Dirhem Sîstanlı esirlerdendir; babası Zeyd âzat edilmiş bir köleydi. "el-Ezdî" nisbesi Ezdoğulları'nın mevlâsı olmasından gelir.

  Sâbit el-Bünânî, Enes b. Sîrîn ve Amr b. Dînâr'dan hadis öğrendi; Eyyûb es-Sahtiyânî'nin halkasına yirmi yıl devam etti. Âsım b. Behdele ve Ebû Amr b. el-Alâ'dan kıraat vecihleri de rivayet etti. Süfyân es-Sevrî, Şu'be, Süfyân b. Uyeyne, İbnü'l-Mübârek, Vekî', Abdurrahman b. Mehdî ve Ali b. el-Medînî ondan rivayette bulundu; rivayetleri Kütüb-i Sitte'de yer alır.

  Gözleri görmediği halde hadisleri ezberden rivayet etti; ezberinde yaklaşık 4000 hadis bulunduğu ve tedlîs yapmadığı kaydedilir. Yahyâ b. Maîn, Eyyûb'dan gelen en sağlam rivayetlerin onunkiler olduğunu söylemiş; Basra'daki itibarı Kûfe'de Sevrî, Hicaz'da Mâlik ve Şam'da Evzâî'ninkiyle denk tutulmuştur.

  Hammâd b. Seleme ile birlikte "Hammâdân" diye anılır; âlimler onu hadiste daha sağlam, Hammâd b. Seleme'yi daha dindar bulmuştur. 19 Ramazan 179'da Basra'da vefat etti; cenaze namazını Basra valisi kıldırdı.
