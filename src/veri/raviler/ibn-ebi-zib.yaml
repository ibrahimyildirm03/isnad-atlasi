ozet: Mâlik'in çağdaşı Medine fakihi ve muhaddisi; emr-i bi'l-ma'rûftaki cesaretiyle tanınan zâhid.
biyografi: |
  Ebü'l-Hâris Muhammed b. Abdirrahmân el-Âmirî, 80 sonlarında Medine'de doğdu; üçüncü kuşaktaki dedesi Ebû Zi'b'e nisbetle "İbn Ebî Zi'b" diye tanındı. İkrime, Nâfi' ve Saîd el-Makbürî'den hadis öğrendi; Zührî'ye hadislerini arz yoluyla okudu.

  Ma'mer, Süfyân es-Sevrî, İbnü'l-Mübârek, Vekî', Yahyâ el-Kattân, Ebû Nuaym ve Yezîd b. Hârûn ondan rivayet etti. Ahmed b. Hanbel onu "sika sadûk" diye nitelemiş, Saîd b. el-Müseyyeb'e benzetildiğini ve bazı yönlerden Mâlik'ten üstün olduğunu söylemiştir. Ashâbü'l-hadîsin fakihlerinden sayılır; Dârekutnî bir Muvatta' yazdığını kaydeder.

  Emr-i bi'l-ma'rûf konusunda titizdi; halifelerin zulmünü yüzlerine karşı açıkça söylediği nakledilir. Gün aşırı oruç tutar, yaz kış aynı elbiseyi giyer, ekmek ve zeytinyağıyla yetinirdi. Halife tarafından hadis rivayeti için Bağdat'a davet edildi; Medine'ye dönerken 159'da Kûfe'de vefat etti.
